/* ---------- generic press-drag ---------- */
function noScroll(e){e.preventDefault();}
function lockScroll(on){
  if(on){document.addEventListener('touchmove',noScroll,{passive:false});document.body.classList.add('nosel');}
  else{document.removeEventListener('touchmove',noScroll,{passive:false});document.body.classList.remove('nosel');}
}
function pressDrag(el,o){
  el.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(o.ignore&&o.ignore(e))return;
    var quick=(e.pointerType==='mouse'), sx=e.clientX, sy=e.clientY, active=false, moved=false, timer=0;
    if(!quick) timer=setTimeout(start,240);
    function start(){
      if(active)return; active=true; timer=0;
      try{el.setPointerCapture(e.pointerId);}catch(err){}
      lockScroll(true); o.start(e);
    }
    function move(ev){
      var dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!active){
        if(quick){ if(Math.abs(dx)>3||Math.abs(dy)>3) start(); else return; }
        else { if(Math.abs(dx)>9||Math.abs(dy)>9){ done(); } return; }
      }
      moved=true; if(ev.cancelable) ev.preventDefault(); o.move(ev);
    }
    function up(ev){
      var was=active, mv=moved; done();
      if(was) o.end(ev,mv); else if(!mv&&o.tap) o.tap(ev);
    }
    function done(){
      clearTimeout(timer); if(active){lockScroll(false);} active=false;
      window.removeEventListener('pointermove',move,{passive:false});
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
    }
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

/* ---------- timeline block drag / resize ---------- */
function wireBlock(el,t){
  if(!t)return;
  var wrap=$('#tlwrap'), mode='move', s0=0, d0=0, y0=0, sc0=0, lastY=0, raf=0;
  function paint(){
    el.style.top=((t.start-dayMin())*pxMin())+'px';
    var h=Math.max(t.dur*pxMin(),20); el.style.height=h+'px';
    el.classList.toggle('short',h<44);
    $('.bm',el).textContent=durStr(t.dur)+(t.seriesId?' ↻':'')+(t.folder?' · '+folderName(t.folder):'');
  }
  function apply(){
    var dy=(lastY-y0)+(wrap.scrollTop-sc0), dm=dy/pxMin();
    if(mode==='move'){
      t.start=Math.max(dayMin(),Math.min(dayMax()-t.dur,snapM(s0+dm)));
    }else{
      t.dur=Math.max(S.settings.snap*2,Math.min(dayMax()-t.start,snapM(d0+dm)));
    }
    paint();
  }
  function loop(){
    var r=wrap.getBoundingClientRect(),v=0;
    if(lastY<r.top+56) v=-10; else if(lastY>r.bottom-56) v=10;
    if(v){ wrap.scrollTop+=v; apply(); }
    raf=requestAnimationFrame(loop);
  }
  var __didDrag=false;
  el.addEventListener('click',function(e){
    if(__didDrag){ __didDrag=false; return; }
    if(e.target.closest('[data-act]')) return;
    openTaskInfo(t);
  });
  var ckb=$('.bchk',el);
  if(ckb) ckb.addEventListener('click',function(e){
    e.stopPropagation(); markDone(t);
  });
  pressDrag(el,{
    ignore:function(e){ return !!e.target.closest('[data-act]'); },
    start:function(e){
      mode=e.target.closest('.rz')?'resize':'move';
      s0=t.start; d0=t.dur; y0=e.clientY; sc0=wrap.scrollTop; lastY=e.clientY;
      el.classList.add('dragging'); raf=requestAnimationFrame(loop);
    },
    move:function(e){ lastY=e.clientY; apply(); },
    end:function(ev,mv){
      cancelAnimationFrame(raf); el.classList.remove('dragging');
      __didDrag=!!mv;
      save(); render();
    }
  });
}

/* ---------- tap empty timeline ---------- */
$('#tl').addEventListener('click',function(e){
  if(e.target.closest('.block'))return;
  if(e.target.closest('.cblock'))return;
  var r=$('#tl').getBoundingClientRect();
  var m=dayMin()+(e.clientY-r.top)/pxMin();
  m=Math.max(dayMin(),Math.min(dayMax()-S.settings.dur,Math.round(m/15)*15));
  openEditor(null,{date:S.date,start:m});
});

/* ---------- клики в списке дня ---------- */
$('#daylist').addEventListener('click',function(e){
  var row=e.target.closest('.drow'), gap=e.target.closest('.dgap');
  if(row&&e.target.closest('[data-act="del"]')){ delTask(byId(row.dataset.id)); return; }

  if(gap){

    openEditor(null,{date:S.date,start:a,dur:Math.min(S.settings.dur,b-a)});
  }
});

/* ---------- backlog item: tap / quick plan / reorder ---------- */
function wireItem(el,t){
  if(!t)return;
  var ph=null, oy=0, ox=0, w=0;
  var ck=$('.chk',el);
  if(ck) ck.addEventListener('click',function(e){ e.stopPropagation(); markDone(t); });
  var ed=$('.edit',el);
  if(ed) ed.addEventListener('click',function(e){ e.stopPropagation(); openEditor(t); });
  var dl=$('.del',el);
  if(dl) dl.addEventListener('click',function(e){ e.stopPropagation(); delTask(t); });
  $('.go',el).addEventListener('click',function(e){
    e.stopPropagation(); openPlanner(t);
  });
  pressDrag(el,{
    ignore:function(e){return !!e.target.closest('[data-act]');},
    start:function(e){
      var r=el.getBoundingClientRect(); oy=e.clientY-r.top; ox=e.clientX-r.left; w=r.width;
      ph=document.createElement('div'); ph.className='ph'; ph.style.height=r.height+'px';
      el.parentNode.insertBefore(ph,el);
      el.style.width=w+'px'; el.style.left=r.left+'px'; el.style.top=r.top+'px';
      el.classList.add('floating'); document.body.classList.add('reorder');
    },
    move:function(e){
      el.style.top=(e.clientY-oy)+'px'; el.style.left=(e.clientX-ox)+'px';
      var lists=$$('#backlog .list'), best=null, bd=1e9, i;
      for(i=0;i<lists.length;i++){
        var r=lists[i].getBoundingClientRect();
        var d=(e.clientY<r.top)?r.top-e.clientY:(e.clientY>r.bottom?e.clientY-r.bottom:0);
        if(d<bd){bd=d;best=lists[i];}
      }
      if(!best)return;
      var items=$$('.item',best).filter(function(x){return x!==el;}), before=null;
      for(i=0;i<items.length;i++){
        var rr=items[i].getBoundingClientRect();
        if(e.clientY<rr.top+rr.height/2){before=items[i];break;}
      }
      best.insertBefore(ph,before);
    },
    end:function(){
      var list=ph.parentNode, pri=+list.dataset.pri;
      el.classList.remove('floating'); el.removeAttribute('style');
      document.body.classList.remove('reorder');
      list.insertBefore(el,ph); ph.remove(); ph=null;
      t.pri=pri;
      var nodes=$$('.item',list), i;
      for(i=0;i<nodes.length;i++){ var x=byId(nodes[i].dataset.id); if(x){x.pri=pri;x.ord=i;} }
      save(); renderBacklog();
    },
    tap:function(){ openEditor(t); }
  });
}

function markDone(t){
  if(!t)return;
  if(!canTick()) return;
  snapshot(); setDone(t,true); save(); render(); toast(T('已完成','Done'),true);
}

function openPlanner(t){
  var P={date:S.date,start:null};
  var sh=openSheet(
    '<div class="sh-h"><button class="tb" id="pCancel">'+tr('Отмена')+'</button><div class="t">'+tr('Запланировать')+'</div><span class="tb r"></span></div>'+
    '<div class="sh-b">'+
      '<div class="who">'+esc(t.title||tr('Без названия'))+' · '+durStr(t.dur)+'</div>'+
      '<div class="chips" id="pDays"></div>'+
      '<div class="card">'+
        '<div class="row"><span class="lbl">'+tr('Дата')+'</span><input type="date" id="pDate"></div>'+
        '<div class="row"><span class="lbl">'+tr('Начало')+'</span><input type="time" id="pTime" step="300"></div>'+
      '</div>'+
      '<div id="pSlots"></div>'+
      '<div id="pWarn"></div>'+
      '<button class="prim" id="pOk">'+tr('Поставить на выбранное время')+'</button>'+
      '<button class="subtle" id="pAuto">'+tr('Автоматически — первый свободный слот')+'</button>'+
    '</div>');

  function put(when,auto){
    if(when==null){ toast(tr('Выбери время')); return; }
    snapshot();
    t.date=P.date; t.start=Math.max(dayMin(),Math.min(dayMax()-t.dur,when));
    save(); closeSheet();
    setView('day'); goDay(P.date);
    toast((auto?tr('Автоматически:')+' ':'')+fmtDay(P.date)+', '+hhmm(t.start),true);
  }
  function refreshPlanner(){
    $('#pDate',sh).value=P.date;
    $('#pTime',sh).value=(P.start!=null)?hhmm(P.start):'';
    var d0=todayISO();
    $('#pDays',sh).innerHTML=[0,1,2].map(function(k){
      var d=addDays(d0,k);
      return '<button data-d="'+d+'" class="'+(d===P.date?'on':'')+'">'+esc(fmtDay(d))+'</button>';
    }).join('');
    $$('#pDays button',sh).forEach(function(b){b.addEventListener('click',function(){
      P.date=b.dataset.d; P.start=null; refreshPlanner();
    });});
    var win=freeWindows(P.date,t.dur,t.id);
    if(P.start==null&&win.length){ P.start=win[0].start; $('#pTime',sh).value=hhmm(P.start); }
    $('#pSlots',sh).innerHTML=windowsHTML(P.date,t.dur,t.id,'pChips');
    $$('#pChips button',sh).forEach(function(b){
      if(P.start!=null&&+b.dataset.m===P.start) b.classList.add('on');
      b.addEventListener('click',function(){ P.start=+b.dataset.m; refreshPlanner(); });
    });
    var c=(P.start==null)?[]:conflicts(P.date,P.start,t.dur,t.id);
    $('#pWarn',sh).innerHTML=c.length
      ? '<div class="warn">⚠︎ '+tr('Пересечётся с:')+' '+c.map(function(x){return esc(x.title||tr('дело'))+' ('+hhmm(x.start)+')';}).join(', ')+'</div>'
      : '';
  }
  $('#pDate',sh).addEventListener('change',function(){ if(this.value){P.date=this.value;P.start=null;refreshPlanner();} });
  $('#pTime',sh).addEventListener('change',function(){
    var p=this.value.split(':'); if(p.length===2){P.start=(+p[0])*60+(+p[1]);refreshPlanner();}
  });
  $('#pOk',sh).addEventListener('click',function(){ put(P.start,false); });
  $('#pAuto',sh).addEventListener('click',function(){
    var st=slotStarts(P.date,t.dur,t.id,1);
    if(!st.length){ toast(tr('На эту дату свободных слотов нет')); return; }
    put(st[0],true);
  });
  $('#pCancel',sh).addEventListener('click',closeSheet);
  refreshPlanner();
}

/* ---------- sheet ---------- */
var sheetEl=null,bdEl=null;
function openSheet(html){
  closeSheet();
  bdEl=document.createElement('div'); bdEl.className='bd'; bdEl.addEventListener('click',closeSheet);
  sheetEl=document.createElement('div'); sheetEl.className='sheet'; sheetEl.innerHTML='<div class="grab"></div>'+html;
  document.body.appendChild(bdEl); document.body.appendChild(sheetEl);
  return sheetEl;
}
function closeSheet(){
  if(sheetEl){sheetEl.remove();sheetEl=null;}
  if(bdEl){bdEl.remove();bdEl=null;}
}

/* ---------- editor ---------- */
function openEditor(task,pre){
  pre=pre||{};
  var isNew=!task;
  var E=task?{id:task.id,title:task.title,note:task.note,date:task.date,start:task.start,dur:task.dur,pri:task.pri,done:task.done,folder:task.folder,
              due:task.due||null,remind:(typeof task.remind==='number')?task.remind:-1,
              reminds:remindsOf(task),
              dailyDays:Array.isArray(task.dailyDays)?task.dailyDays.slice():null}
            :{id:null,title:'',note:'',date:pre.date||null,start:(pre.start!=null?pre.start:null),
              dur:pre.dur||S.settings.dur,pri:1,done:!!pre.done,folder:pre.folder||null,due:null,remind:-1,
              reminds:(pre.remind!=null?[pre.remind]:[]),dailyDays:null};
  var unsched=(E.period||task&&task.period)?(E.start==null):!(E.date&&E.start!=null);
  var srOld=(task&&task.seriesId)?seriesById(task.seriesId):null;
  E.rep=srOld?{kind:srOld.kind,days:(srOld.days||[]).slice()}:null;
  E.period=task?task.period:null;
  E.periodDays=(task&&Array.isArray(task.periodDays))?task.periodDays.slice():[];
  E.subs=(task&&Array.isArray(task.subs))?task.subs.map(function(x){return {id:x.id||uid(),title:String(x.title||''),done:!!x.done};}):[];
  E.pdAuto=false;
  var oldDate=task?task.date:null;

  var sh=openSheet(
    '<div class="sh-h"><button class="tb" id="eCancel">'+tr('Отмена')+'</button><div class="t">'+(isNew?tr('Новое дело'):tr('Дело'))+'</div>'+
    '<button class="tb r strong" id="eSave">'+tr('Готово')+'</button></div>'+
    '<div class="sh-b">'+
      '<input class="f-title" id="eTitle" placeholder="'+tr('Что нужно сделать?')+'" autocomplete="off">'+
      '<div class="seg p4" id="ePri">'+[0,1,2,URGENT].map(function(p){return '<button data-p="'+p+'">'+PRI[p].n+'</button>';}).join('')+'</div>'+
      '<div class="hint">'+tr('Папка')+'</div><div class="chips" id="eFolder"></div>'+
      '<div class="card">'+
        '<div class="row"><span class="lbl">'+tr('Без времени · в списке')+'</span>'+
          '<label class="sw"><input type="checkbox" id="eUn"><i></i></label></div>'+
        '<div id="eSched">'+
          '<div class="row" id="eDateRow"><span class="lbl">'+tr('Дата')+'</span><input type="date" id="eDate"></div>'+
          '<div class="row"><span class="lbl">'+tr('Начало')+'</span><input type="time" id="eTime" step="300"></div>'+
          '<div class="row"><span class="lbl">'+tr('Конец')+'</span><input type="time" id="eEnd" step="300"></div>'+
        '</div>'+
        '<div class="row"><span class="lbl">'+tr('Длительность')+'</span>'+
          '<div class="stp"><button id="eMinus">−</button><span class="v tap" id="eDurV"></span><input class="durinput" id="eDurI" type="number" inputmode="numeric" min="1" max="720" step="1" hidden><button id="ePlus">+</button></div></div>'+
        '<div class="row"><span class="lbl">'+tr('Выполнено')+'</span><label class="sw"><input type="checkbox" id="eDone"><i></i></label></div>'+
        '<div class="row"><span class="lbl">'+UIx('eDeadline')+'</span><input type="date" id="eDue"></div>'+
      '</div>'+
      '<div class="hint">'+UIx('eDurChips')+'</div><div id="eDurChips" class="chips"></div>'+
      '<div class="hint">'+UIx('eRemind')+'</div><div class="chips" id="eRem"></div>'+
      '<div class="remcust" id="eRemCust" hidden>'+
        '<span>'+T('提前','before')+'</span>'+
        '<input id="eRemMin" type="number" inputmode="numeric" min="1" max="1440" placeholder="30">'+
        '<span>'+T('分钟','min')+'</span>'+
        '<button id="eRemOk" aria-label="添加提醒" data-i18n-aria="添加提醒">+</button>'+
      '</div>'+
      '<div id="eRepBox">'+
        '<div class="hint" id="eRepHint">'+UIx('eRepeat')+'</div>'+
        '<div class="seg" id="eRep"><button data-r="none">'+UIx('repNone')+'</button><button data-r="daily">'+UIx('perDay')+'</button><button data-r="week">'+UIx('perWeek')+'</button><button data-r="month">'+UIx('perMonth')+'</button></div>'+
        '<div class="chips daysrow" id="eDays" hidden>'+WD.map(function(w,i){return '<button data-d="'+i+'">'+w+'</button>';}).join('')+'</div>'+
        '<div class="chips daysrow mrow" id="eMonth" hidden>'+(function(){var o='';for(var i=1;i<=31;i++)o+='<button data-d="'+i+'">'+i+'</button>';return o;})()+'</div>'+
        '<div id="eSeries"></div>'+
      '</div>'+
      '<div id="eWarn"></div>'+
      '<div id="eSlotsBox"></div>'+
      '<div class="hint">'+UIx('subTitle')+'<span class="subn" id="subCntLbl"></span></div>'+
      '<div class="card subcard" id="subCard">'+
        '<div id="subList"></div>'+
        '<div class="subadd"><input class="f-sub" id="subInp" placeholder="'+UIx('subPh')+'" autocomplete="off">'+
          '<button class="subbtn" id="subAdd" aria-label="加一条" data-i18n-aria="加一条">'+
          '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button></div>'+
      '</div>'+
      '<div class="hint" style="margin-top:-6px">'+UIx('subHint')+'</div>'+
      '<textarea class="f-note" id="eNote" placeholder="'+tr('Заметка')+'"></textarea>'+
      (isNew?'':'<button class="danger" id="eDel">'+(srOld?tr('Удалить только это'):tr('Удалить дело'))+'</button>')+
    '</div>');

  var tEl=$('#eTitle',sh);
  tEl.value=E.title;
  $('#eNote',sh).value=E.note||'';
  $('#eDone',sh).checked=!!E.done;
  $('#eUn',sh).checked=unsched;
  $('#eDue',sh).value=E.due||'';
  $('#eDue',sh).addEventListener('change',function(){ E.due=this.value||null; });
  var REM_QUICK=[0,5,10,30,60];
  function syncRem(){
    var box=$('#eRem',sh); if(!box) return;
    var sel=E.reminds||[];
    var extra=sel.filter(function(v){ return REM_QUICK.indexOf(v)<0; });
    var h='<button data-v="-1" class="'+(sel.length?'':'on')+'">'+UIx('remNone')+'</button>';
    h+=REM_QUICK.map(function(v){
      return '<button data-v="'+v+'" class="'+(sel.indexOf(v)>=0?'on':'')+'">'+remLabel(v)+'</button>';
    }).join('');
    h+=extra.map(function(v){
      return '<button data-v="'+v+'" class="on">'+remLabel(v)+'</button>';
    }).join('');
    h+='<button data-add="1" class="add">+ '+T('自定义','Custom')+'</button>';
    box.innerHTML=h;
    $$('#eRem button',sh).forEach(function(b){
      b.addEventListener('click',function(){
        if(b.dataset.add){
          var cu=$('#eRemCust',sh); if(cu){ cu.hidden=false; var mi=$('#eRemMin',sh); if(mi){ mi.value=''; mi.focus(); } }
          return;
        }
        var v=+b.dataset.v;
        if(v<0){ E.reminds=[]; }
        else {
          var at=E.reminds.indexOf(v);
          if(at>=0) E.reminds.splice(at,1); else E.reminds.push(v);
          E.reminds.sort(function(x,y){ return x-y; });
        }
        syncRem();
      });
    });
  }
  syncRem();
  (function(){
    var ok=$('#eRemOk',sh), mi=$('#eRemMin',sh);
    if(!ok||!mi) return;
    function add(){
      var v=parseInt(mi.value,10);
      if(!(v>0)||v>1440){ toast(T('填 1–1440 之间的分钟数','Enter between 1 and 1440 minutes')); return; }
      if(E.reminds.indexOf(v)<0) E.reminds.push(v);
      E.reminds.sort(function(x,y){ return x-y; });
      mi.value=''; $('#eRemCust',sh).hidden=true; syncRem();
    }
    ok.addEventListener('click',add);
    mi.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  })();

  function syncPri(){$$('#ePri button',sh).forEach(function(b){b.classList.toggle('on',+b.dataset.p===E.pri);});}
  function syncFolder(){
    var h=$('#eFolder',sh);
    h.innerHTML='<button data-f="" class="'+(E.folder?'':'on')+'">'+tr('Без папки')+'</button>'+
      S.folders.map(function(f){return '<button data-f="'+f.id+'" class="'+(E.folder===f.id?'on':'')+'">'+esc(f.name)+'</button>';}).join('')+
      '<button data-f="+" class="add">+ '+tr('Новая')+'</button>';
    $$('#eFolder button',sh).forEach(function(b){b.addEventListener('click',function(){
      if(b.dataset.f==='+'){ b.remove(); newFolder(h,function(f){ if(f)E.folder=f.id; syncFolder(); }); return; }
      E.folder=b.dataset.f||null; syncFolder();
    });});
  }
  function syncRep(){
    $('#eRepBox',sh).hidden=false;
    var kind=E.period?E.period
      :(E.dailyDays==null?(E.rep?(E.rep.kind==='week'?'week':'daily'):'none'):'daily');
    $('#eRepHint',sh).textContent=UIx('eRepeat');
    $$('#eRep button',sh).forEach(function(b){b.classList.toggle('on',b.dataset.r===kind);});
    $('#eDays',sh).hidden=(kind!=='week');
    $('#eMonth',sh).hidden=(kind!=='month');
    var pdw=(kind==='week')?(E.period?E.periodDays:(E.rep?E.rep.days||[]:[])):[];
    $$('#eDays button',sh).forEach(function(b){
      b.classList.toggle('on',pdw.indexOf(+b.dataset.d)>=0);
    });
    $$('#eMonth button',sh).forEach(function(b){
      b.classList.toggle('on',kind==='month'&&E.periodDays.indexOf(+b.dataset.d)>=0);
    });
    var box=$('#eSeries',sh);
    if(unsched){ box.innerHTML=''; return; }
    if(srOld){
      box.innerHTML='<div class="hint">'+tr('Дело из серии «{r}».',{r:esc(repLabel(srOld))})+' '+tr('Правки в этой карточке — только для этого дня.')+'</div>'+
        '<button class="subtle" id="eAll">'+tr('Применить ко всем будущим')+'</button>'+
        '<button class="subtle" id="eDelAll" style="color:var(--red)">'+tr('Удалить все повторы')+'</button>';
      $('#eAll',sh).addEventListener('click',applyToAll);
      $('#eDelAll',sh).addEventListener('click',function(){
        snapshot(); removeSeries(srOld,null); save(); closeSheet(); render(); toast(tr('Серия удалена'),true);
      });
    } else box.innerHTML='';
  }
  function subCmp(){
    var d=0; E.subs.forEach(function(x){ if(x.done) d++; });
    var c=$('#subCntLbl',sh);
    if(c) c.textContent=E.subs.length? UIx('subDone',{a:d,b:E.subs.length}) : '';
  }
  function renderSubs(){
    var box=$('#subList',sh); if(!box) return;
    if(!E.subs.length){
      box.innerHTML='<div class="hint" style="padding:9px 14px">'+UIx('subEmpty')+'</div>';
    }else{
      box.innerHTML=E.subs.map(function(x,i){
        return '<div class="srow'+(x.done?' on':'')+'">'+
          '<button class="schk" data-i="'+i+'" aria-label="'+(x.done?'done':'todo')+'"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></button>'+
          '<span class="stx">'+esc(x.title)+'</span>'+
          '<button class="sx" data-i="'+i+'" aria-label="del"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
        '</div>';
      }).join('');
      $$('.schk',box).forEach(function(b){
        b.addEventListener('click',function(){ var i=+b.dataset.i; if(E.subs[i]){ E.subs[i].done=!E.subs[i].done; renderSubs(); } });
      });
      $$('.sx',box).forEach(function(b){
        b.addEventListener('click',function(){ E.subs.splice(+b.dataset.i,1); renderSubs(); });
      });
    }
    subCmp();
  }
  function addSub(){
    var inp=$('#subInp',sh); if(!inp) return;
    var v=(inp.value||'').trim();
    if(!v) return;
    E.subs.push({id:uid(),title:v.slice(0,120),done:false});
    inp.value=''; renderSubs();
    try{ inp.focus(); }catch(e){}
  }
  var subBtn=$('#subAdd',sh); if(subBtn) subBtn.addEventListener('click',addSub);
  var subInp=$('#subInp',sh);
  if(subInp) subInp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addSub(); } });
  renderSubs();

  function readFields(){
    E.title=tEl.value.trim(); E.note=$('#eNote',sh).value.trim(); E.done=$('#eDone',sh).checked;
    E.due=($('#eDue',sh)?$('#eDue',sh).value:null)||null;
  }
  function applyToAll(){
    readFields();
    if(!srOld) return;
    if(E.rep&&E.rep.kind==='week'&&!E.rep.days.length){ toast(tr('Выберите дни недели')); return; }
    snapshot();
    srOld.title=E.title; srOld.note=E.note; srOld.dur=E.dur; srOld.pri=E.pri; srOld.folder=E.folder||null;
    srOld.subs=normalizeSubs(E.subs);
    srOld.start=Math.max(dayMin(),Math.min(dayMax()-E.dur,E.start==null?dayMin():E.start));
    if(E.rep){ srOld.kind=E.rep.kind; srOld.days=E.rep.days.slice(); }
    regenSeries(srOld,E.date||S.date);
    closeSheet(); render(); toast(tr('Применено ко всем будущим'),true);
  }
  function syncSched(){
    $('#eSched',sh).hidden=unsched;
    var dr=$('#eDateRow',sh); if(dr) dr.hidden=!!E.period;   // 周期任务的日期由规则决定，不用手填
    syncRep();
    $('#eDate',sh).value=E.date||S.date;
    $('#eTime',sh).value=(E.start!=null)?hhmm(E.start):'';
    $('#eEnd',sh).value=(E.start!=null)?hhmm(Math.min(E.start+E.dur,23*60+59)):'';
    $('#eDurV',sh).textContent=durStr(E.dur);
    renderDurChips(); renderConflict();
  }
  function renderDurChips(){
    var opts=[15,30,45,60,90,120,180];
    $('#eDurChips',sh).innerHTML=opts.map(function(m){
      return '<button data-m="'+m+'" class="'+(m===E.dur?'on':'')+'">'+durStr(m)+'</button>';}).join('');
    $$('#eDurChips button',sh).forEach(function(b){
      b.addEventListener('click',function(){E.dur=+b.dataset.m;syncSched();});
    });
  }
  function renderConflict(){
    var w=$('#eWarn',sh), sb=$('#eSlotsBox',sh);
    if(unsched||E.start==null||!E.date){w.innerHTML='';sb.innerHTML='';return;}
    var c=conflicts(E.date,E.start,E.dur,E.id);
    w.innerHTML=c.length
      ? '<div class="warn">⚠︎ '+tr('Пересекается с:')+' '+c.map(function(x){return esc(x.title||tr('дело'))+' ('+hhmm(x.start)+')';}).join(', ')+'</div>'
      : '';
    if(E.start+E.dur>dayMax()) w.innerHTML+='<div class="warn">⚠︎ '+tr('Выходит за границы дня')+'</div>';
    sb.innerHTML=windowsHTML(E.date,E.dur,E.id,'eSlots');
    $$('#eSlots button',sh).forEach(function(b){
      b.addEventListener('click',function(){E.start=+b.dataset.m;syncSched();});
    });
  }

  $$('#ePri button',sh).forEach(function(b){
    b.addEventListener('click',function(){E.pri=+b.dataset.p;syncPri();});
  });
  $('#eUn',sh).addEventListener('change',function(){
    unsched=this.checked;
    if(!unsched){
      if(!E.date)E.date=S.date;
      if(E.start==null){var st=slotStarts(E.date,E.dur,E.id,1);E.start=st.length?st[0]:Math.max(dayMin(),Math.round(nowMin()/15)*15);}
    }
    syncSched();
  });
  $('#eDate',sh).addEventListener('change',function(){ if(this.value){E.date=this.value;renderConflict();} });
  $('#eTime',sh).addEventListener('change',function(){
    var p=this.value.split(':'); if(p.length===2){E.start=(+p[0])*60+(+p[1]);syncSched();}
  });
  $('#eEnd',sh).addEventListener('change',function(){
    var p=this.value.split(':');
    if(p.length!==2||E.start==null){syncSched();return;}
    var m=(+p[0])*60+(+p[1]);
    if(m<=E.start){ toast(tr('Конец должен быть позже начала')); syncSched(); return; }
    E.dur=Math.max(5,snapM(m-E.start)); syncSched();
  });
  $$('#eRep button',sh).forEach(function(b){b.addEventListener('click',function(){
    var r=b.dataset.r;
    if(r==='none'){ E.dailyDays=null; E.period=null; E.periodDays=[]; E.rep=null; }
    else if(r==='daily'){ E.dailyDays=[]; E.period='day'; E.periodDays=[]; }
    else if(r==='week'){ E.dailyDays=null; E.period='week';
      var wd0=(fromISO(E.date||S.date).getDay()+6)%7;
      if(!E.periodDays.length||E.periodDays.some(function(x){return x>6;})){ E.periodDays=[wd0]; E.pdAuto=true; }
    }
    else if(r==='month'){ E.dailyDays=null; E.period='month';
      if(!E.periodDays.length||E.periodDays.every(function(x){return x<=6;})){ E.periodDays=[Math.min(28,fromISO(E.date||S.date).getDate())]; E.pdAuto=true; }
    }
    syncSched();
  });});

/* ---------- 课表导入 / 作息设置 ---------- */
function weekdayOf(str){
  var m=String(str||'').match(/^(星期|周|礼拜)([一二三四五六日天])$/);
  if(!m) return -1;
  var c=m[2], map={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'日':6,'天':6};
  return map[c]!=null?map[c]:-1;
}
function parseCourseText(txt){
  var lines=String(txt||'').split(/\r?\n/), out=[], errs=[];
  /* 先看是不是粘错了「周课表」（一行里堆着好几个星期几） */
  for(var li=0; li<Math.min(lines.length,6); li++){
    var cs=String(lines[li]).split(/\t+/);
    var nwd=cs.filter(function(c){ return weekdayOf(String(c).trim())>=0; }).length;
    if(nwd>=3){
      return {list:[], errs:[isEN()?'This looks like a grid timetable (periods × weekdays). Use the "Class detail" sheet instead — one row per class with weekday, period and weeks columns.':'这看起来是「周课表」（行列是节次×星期的那种）。请换另一张表：Excel 里叫「上课明细」，每行是一门课，有「星期」「节次」「周次」三列，复制它再粘贴。'], grid:true};
    }
  }
  lines.forEach(function(raw,idx){
    var ln=raw.replace(/\u00a0/g,' ').trim();
    if(!ln) return;
    if(/序号/.test(ln)&&/课程/.test(ln)) return;
    var cells=ln.split(/\t+/).map(function(x){return x.trim();});
    if(cells.length<3) cells=ln.split(/[,，;；|]+|\s{2,}/).map(function(x){return x.trim();}).filter(Boolean);
    var wd=-1, wdIdx=-1, i;
    for(i=0;i<cells.length;i++){ var k=weekdayOf(cells[i]); if(k>=0){ wd=k; wdIdx=i; break; } }
    if(wd<0){ if(!/周|节/.test(ln)) return; errs.push((isEN()?'Line '+(idx+1)+': weekday not recognised → ':'第 '+(idx+1)+' 行：没认出星期几 → ')+ln.slice(0,24)); return; }
    var jt=null, jIdx=-1;
    for(i=0;i<cells.length;i++){
      var m=cells[i].match(/^(\d+)\s*[-—~至]\s*(\d+)\s*节?$/);
      if(m){ jt=[+m[1],+m[2]]; jIdx=i; break; }
      m=cells[i].match(/^第?(\d+)\s*节$/);
      if(m){ jt=[+m[1],+m[1]]; jIdx=i; break; }
    }
    if(!jt){ errs.push(isEN()?('Line '+(idx+1)+': period not recognised'):('第 '+(idx+1)+' 行：没认出节次')); return; }
    var wk=null, wkIdx=-1;
    for(i=0;i<cells.length;i++){
      if(i===jIdx) continue;
      if(/周/.test(cells[i])&&/\d/.test(cells[i])){ var w=parseWeeks(cells[i]); if(w.length){ wk=w; wkIdx=i; break; } }
    }
    if(!wk){ errs.push(isEN()?('Line '+(idx+1)+': weeks not recognised'):('第 '+(idx+1)+' 行：没认出周次')); return; }
    var name=(wdIdx>0)?cells[wdIdx-1]:'';
    name=name.replace(/[○◐●〇★◆]/g,'').trim();
    if(!name||/^\d+$/.test(name)){ errs.push(isEN()?('Line '+(idx+1)+': class name not recognised'):('第 '+(idx+1)+' 行：没认出课程名')); return; }
    var place='', teacher='';
    if(wkIdx>0&&wkIdx+1<cells.length) place=cells[wkIdx+1];
    if(wkIdx>0&&wkIdx+2<cells.length) teacher=cells[wkIdx+2];
    if(/^\d+(\.\d+)?$/.test(place)) place='';
    out.push(normalizeCourse({name:name,teacher:teacher,place:place,wd:wd,j1:jt[0],j2:jt[1],weeks:wk}));
  });
  return {list:out,errs:errs};
}

function xlsxToText(wb){
  var names=wb.SheetNames||[], pick=null, i;
  for(i=0;i<names.length;i++){ if(/明细|课程表|课程一览/.test(names[i])){ pick=names[i]; break; } }
  if(!pick){
    for(i=0;i<names.length;i++){
      var rows0=XLSX.utils.sheet_to_json(wb.Sheets[names[i]],{header:1,blankrows:false,raw:false});
      for(var r=0;r<Math.min(rows0.length,8);r++){
        var line=(rows0[r]||[]).join(' ');
        if(/课程名称/.test(line)&&/星期/.test(line)){ pick=names[i]; break; }
      }
      if(pick) break;
    }
  }
  if(!pick) pick=names[0];
  var rows=XLSX.utils.sheet_to_json(wb.Sheets[pick],{header:1,blankrows:false,raw:false});
  return rows.map(function(r){
    return (r||[]).map(function(c){ return c==null?'':String(c).replace(/\s+/g,' ').trim(); }).join('\t');
  }).join('\n');
}

function openHelp(){
  var listHTML='';
  var SRC=(typeof HELP_EN!=='undefined'&&isEN())?HELP_EN:HELP;
  SRC.forEach(function(sec){
    listHTML+='<div class="faqsec"><div class="faqh">'+sec[0]+'</div>';
    sec[1].forEach(function(qa){
      listHTML+='<div class="faqitem"><div class="faqq">'+qa[0]+'</div><div class="faqa">'+qa[1]+'</div></div>';
    });
    listHTML+='</div>';
  });
  var sh=openSheet(
    '<div class="sh-h"><button class="tb" id="hClose">'+UIx('close')+'</button><div class="t">'+UIx('helpTitle')+'</div><span class="tb r"></span></div>'+
    '<div class="sh-b" id="hBody" style="padding-bottom:calc(84px + var(--sb));position:relative">'+
      '<div class="hsearch"><input id="hQ" type="search" placeholder="'+UIx('helpPh')+'" autocomplete="off"></div>'+
      '<div id="hList">'+listHTML+'</div>'+
      '<div class="hint" id="hNone" style="text-align:center;padding:26px 0" hidden>'+UIx('helpNone')+'</div>'+
    '</div>'+
    '<button class="hTop" id="hTop" hidden aria-label="回到顶部" data-i18n-aria="回到顶部">↑</button>');
  $('#hClose',sh).addEventListener('click',closeSheet);
  var body=$('#hBody',sh), q=$('#hQ',sh), topBtn=$('#hTop',sh), none=$('#hNone',sh);
  q.addEventListener('input',function(){
    var v=this.value.trim().toLowerCase(), any=false;
    $$('.faqitem',sh).forEach(function(it){
      var hit=!v||it.textContent.toLowerCase().indexOf(v)>=0;
      it.hidden=!hit; if(hit) any=true;
    });
    $$('.faqsec',sh).forEach(function(sec){
      var vis=false;
      $$('.faqitem',sec).forEach(function(x){ if(!x.hidden) vis=true; });
      sec.hidden=!vis;
    });
    none.hidden=any;
    if(v){
      requestAnimationFrame(function(){
        var first=null;
        $$('.faqitem',sh).forEach(function(it){ if(!first&&!it.hidden) first=it; });
        if(!first) return;
        var y=0, n=first;
        while(n&&n!==body){ y+=n.offsetTop; n=n.offsetParent; }
        var hsEl=sh.querySelector('.hsearch');
        var off=hsEl?hsEl.offsetHeight:0;
        if(n===body) body.scrollTop=Math.max(0,y-off-2);
      });
    } else {
      body.scrollTop=0;
    }
  });
  body.addEventListener('scroll',function(){ topBtn.hidden=body.scrollTop<40; });
  topBtn.addEventListener('click',function(){ body.scrollTo({top:0,behavior:'smooth'}); });
}

/* ---------- 精力超载提示 ---------- */
function overloadInfo(){
  var plan=planEnergy();
  if(plan<=100) return null;
  var arr=todayTasks().filter(function(t){ return !t.done && !isDueTask(t); })
    .map(function(t){ return {t:t,c:energyCost(t)}; })
    .filter(function(x){ return x.c>0; })
    .sort(function(a,b){                              // 先挑不重要的：优先级低的先挪，同样不重要时挑消耗大的
      return (a.t.pri-b.t.pri)||(b.c-a.c);
    });
  var need=plan-100, pick=[], sum=0;
  for(var i=0;i<arr.length && sum<need;i++){ pick.push(arr[i]); sum+=arr[i].c; }
  return {plan:plan, over:need, pick:pick.slice(0,3)};
}
function renderOverload(){
  var box=$('#tdOver'); if(!box) return;
  var info=overloadInfo();
  if(!info){ box.hidden=true; box.innerHTML=''; return; }
  var list=info.pick.map(function(x){
    return '<button class="ovname" data-id="'+x.t.id+'">'+esc(x.t.title||UIx('unnamed'))+'</button>'+UIx('overUnit',{c:x.c});
  }).join('、');
  box.innerHTML='<div>'+UIx('overTitle',{n:info.plan,x:info.over})+'</div>'+
    (list?'<div class="tip">'+UIx('overTip',{list:list})+'</div>':'');
  box.hidden=false;
  $$('.ovname',box).forEach(function(b){
    b.addEventListener('click',function(e){ e.stopPropagation(); openOverMove(byId(b.dataset.id)); });
  });
}

/* 用一段备份文本覆盖当前数据 */
function applyBackupData(txt){
  try{
    var d=JSON.parse(txt);
    if(!d||!Array.isArray(d.tasks)) throw 0;
    forceSnap(); snapshot();
    S.tasks=d.tasks.map(normalize);
    if(Array.isArray(d.folders)) S.folders=d.folders.filter(function(f){return f&&f.id&&f.name;});
    if(Array.isArray(d.notes)) S.notes=d.notes.map(normalizeNote);
    if(Array.isArray(d.series)) S.series=d.series.map(normalizeSeries);
    if(Array.isArray(d.courses)) S.courses=d.courses.map(normalizeCourse);
    if(Array.isArray(d.moves)) S.moves=d.moves.slice();
    if(d.settings) S.settings=Object.assign({},DEF,d.settings);
    S.del=d.del||{};
    if(d.log) S.log=d.log;
    normFolders();
    save(); applyTheme(); render(); closeSheet(); toast(T('数据已恢复','Data restored'),true);
    return true;
  }catch(e){ toast(UIx('bkBad')); return false; }
}

/* ---------- 一键填空隙（用户手动触发，可撤销） ---------- */
function autoFillPool(){
  return todayTasks().filter(function(t){
    if(t.start!=null||t.done) return false;
    if(t.afBatch) return false;                    // 已经排过的不重复排
    return true;
  });
}
function afBusy(iso){
  var arr=[];
  onDay(iso).forEach(function(x){ if(x.start!=null) arr.push([x.start,x.start+(x.dur||30)]); });
  try{ coursesOn(iso).forEach(function(c){ arr.push([c.start,c.end]); }); }catch(e){}
  arr.sort(function(a,b){ return a[0]-b[0]; });
  return arr;
}
var AF_GAP=10;                      // 两件事之间至少留 10 分钟，别让人喘不过气
function afFind(busy,dur,from,to){
  var s=from, guard=0;
  while(guard++<300){
    var clash=null;
    for(var i=0;i<busy.length;i++){
      if(s < busy[i][1]+AF_GAP && busy[i][0] < s+dur+AF_GAP){ clash=busy[i]; break; }
    }
    if(!clash) return (s+dur<=to)?s:-1;
    s=clash[1]+AF_GAP;
    if(s+dur>to) return -1;
  }
  return -1;
}
function afCanDay(t,iso){
  var today=todayISO();
  if(isDueTask(t)&&t.due&&iso>t.due) return false;
  if(t.period==='day') return iso===today;
  var wd=(fromISO(iso).getDay()+6)%7, dt=fromISO(iso).getDate();
  if(t.period==='week'){
    var pd=t.periodDays||[];
    if(pd.length&&pd.indexOf(wd)<0) return false;
    var mon=addDays(today,-((fromISO(today).getDay()+6)%7));
    return iso<=addDays(mon,6);
  }
  if(t.period==='month'){
    var pd2=t.periodDays||[];
    if(pd2.length&&pd2.indexOf(dt)<0) return false;
    return iso.slice(0,7)===today.slice(0,7);
  }
  return true;
}
function autoPlanRun(){
  var batch='af'+Date.now(), today=todayISO();
  var pool=autoFillPool();
  pool.sort(function(a,b){ return (b.pri-a.pri)||((b.dur||0)-(a.dur||0)); });
  var busyCache={}, placed=[], failed=[];
  for(var ti=0; ti<pool.length; ti++){
    var t=pool[ti], dur=Math.max(10,t.dur||30), ok=false;
    for(var off=0; off<=7 && !ok; off++){
      var iso=addDays(today,off);
      if(!afCanDay(t,iso)) continue;
      var from=(iso===today)?Math.max(dayMin(),nowMin()+5):dayMin();
      if(from+dur>dayMax()) continue;
      if(!busyCache[iso]) busyCache[iso]=afBusy(iso);
      var s=afFind(busyCache[iso],dur,from,dayMax());
      if(s<0) continue;
      if(t.period){
        if(!t.ovr) t.ovr={};
        t.ovr[iso]={start:s,dur:dur};
      }else{
        t.afOrig={date:t.date||null,start:(typeof t.start==='number')?t.start:null};
        t.date=iso; t.start=s;
      }
      t.afBatch=batch; t.afDate=iso;
      busyCache[iso].push([s,s+dur]); busyCache[iso].sort(function(a,b){ return a[0]-b[0]; });
      placed.push({t:t,iso:iso,start:s,dur:dur});
      ok=true;
    }
    if(!ok) failed.push(t);
  }
  return {placed:placed,failed:failed};
}
function afUndoOne(t){
  if(!t) return;
  if(t.period){
    if(t.ovr&&t.afDate) delete t.ovr[t.afDate];
  }else if(t.afOrig){
    t.date=t.afOrig.date; t.start=t.afOrig.start;
  }
  delete t.afBatch; delete t.afDate; delete t.afOrig;
}
function afUndoAll(){
  (S.tasks||[]).forEach(function(t){ if(t.afBatch) afUndoOne(t); });
}
function afPlacedList(){
  var out=[];
  (S.tasks||[]).forEach(function(t){
    if(!t.afBatch) return;
    var iso=t.afDate, ov=t.ovr&&t.ovr[iso];
    var st=(ov&&typeof ov.start==='number')?ov.start:t.start;
    if(typeof st!=='number') return;
    out.push({t:t,iso:iso,start:st,dur:(ov&&ov.dur)||t.dur||30});
  });
  out.sort(function(a,b){ return a.iso===b.iso ? (a.start-b.start) : (a.iso<b.iso?-1:1); });
  return out;
}

function stripTags(h){ return String(h||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' '); }
function searchAll(q){

/* ---------- синхронизация ---------- */
var SKEY='planly.sync', syncTimer=0;
var sync={code:null,version:0,last:0,busy:false,state:'off',err:''};

function loadSync(){
  try{
    var r=JSON.parse(localStorage.getItem(SKEY)||'null');
    if(r&&r.code){ sync.code=r.code; sync.version=r.version||0; sync.last=r.last||0; sync.state='idle'; }
  }catch(e){}
}
function saveSyncState(){
  try{ localStorage.setItem(SKEY,JSON.stringify({code:sync.code,version:sync.version,last:sync.last})); }catch(e){}
}
function genCode(){
  var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out='', i, a=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a);
  else for(i=0;i<16;i++) a[i]=Math.floor(Math.random()*256);
  for(i=0;i<16;i++){ out+=A.charAt(a[i]%A.length); if(i%4===3&&i<15) out+='-'; }
  return out;
}
function apiURL(){ return new URL('api/sync',location.href).toString(); }
function localDoc(){
  return {tasks:S.tasks,folders:S.folders,notes:S.notes,series:S.series,del:S.del,settings:S.settings,settingsUpd:S.settingsUpd};
}
function mergeDel(a,b){
  var o={},k,edge=Date.now()-30*864e5;
  [a||{},b||{}].forEach(function(m){ for(k in m) if(!o[k]||m[k]>o[k]) o[k]=m[k]; });
  for(k in o) if(o[k]<edge) delete o[k];
  return o;
}
function mergeArr(local,remote,del){
  var by={},out=[],i;
  (local||[]).forEach(function(x){ by[x.id]=x; });
  (remote||[]).forEach(function(r){
    if(!r||!r.id) return;
    var l=by[r.id];
    if(!l||(r.upd||0)>(l.upd||0)) by[r.id]=r;
  });
  Object.keys(by).forEach(function(id){
    var x=by[id];
    if((del[id]||0)>(x.upd||0)) return;   // удалено позже, чем правилось
    out.push(x);
  });
  return out;
}
function applyRemote(remote){
  if(!remote) return false;
  var beforeT=JSON.stringify(S.tasks), beforeF=JSON.stringify(S.folders), themed=false;
  applyingRemote=true;
  S.del=mergeDel(S.del,remote.del);
  S.tasks=mergeArr(S.tasks,(remote.tasks||[]).map(normalize),S.del);
  S.folders=mergeArr(S.folders,remote.folders||[],S.del); normFolders();
  var beforeN=JSON.stringify(S.notes);
  S.notes=mergeArr(S.notes,(remote.notes||[]).map(normalizeNote),S.del);
  var beforeR=JSON.stringify(S.series);
  S.series=mergeArr(S.series,(remote.series||[]).map(normalizeSeries),S.del);
  if((remote.settingsUpd||0)>(S.settingsUpd||0)){
    S.settings=Object.assign({},DEF,remote.settings||{});
    S.settingsUpd=remote.settingsUpd; themed=true;
  }
  save(); buildShadow(); applyingRemote=false;
  var changed=(JSON.stringify(S.tasks)!==beforeT)||(JSON.stringify(S.folders)!==beforeF)||(JSON.stringify(S.notes)!==beforeN)||(JSON.stringify(S.series)!==beforeR)||themed;
  if(ensureOccurrences()) changed=true;
  if(changed){ if(themed) applyTheme(); render(); }
  return changed;
}
/* устойчивая подпись документа: сравниваем содержимое, а не порядок ключей */
function stableStr(o){
  if(o===null||typeof o!=='object') return JSON.stringify(o);
  if(Array.isArray(o)) return '['+o.map(stableStr).join(',')+']';
  return '{'+Object.keys(o).sort().map(function(k){ return JSON.stringify(k)+':'+stableStr(o[k]); }).join(',')+'}';
}
function docSig(d){
  if(!d) return '';
  var byId=function(a,b){ return a.id<b.id?-1:(a.id>b.id?1:0); };
  return stableStr({
    tasks:(d.tasks||[]).slice().sort(byId),
    folders:(d.folders||[]).slice().sort(byId),
    notes:(d.notes||[]).slice().sort(byId),
    series:(d.series||[]).slice().sort(byId),
    del:d.del||{}, settings:d.settings||{}, settingsUpd:d.settingsUpd||0
  });
}
/* 联网总开关：2.0.01 起暂时关闭。同步和检查更新指向的都是 App 内部的假地址
   （https://app.local/...），本来就连不上，关掉是为了不再产生失败请求。
   等开源、仓库和 version.json 就位后，改成 true 并接上真实地址即可。 */
var NET_ON=false;
function pushDoc(base,isRetry){
  if(!NET_ON) return;
  return fetch(apiURL()+'?code='+encodeURIComponent(sync.code),{
    method:'PUT', cache:'no-store',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({base:base,doc:localDoc()})
  }).then(function(r){
    return r.json().catch(function(){return {};}).then(function(res){
      if(r.status===409){
        if(isRetry) throw new Error(tr('конфликт версий'));
        applyRemote(res.doc);
        return pushDoc(res.version||0,true);
      }
      if(r.status===403) throw new Error(tr('код не разрешён на сервере'));
      if(!r.ok) throw new Error('HTTP '+r.status);
      sync.version=res.version||0;
      return res;
    });
  });
}
function syncNow(manual){
  if(!NET_ON) return;
  if(!sync.code||sync.busy) return;
  sync.busy=true; sync.state='sync'; sync.err=''; refreshSyncUI();
  fetch(apiURL()+'?code='+encodeURIComponent(sync.code),{cache:'no-store'})
    .then(function(r){
      if(r.status===403) throw new Error(tr('код не разрешён на сервере'));
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(res){
      applyRemote(res.doc);
      // если после слияния наш документ совпал с серверным — записывать нечего
      if(res.doc && docSig(localDoc())===docSig(res.doc)){ sync.version=res.version||0; return null; }
      return pushDoc(res.version||0);
    })
    .then(function(){ sync.state='ok'; sync.last=Date.now(); saveSyncState(); })
    .catch(function(e){ sync.state='err'; sync.err=(e&&e.message)||tr('нет связи'); })
    .then(function(){
      sync.busy=false; refreshSyncUI();
      if(manual) toast(sync.state==='ok'?tr('Синхронизировано'):tr('Не удалось:')+' '+sync.err);
    });
}
function scheduleSync(){
  if(!sync.code) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){ syncNow(false); },4000);
}
function syncOn(code){
  sync.code=code; sync.version=0; sync.last=0; sync.state='idle';
  saveSyncState(); syncNow(true);
}
function syncOff(){
  sync.code=null; sync.version=0; sync.last=0; sync.state='off';
  try{ localStorage.removeItem(SKEY); }catch(e){}
  refreshSyncUI();
}
function ago(ms){
  if(!ms) return tr('ещё не было');
  var d=Math.round((Date.now()-ms)/1000);
  if(d<60) return tr('только что');
  var v;
  if(d<3600){ v=Math.round(d/60); return tr('{n} назад',{n:v+' '+plur(v,"минуту","минуты","минут")}); }
  if(d<86400){ v=Math.round(d/3600); return tr('{n} назад',{n:v+' '+plur(v,"час","часа","часов")}); }
  v=Math.round(d/86400); return tr('{n} назад',{n:v+' '+plur(v,"день","дня","дней")});
}
function syncStateText(){
  if(!sync.code) return tr('выключена');
  if(sync.state==='sync') return tr('обмен…');
  if(sync.state==='err') return tr('ошибка:')+' '+sync.err;
  return tr('обновлено')+' '+ago(sync.last);
}
var apiOK=null;
function probeAPI(cb){
  if(!NET_ON){ apiOK=false; cb(false); return; }
  if(apiOK!==null){ cb(apiOK); return; }
  fetch(apiURL()+'?code=ZZZZ-ZZZZ-PROBE-0000',{cache:'no-store'})
    .then(function(r){ return r.json().then(function(){ apiOK=(r.status===403)?'closed':(r.status===200); },
                                            function(){ apiOK=false; }); })
    .catch(function(){ apiOK=false; })
    .then(function(){ cb(apiOK); });
}
function refreshSyncUI(){ var b=$('#syncBox'); if(b) renderSyncBox(b); }
function renderSyncBox(box){
  if(apiOK===null){
    box.innerHTML='<div class="row"><span class="lbl">'+tr('Состояние')+'</span><span style="color:var(--text-2)">'+tr('проверяем…')+'</span></div>';
    probeAPI(function(){ refreshSyncUI(); });
    return;
  }
  if(apiOK===false){
    box.innerHTML='<div class="row"><span class="lbl">'+tr('Состояние')+'</span>'+
      '<span style="color:var(--text-2)">'+tr('недоступна по этому адресу')+'</span></div>'+
      '<div class="hint" style="padding:2px 0 0">多设备同步要有一台自己的服务器来中转，这个安装包没接，所以只能单机用。换手机请用上面/下面的「导出备份」和「从备份文件恢复」。</div>';
    return;
  }
  if(!sync.code){
    var closed=(apiOK==='closed');
    box.innerHTML=
      '<div class="row"><span class="lbl">'+tr('Состояние')+'</span><span style="color:var(--text-2)">'+tr(closed?'только по приглашению':'выключена')+'</span></div>'+
      (closed?'':'<div class="row"><span class="lbl">'+tr('Начать на этом устройстве')+'</span><button class="tb r" id="syOn">'+tr('Включить')+'</button></div>')+
      '<div class="row"><span class="lbl">'+tr('Код с другого')+'</span>'+
        '<input id="syCode" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off" '+
        'style="flex:1;min-width:0;background:var(--chip);border:0;border-radius:8px;padding:7px 9px;font-size:14px;outline:none">'+
        '<button class="tb r" id="syJoin" style="min-width:0">'+tr('Готово')+'</button></div>';
    if($('#syOn',box)) $('#syOn',box).addEventListener('click',function(){ syncOn(genCode()); refreshSyncUI(); });
    $('#syJoin',box).addEventListener('click',function(){
      var v=($('#syCode',box).value||'').trim().toUpperCase();
      if(!/^[A-Z0-9-]{8,64}$/.test(v)){ toast(tr('Код выглядит неправильно')); return; }
      syncOn(v); refreshSyncUI();
    });
  }else{
    box.innerHTML=
      '<div class="row"><span class="lbl">'+tr('Состояние')+'</span><span style="color:var(--text-2)">'+esc(syncStateText())+'</span></div>'+
      '<div class="row"><span class="lbl">'+tr('Код')+'</span><span style="font-variant-numeric:tabular-nums;letter-spacing:.5px">'+esc(sync.code)+'</span></div>'+
      '<div class="row"><span class="lbl">'+tr('Скопировать код')+'</span><button class="tb r" id="syCopy">'+tr('Копировать')+'</button></div>'+
      '<div class="row"><span class="lbl">'+tr('Обновить сейчас')+'</span><button class="tb r" id="syNow">'+tr('Обновить')+'</button></div>'+
      '<div class="row"><span class="lbl">'+tr('Отключить здесь')+'</span><button class="tb r" id="syOff" style="color:var(--red)">'+tr('Отключить')+'</button></div>';
    $('#syCopy',box).addEventListener('click',function(){
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(sync.code).then(function(){toast(tr('Код скопирован'));},function(){toast(tr('Не удалось скопировать'));});
      else toast(tr('Не удалось скопировать'));
    });
    $('#syNow',box).addEventListener('click',function(){ syncNow(true); });
    $('#syOff',box).addEventListener('click',function(){ syncOff(); toast(tr('Синхронизация выключена')); });
  }
}

/* ---------- проверка обновлений ---------- */
var updateFound=false;
function checkUpdate(){
  if(!NET_ON) return;
  if(updateFound||BUILD==='dev') return;
  fetch(new URL('version.txt',location.href).toString(),{cache:'no-store'})
    .then(function(r){ return r.ok?r.text():null; })
    .then(function(v){
      if(!v) return;
      v=v.trim();
      if(v && v!==BUILD){
        updateFound=true;
        var el=document.createElement('div');

        el.innerHTML='<span>'+tr('Новая версия')+' '+esc(v)+'</span><button id="tUpd">'+tr('Обновить')+'</button>';
        var old=$('#toast'); if(old) old.remove();
        document.body.appendChild(el);
        $('#tUpd').addEventListener('click',function(){ location.reload(); });
      }
    })
    .catch(function(){});
}

/* ---------- theme / views / nav ---------- */
var themeStamped=false;
function applyTheme(){
  var t=S.settings.theme;
  var eff=(t==='auto')?((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'):t;
  document.documentElement.setAttribute('data-mode',eff);
  if(t==='auto'){ if(themeStamped){document.documentElement.removeAttribute('data-theme');themeStamped=false;} }
  else { document.documentElement.setAttribute('data-theme',t); themeStamped=true; }
  var a=S.settings.accent||'green';
  if(a==='green') document.documentElement.removeAttribute('data-accent');
  else document.documentElement.setAttribute('data-accent',a);
  var m=document.querySelector('meta[name="theme-color"]:not([media])');
  if(m) m.setAttribute('content',getComputedStyle(document.body).backgroundColor);
}
function setView(v){
  if(S.view==='day'&&v!=='day'){ var __w=$('#tlwrap'); if(__w&&__w.clientHeight) tlTopSet(__w.scrollTop); }   // 走之前把位置钉住
  if(S.view==='note'&&v!=='note'&&noteId){ flushNote(); }
  S.view=v;
  ['today','day','list','notes','note','arch'].forEach(function(k){ $('#v-'+k).classList.toggle('on',v===k); });
  $('#fab').hidden=(v==='arch'||v==='note');
  $('#nToolbar').hidden=(v!=='note');
  document.body.classList.toggle('note-open', v==='note');
  if(v!=='note'){ closeFmt(); }
  var tabOf=(v==='note')?'notes':v;
  $$('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.view===tabOf);});
  if(v==='day'){
    setTimeout(applyTlTop,60);
    if(window.requestAnimationFrame) requestAnimationFrame(function(){ requestAnimationFrame(applyTlTop); });
  }
}
function setMode(m){
  S.settings.mode=m; save();
  $('#tlwrap').hidden=(m!=='scale');
  $('#daylist').hidden=(m!=='list');
  $$('#modeSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
  if(m==='scale'){ setTimeout(applyTlTop,60); }   // 切回时间轴：还记得上次停在哪就停在哪
}
function goDay(d){ S.date=d; ensureOccurrences(d); render(); }
/* 时间轴滚动位置按日期记着：上次停在哪儿，下次进来还停在那儿，不自动跳 */
function tlTopGet(){ var m=S.settings.tlTop; return (m&&typeof m[S.date]==='number')?Math.max(0,m[S.date]):0; }
function tlTopSet(v){ if(!S.settings.tlTop) S.settings.tlTop={}; S.settings.tlTop[S.date]=Math.max(0,Math.round(v)); }
function applyTlTop(){ var w=$('#tlwrap'); if(!w||!w.clientHeight) return; var v=tlTopGet(); if(Math.abs(w.scrollTop-v)>1) w.scrollTop=v; }
var tlSaveTimer=0;
(function(){
  var w=$('#tlwrap'); if(!w) return;
  w.addEventListener('scroll',function(){
    if(!w.clientHeight) return;        // 视图被藏起来时浏览器会把 scrollTop 清零，别把这个零当成用户滚到顶
    tlTopSet(w.scrollTop);
    if(tlSaveTimer) clearTimeout(tlSaveTimer);
    tlSaveTimer=setTimeout(function(){ try{ save(); }catch(e){} },400);
  },{passive:true});
})();
function scrollToTime(m,smooth){
  var wrap=$('#tlwrap');
  var y=(m-dayMin())*pxMin()-wrap.clientHeight*0.32;
  wrap.scrollTo({top:Math.max(0,y),behavior:smooth?'smooth':'auto'});
}
function focusDay(){
  var wrap=$('#tlwrap'); if(!wrap) return;
  var l=onDay(S.date);
  if(!l.length){
    if(anytimeOn(S.date).length) wrap.scrollTop=0;      // 只有列表任务 → 回到顶部
    return;
  }
  scrollToTime(l[0].start,false);
}
/* 切回日程页时，如果整屏看不到任何任务块，自动滚到第一个任务
   —— 之前切 tab 后 scrollTop 会被重置到 7:00，任务在下面，看着像"没了" */
function ensureVisibleTasks(tries){
  tries=tries||0;
  var wrap=$('#tlwrap');
  if(!wrap||wrap.hidden) return;
  if((S.settings.mode||'scale')!=='scale') return;
  var blocks=wrap.querySelectorAll('.block');
  if(!blocks.length) return;
  var top=wrap.scrollTop, h=wrap.clientHeight||wrap.offsetHeight;
  if(!h){                                            // 刚切回来还没布局完，等一会儿再看
    if(tries<8) setTimeout(function(){ ensureVisibleTasks(tries+1); },60);
    return;
  }
  for(var i=0;i<blocks.length;i++){
    var y=blocks[i].offsetTop, bh=blocks[i].offsetHeight;
    if(y+bh>=top+6 && y<=top+h-6) return;              // 已经有块露出来了
  }
  focusDay();
}

/* ---------- swipe between days ---------- */
(function(){
  var wrap=$('#tlwrap'), x0=0,y0=0,on=false;
  wrap.addEventListener('touchstart',function(e){
    if(e.touches.length!==1||document.body.classList.contains('nosel')){on=false;return;}
    on=true;x0=e.touches[0].clientX;y0=e.touches[0].clientY;
  },{passive:true});
  wrap.addEventListener('touchend',function(e){
    if(!on)return;on=false;
    var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>62&&Math.abs(dx)>Math.abs(dy)*2){ goDay(addDays(S.date,dx<0?1:-1)); }
  },{passive:true});
})();

/* ---------- keyboard (desktop) ---------- */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeSheet();return;}
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||sheetEl)return;
  if(e.key==='ArrowLeft'){goDay(addDays(S.date,-1));}
  else if(e.key==='ArrowRight'){goDay(addDays(S.date,1));}
  else if(e.key==='t'||e.key=="е"){goDay(todayISO());applyTlTop();}
  else if(e.key==='n'||e.key=="т"){e.preventDefault();$('#fab').click();}
  else if(e.key==='v'||e.key=="м"){setMode(S.settings.mode==='scale'?'list':'scale');}
  else if(e.key==='1'){setView('day');}
  else if(e.key==='2'){setView('list');}
  else if(e.key==='3'){setView('notes');}
  else if(e.key==='4'){setView('arch');}
});

/* ---------- clock ---------- */
setInterval(function(){
  var n=$('#nowline');
  if(S.date!==todayISO()&&!n)return;
  if(S.view==='day'&&S.settings.mode==='scale') renderTimeline();
},30000);
function refreshNowLine(){
  var el=document.getElementById('nowline');
  if(!el) return;
  if(S.date!==todayISO()||S.view!=='day'||S.settings.mode!=='scale'){ el.remove(); return; }
  var m=nowMin();
  if(m<dayMin()||m>dayMax()){ el.remove(); return; }
  el.style.top=((m-dayMin())*pxMin())+'px';
}
var __focusDay=null, __focusAt=0;
function onAppFocus(){
  var now=Date.now();
  if(now-__focusAt<700) return;   // focus 和 visibilitychange 会连发，去重
  __focusAt=now;
  if(sync.code) scheduleSync();
  var a=purgeArchive(), b=ensureOccurrences(), d=todayISO();
  if(a||b||__focusDay!==d){ __focusDay=d; render(); }
  else refreshNowLine();          // 平时只挪一下“现在”那条线，不重绘整页
}
window.addEventListener('focus',onAppFocus);

function seed(){
  /* 首次启动：完全空白，什么任务都不预置，由用户自己建 */
  S.tasks=[]; S.folders=[]; S.notes=[]; S.series=[]; S.del={}; S.log={};
  S.settings=Object.assign({},DEF); S.settings.lang=LANG;   // 首启语言跟系统走，不要写死中文
  save();
}

/* ---------- клавиатура: держим панель форматирования над ней ---------- */
(function(){
  var vv=window.visualViewport; if(!vv) return;
  function upd(){
    var kb=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    if(kb<80) kb=0;                                   // мелкая разница — это не клавиатура
    document.documentElement.style.setProperty('--kb', kb+'px');
    document.body.classList.toggle('kb', kb>0);
    if(kb>0) keepCaret();
  }
  vv.addEventListener('resize',upd); vv.addEventListener('scroll',upd); upd();
})();
