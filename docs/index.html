/* ---------- generic press-drag ---------- */
function noScroll(e){e.preventDefault();}
function lockScroll(on){
  if(on){document.addEventListener('touchmove',noScroll,{passive:false});document.body.classList.add('nosel');}
  else{document.removeEventListener('touchmove',noScroll,{passive:false});document.body.classList.remove('nosel');}
}
function pressDrag(el,o){
  el.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(o.ignore&&o.ignore(e))return;
    var quick=(e.pointerType==='mouse'), sx=e.clientX, sy=e.clientY, active=false, moved=false, timer=0;
    if(!quick) timer=setTimeout(start,240);
    function start(){
      if(active)return; active=true; timer=0;
      try{el.setPointerCapture(e.pointerId);}catch(err){}
      lockScroll(true); o.start(e);
    }
    function move(ev){
      var dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!active){
        if(quick){ if(Math.abs(dx)>3||Math.abs(dy)>3) start(); else return; }
        else { if(Math.abs(dx)>9||Math.abs(dy)>9){ done(); } return; }
      }
      moved=true; if(ev.cancelable) ev.preventDefault(); o.move(ev);
    }
    function up(ev){
      var was=active, mv=moved; done();
      if(was) o.end(ev,mv); else if(!mv&&o.tap) o.tap(ev);
    }
    function done(){
      clearTimeout(timer); if(active){lockScroll(false);} active=false;
      window.removeEventListener('pointermove',move,{passive:false});
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
    }
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

/* ---------- timeline block drag / resize ---------- */
function wireBlock(el,t){
  if(!t)return;
  var wrap=$('#tlwrap'), mode='move', s0=0, d0=0, y0=0, sc0=0, lastY=0, raf=0;
  function paint(){
    el.style.top=((t.start-dayMin())*pxMin())+'px';
    var h=Math.max(t.dur*pxMin(),20); el.style.height=h+'px';
    el.classList.toggle('short',h<44);
    $('.bm',el).textContent=durStr(t.dur)+(t.seriesId?' ↻':'')+(t.folder?' · '+folderName(t.folder):'');
  }
  function apply(){
    var dy=(lastY-y0)+(wrap.scrollTop-sc0), dm=dy/pxMin();
    if(mode==='move'){
      t.start=Math.max(dayMin(),Math.min(dayMax()-t.dur,snapM(s0+dm)));
    }else{
      t.dur=Math.max(S.settings.snap*2,Math.min(dayMax()-t.start,snapM(d0+dm)));
    }
    paint();
  }
  function loop(){
    var r=wrap.getBoundingClientRect(),v=0;
    if(lastY<r.top+56) v=-10; else if(lastY>r.bottom-56) v=10;
    if(v){ wrap.scrollTop+=v; apply(); }
    raf=requestAnimationFrame(loop);
  }
  var __didDrag=false;
  el.addEventListener('click',function(e){
    if(__didDrag){ __didDrag=false; return; }
    if(e.target.closest('[data-act]')) return;
    openTaskInfo(t);
  });
  var ckb=$('.bchk',el);
  if(ckb) ckb.addEventListener('click',function(e){
    e.stopPropagation(); markDone(t);
  });
  pressDrag(el,{
    ignore:function(e){ return !!e.target.closest('[data-act]'); },
    start:function(e){
      mode=e.target.closest('.rz')?'resize':'move';
      s0=t.start; d0=t.dur; y0=e.clientY; sc0=wrap.scrollTop; lastY=e.clientY;
      el.classList.add('dragging'); raf=requestAnimationFrame(loop);
    },
    move:function(e){ lastY=e.clientY; apply(); },
    end:function(ev,mv){
      cancelAnimationFrame(raf); el.classList.remove('dragging');
      __didDrag=!!mv;
      save(); render();
    }
  });
}

/* ---------- backlog item: tap / quick plan / reorder ---------- */
function wireItem(el,t){
  if(!t)return;
  var ph=null, oy=0, ox=0, w=0;
  var ck=$('.chk',el);
  if(ck) ck.addEventListener('click',function(e){ e.stopPropagation(); markDone(t); });
  var ed=$('.edit',el);
  if(ed) ed.addEventListener('click',function(e){ e.stopPropagation(); openEditor(t); });
  var dl=$('.del',el);
  if(dl) dl.addEventListener('click',function(e){ e.stopPropagation(); delTask(t); });
  $('.go',el).addEventListener('click',function(e){
    e.stopPropagation(); openPlanner(t);
  });
  pressDrag(el,{
    ignore:function(e){return !!e.target.closest('[data-act]');},
    start:function(e){
      var r=el.getBoundingClientRect(); oy=e.clientY-r.top; ox=e.clientX-r.left; w=r.width;
      ph=document.createElement('div'); ph.className='ph'; ph.style.height=r.height+'px';
      el.parentNode.insertBefore(ph,el);
      el.style.width=w+'px'; el.style.left=r.left+'px'; el.style.top=r.top+'px';
      el.classList.add('floating'); document.body.classList.add('reorder');
    },
    move:function(e){
      el.style.top=(e.clientY-oy)+'px'; el.style.left=(e.clientX-ox)+'px';
      var lists=$$('#backlog .list'), best=null, bd=1e9, i;
      for(i=0;i<lists.length;i++){
        var r=lists[i].getBoundingClientRect();
        var d=(e.clientY<r.top)?r.top-e.clientY:(e.clientY>r.bottom?e.clientY-r.bottom:0);
        if(d<bd){bd=d;best=lists[i];}
      }
      if(!best)return;
      var items=$$('.item',best).filter(function(x){return x!==el;}), before=null;
      for(i=0;i<items.length;i++){
        var rr=items[i].getBoundingClientRect();
        if(e.clientY<rr.top+rr.height/2){before=items[i];break;}
      }
      best.insertBefore(ph,before);
    },
    end:function(){
      var list=ph.parentNode, pri=+list.dataset.pri;
      el.classList.remove('floating'); el.removeAttribute('style');
      document.body.classList.remove('reorder');
      list.insertBefore(el,ph); ph.remove(); ph=null;
      t.pri=pri;
      var nodes=$$('.item',list), i;
      for(i=0;i<nodes.length;i++){ var x=byId(nodes[i].dataset.id); if(x){x.pri=pri;x.ord=i;} }
      save(); renderBacklog();
    },
    tap:function(){ openEditor(t); }
  });
}

function markDone(t){
  if(!t)return;
  if(!canTick()) return;
  snapshot(); setDone(t,true); save(); render(); toast(T('已完成','Done'),true);
}

function openPlanner(t){
  var P={date:S.date,start:null};
  var sh=openSheet(
    '<div class="sh-h"><button class="tb" id="pCancel">'+tr('Отмена')+'</button><div class="t">'+tr('Запланировать')+'</div><span class="tb r"></span></div>'+
    '<div class="sh-b">'+
      '<div class="who">'+esc(t.title||tr('Без названия'))+' · '+durStr(t.dur)+'</div>'+
      '<div class="chips" id="pDays"></div>'+
      '<div class="card">'+
        '<div class="row"><span class="lbl">'+tr('Дата')+'</span><input type="date" id="pDate"></div>'+
        '<div class="row"><span class="lbl">'+tr('Начало')+'</span><input type="time" id="pTime" step="300"></div>'+
      '</div>'+
      '<div id="pSlots"></div>'+
      '<div id="pWarn"></div>'+
      '<button class="prim" id="pOk">'+tr('Поставить на выбранное время')+'</button>'+
      '<button class="subtle" id="pAuto">'+tr('Автоматически — первый свободный слот')+'</button>'+
    '</div>');

  function put(when,auto){
    if(when==null){ toast(tr('Выбери время')); return; }
    snapshot();
    t.date=P.date; t.start=Math.max(dayMin(),Math.min(dayMax()-t.dur,when));
    save(); closeSheet();
    setView('day'); goDay(P.date);
    toast((auto?tr('Автоматически:')+' ':'')+fmtDay(P.date)+', '+hhmm(t.start),true);
  }
  function refreshPlanner(){
    $('#pDate',sh).value=P.date;
    $('#pTime',sh).value=(P.start!=null)?hhmm(P.start):'';
    var d0=todayISO();
    $('#pDays',sh).innerHTML=[0,1,2].map(function(k){
      var d=addDays(d0,k);
      return '<button data-d="'+d+'" class="'+(d===P.date?'on':'')+'">'+esc(fmtDay(d))+'</button>';
    }).join('');
    $$('#pDays button',sh).forEach(function(b){b.addEventListener('click',function(){
      P.date=b.dataset.d; P.start=null; refreshPlanner();
    });});
    var win=freeWindows(P.date,t.dur,t.id);
    if(P.start==null&&win.length){ P.start=win[0].start; $('#pTime',sh).value=hhmm(P.start); }
    $('#pSlots',sh).innerHTML=windowsHTML(P.date,t.dur,t.id,'pChips');
    $$('#pChips button',sh).forEach(function(b){
      if(P.start!=null&&+b.dataset.m===P.start) b.classList.add('on');
      b.addEventListener('click',function(){ P.start=+b.dataset.m; refreshPlanner(); });
    });
    var c=(P.start==null)?[]:conflicts(P.date,P.start,t.dur,t.id);
    $('#pWarn',sh).innerHTML=c.length
      ? '<div class="warn">⚠︎ '+tr('Пересечётся с:')+' '+c.map(function(x){return esc(x.title||tr('дело'))+' ('+hhmm(x.start)+')';}).join(', ')+'</div>'
      : '';
  }
  $('#pDate',sh).addEventListener('change',function(){ if(this.value){P.date=this.value;P.start=null;refreshPlanner();} });
  $('#pTime',sh).addEventListener('change',function(){
    var p=this.value.split(':'); if(p.length===2){P.start=(+p[0])*60+(+p[1]);refreshPlanner();}
  });
  $('#pOk',sh).addEventListener('click',function(){ put(P.start,false); });
  $('#pAuto',sh).addEventListener('click',function(){
    var st=slotStarts(P.date,t.dur,t.id,1);
    if(!st.length){ toast(tr('На эту дату свободных слотов нет')); return; }
    put(st[0],true);
  });
  $('#pCancel',sh).addEventListener('click',closeSheet);
  refreshPlanner();
}

/* ---------- sheet ---------- */
var sheetEl=null,bdEl=null;
function openSheet(html){
  closeSheet();
  bdEl=document.createElement('div'); bdEl.className='bd'; bdEl.addEventListener('click',closeSheet);
  sheetEl=document.createElement('div'); sheetEl.className='sheet'; sheetEl.innerHTML='<div class="grab"></div>'+html;
  document.body.appendChild(bdEl); document.body.appendChild(sheetEl);
  /* 面板里的文案是动态拼进来的，静态翻译只跑过一次，这里补一次 */
  try{ translateStatic(); }catch(e){}
  return sheetEl;
}
function closeSheet(){
  if(sheetEl){sheetEl.remove();sheetEl=null;}
  if(bdEl){bdEl.remove();bdEl=null;}
}
/* ---------- 安卓返回键 / 全面屏侧滑返回 ----------
   返回 '1' = 这一层已经退掉了（关了弹窗 / 退回上一层）
   返回 '0' = 没东西可退，交给系统去决定（App 会提示再按一次退出）
   没有这段的话，单页应用里 canGoBack() 永远是 false，一按就直接退出。 */
window.__onBack=function(){
  try{
    if(document.querySelector('.langpick')) return '0';   // 首次语言选择：不拦，允许直接退
    if(sheetEl){ closeSheet(); return '1'; }               // 弹窗（设置/编辑器/帮助……）
    if(S.view==='note'){ setView('notes'); return '1'; }   // 笔记正文 → 回笔记列表
    if(S.view && S.view!=='today'){ setView('today'); return '1'; }  // 其他标签页 → 回今天
    return '0';
  }catch(e){ return '0'; }
};

  var REM_QUICK=[0,5,10,30,60];
  function syncRem(){
    var box=$('#eRem',sh); if(!box) return;
    var sel=E.reminds||[];
    var extra=sel.filter(function(v){ return REM_QUICK.indexOf(v)<0; });
    var h='<button data-v="-1" class="'+(sel.length?'':'on')+'">'+UIx('remNone')+'</button>';

    $$('#eRem button',sh).forEach(function(b){

  function syncPri(){$$('#ePri button',sh).forEach(function(b){b.classList.toggle('on',+b.dataset.p===E.pri);});}

        '<button class="subtle" id="eDelAll" style="color:var(--red)">'+tr('Удалить все повторы')+'</button>';

  function syncSched(){

  $('#eTime',sh).addEventListener('change',function(){

  $('#eEnd',sh).addEventListener('change',function(){
    var p=this.value.split(':');

    var m=(+p[0])*60+(+p[1]);
    if(m<=E.start){ toast(tr('Конец должен быть позже начала')); syncSched(); return; }
    E.dur=Math.max(5,snapM(m-E.start)); syncSched();
  });
  $$('#eRep button',sh).forEach(function(b){b.addEventListener('click',function(){
    var r=b.dataset.r;
    if(r==='none'){ E.dailyDays=null; E.period=null; E.periodDays=[]; E.rep=null; }
    else if(r==='daily'){ E.dailyDays=[]; E.period='day'; E.periodDays=[]; }
    else if(r==='week'){ E.dailyDays=null; E.period='week';
      var wd0=(fromISO(E.date||S.date).getDay()+6)%7;
      if(!E.periodDays.length||E.periodDays.some(function(x){return x>6;})){ E.periodDays=[wd0]; E.pdAuto=true; }
    }
    else if(r==='month'){ E.dailyDays=null; E.period='month';
      if(!E.periodDays.length||E.periodDays.every(function(x){return x<=6;})){ E.periodDays=[Math.min(28,fromISO(E.date||S.date).getDate())]; E.pdAuto=true; }
    }
    syncSched();
  });});
  $$('#eDays button',sh).forEach(function(b){b.addEventListener('click',function(){

    if(E.period==='week'){

      } else {

        if(ii>=0) E.periodDays.splice(ii,1); else E.periodDays.push(dd);
      }
    } else if(!unsched&&E.rep&&E.rep.kind==='week'){
      ii=E.rep.days.indexOf(dd);
      if(ii>=0) E.rep.days.splice(ii,1); else E.rep.days.push(dd);
    } else return;

  });});
  $$('#eMonth button',sh).forEach(function(b){b.addEventListener('click',function(){

    else { E.pdAuto=false; E.periodDays=(E.periodDays[0]===dd)?[]:[dd]; }   // 每月只取一个日子

  $('#eDurV',sh).addEventListener('click',function(){

    ip.onkeydown=function(e){ if(e.key==='Enter'){ ip.blur(); } };

  $('#eMinus',sh).addEventListener('click',function(){E.dur=Math.max(5,E.dur-15);syncSched();});
  $('#ePlus',sh).addEventListener('click',function(){E.dur=Math.min(12*60,E.dur+15);syncSched();});
  $('#eCancel',sh).addEventListener('click',closeSheet);
  if(!isNew) $('#eDel',sh).addEventListener('click',function(){
    snapshot();
    if(task.seriesId) detachInstance(task);
    S.tasks=S.tasks.filter(function(x){return x.id!==task.id;});
    save();closeSheet();render();toast(tr('Удалено'),true);
  });
  $('#eSave',sh).addEventListener('click',function(){
    readFields();
    if(!E.title&&!E.note){closeSheet();return;}
    if(!unsched&&E.rep&&E.rep.kind==='week'&&!E.rep.days.length){ toast(tr('Выберите дни недели')); return; }
    snapshot();
    var t=task;
    if(!t){t=normalize({id:uid()});S.tasks.push(t);}
    t.title=E.title; t.note=E.note; t.dur=E.dur; t.pri=E.pri; t.folder=E.folder||null;
    t.subs=normalizeSubs(E.subs);
    t.due=E.due||null; setReminds(t,E.reminds);
    if(E.done!==t.done) setDone(t,E.done);
    if(E.period){
      /* 周期任务：可以是「无时间」放列表，也可以带具体时间排进时间轴 */
      t.date=null; t.dailyDays=null;
      t.period=E.period;
      t.periodDays=(Array.isArray(E.periodDays)?E.periodDays.slice():[]);
      t.start=unsched?null:Math.max(dayMin(),Math.min(dayMax()-t.dur,E.start==null?dayMin():E.start));
      if(srOld){ detachInstance({seriesId:srOld.id,date:oldDate}); t.seriesId=null; }
      var same=backlogList().filter(function(x){return x.pri===t.pri&&x.id!==t.id;});
      t.ord=-1; same.forEach(function(x,i){x.ord=i;}); t.ord=same.length;
    }else if(unsched){
      t.date=null;t.start=null;
      t.dailyDays=(Array.isArray(E.dailyDays))?E.dailyDays.slice():null;
      t.period=null;
      t.periodDays=[];
      if(srOld){ detachInstance({seriesId:srOld.id,date:oldDate}); t.seriesId=null; }
      if(srOld){ detachInstance({seriesId:srOld.id,date:oldDate}); t.seriesId=null; }   // ушло в список — из серии выпадает
      var same=backlogList().filter(function(x){return x.pri===t.pri&&x.id!==t.id;});
      t.ord=-1; same.forEach(function(x,i){x.ord=i;}); t.ord=same.length;
    }else{
      t.dailyDays=null; t.period=null; t.periodDays=[];
      t.date=E.date||S.date;
      t.start=Math.max(dayMin(),Math.min(dayMax()-t.dur,E.start==null?dayMin():E.start));
      var jumped=(t.date!==S.date);
      S.date=t.date;
      if(jumped) setTimeout(function(){toast(fmtDay(t.date)+', '+hhmm(t.start),true);},60);

      /* --- повторы --- */
      if(srOld){
        if(t.date!==oldDate){ detachInstance({seriesId:srOld.id,date:oldDate}); t.seriesId=null; }
        else if(!E.rep){ removeSeries(srOld,t.id); t.seriesId=null; }
        else if(E.rep.kind!==srOld.kind||E.rep.days.slice().sort().join()!==(srOld.days||[]).slice().sort().join()){
          srOld.kind=E.rep.kind; srOld.days=E.rep.days.slice(); regenSeries(srOld,t.date);
        }
      }else if(E.rep){
        var sr=normalizeSeries({id:uid(),title:t.title,note:t.note,start:t.start,dur:t.dur,pri:t.pri,folder:t.folder,
          kind:E.rep.kind,days:E.rep.days,from:t.date});
        S.series.push(sr);
        S.tasks=S.tasks.filter(function(x){return x.id!==t.id;});
        var inst=instanceFor(sr,t.date); inst.done=t.done; inst.doneAt=t.doneAt;
        S.tasks.push(inst); t=inst;
        save(); ensureOccurrences();
      }
    }
    save(); closeSheet(); render();
  });

  syncPri(); syncFolder(); syncSched();
  if(isNew) setTimeout(function(){tEl.focus();},260);
}

/* ---------- 通用课表解析：网格表 / 转置表 / 键值对表 ---------- */
var WDX={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'日':6,'天':6,'七':6};
var TCPLACE=/楼|室|馆|厅|场|中心|车间|基地|校区|教室|机房|实验|幢|栋|苑|礼堂|大厦|广场|阶梯|教\d/;
function cdNorm(v){
  if(v==null) return '';
  return String(v).replace(/\u00a0/g,' ').replace(/\r\n?/g,'\n').trim();
}
/* 星期：周一 / 星期一 / 周一\n10/5 / 一 / Monday */
function wdLoose(s){
  var t=cdNorm(s).replace(/\s+/g,'');
  if(!t) return -1;
  var m=t.match(/^(?:星期|周|礼拜)([一二三四五六日天1-7])/);
  if(m) return WDX[m[1]];
  if(/^[一二三四五六日天]$/.test(t)) return WDX[t];
  if(/^mon(day)?$/i.test(t)) return 0;
  if(/^tue(s|sday)?$/i.test(t)) return 1;
  if(/^wed(nes|nesday)?$/i.test(t)) return 2;
  if(/^thu(r|rs|rsday)?$/i.test(t)) return 3;
  if(/^fri(day)?$/i.test(t)) return 4;
  if(/^sat(urday)?$/i.test(t)) return 5;
  if(/^sun(day)?$/i.test(t)) return 6;
  return -1;
}
/* 节次：(1-2节) / 第3节 / 1-2 / 5 */
function jcFrom(s){
  var t=cdNorm(s).replace(/\s+/g,'');
  /* 不少学校的「节次」列写成「上午 1-2」「下午 5-6」，
     原来这里是整串匹配 ^数字-数字$，一带前缀就认不出，整块课会被丢掉。
     先把时段词剥掉再匹配。 */
  t=t.replace(/^(上午|下午|晚上|中午|早晨|早上|夜间|时段|白天)[:：]?/,'');
  if(!t) return null;
  var m=t.match(/第?(\d{1,2})\s*[-—~至]\s*(\d{1,2})\s*节/);
  if(m) return [+m[1],+m[2]];
  m=t.match(/第(\d{1,2})节/);
  if(m) return [+m[1],+m[1]];
  m=t.match(/^(\d{1,2})[-—~至](\d{1,2})$/);
  if(m) return [+m[1],+m[2]];
  m=t.match(/^(\d{1,2})$/);
  if(m) return [+m[1],+m[1]];
  return null;
}
/* 时间：08:00-09:40 / 08:00 09:40 */
function tmFrom(s){
  var t=cdNorm(s).replace(/[：]/g,':');
  var arr=t.match(/\d{1,2}:\d{2}/g);
  if(!arr||!arr.length) return null;
  function f(x){ var q=String(x).match(/^(\d{1,2}):(\d{2})$/); return q?(+q[1])*60+(+q[2]):null; }
  if(arr.length>=2) return [f(arr[0]),f(arr[1])];
  return [f(arr[0]),null];
}
/* 周次：7-18周 / 5-19周(单) / 1,3,5周 */
function wkFrom(s){
  var t=cdNorm(s).replace(/\s+/g,'');
  if(!t) return null;
  var par=null;
  if(/[（(]\s*单\s*[)）]|单周/.test(t)) par='odd';
  else if(/[（(]\s*双\s*[)）]|双周/.test(t)) par='even';
  /* 逐段扫「N周」「N-M周」，每段都允许自带「周」字。
     原来的写法要求所有段挤在同一个「周」前面（2-3,5-15周），
     遇到「3-4周,6-15周」只取到第一段，后面的周次全丢。 */
  var out=[], hit=false, m;
  var re=/(\d{1,2})(?:[-—~至](\d{1,2}))?\s*周/g;
  while((m=re.exec(t))!==null){
    hit=true;
    var a=+m[1], b=m[2]?+m[2]:a;
    if(b<a){ var tmp=a; a=b; b=tmp; }
    if(b-a>30) b=a+30;
    for(var i=a;i<=b;i++) out.push(i);
  }
  if(!hit) return null;
  if(par==='odd') out=out.filter(function(x){return x%2===1;});
  if(par==='even') out=out.filter(function(x){return x%2===0;});
  out=out.filter(function(v,i,a){ return v>0&&v<40&&a.indexOf(v)===i; });
  return out.sort(function(a,b){return a-b;});
}
function isNoCls(s){
  var t=cdNorm(s).replace(/\s+/g,'');
  if(!t) return true;
  return /^[（(【\[]?(无课|无|空|空课|休息|午休|晚休|无课程|无安排|—|-|--|\/)[)）】\]]?$/.test(t);
}
function looksPlace(s){
  var t=cdNorm(s).replace(/\s+/g,'');
  if(!t||t.length>26) return false;
  if(/[:：]/.test(t)) return false;
  if(TCPLACE.test(t)) return true;
  return /^[A-Za-z\u4e00-\u9fa5]{0,4}\d{2,4}[A-Za-z\u4e00-\u9fa5]{0,4}$/.test(t);
}
function looksPerson(s){
  var t=cdNorm(s).replace(/\s+/g,'').replace(/\d+$/,'');
  if(!t||t.length<2||t.length>6) return false;
  if(/\d/.test(t)) return false;
  if(TCPLACE.test(t)) return false;
  if(/[:：\/]/.test(t)) return false;
  if(/[·•]/.test(t)) return true;
  return /^[\u4e00-\u9fa5]{2,4}$/.test(t);
}
function pickLbl(t,keys){
  for(var i=0;i<keys.length;i++){
    var m=t.match(new RegExp('(?:'+keys[i]+')\\s*[:：]\\s*([^\\n\\/、,，;；]+)'));
    if(m&&m[1]&&m[1].trim()) return m[1].trim();
  }
  return '';
}
/* 清理课名：去换行、去课程号、去节次、去周次、去符号 */
function cleanName(s){
  var t=cdNorm(s).replace(/\s+/g,'');
  t=t.replace(/[(（][0-9A-Za-z]{6,12}[)）]/g,'');
  t=t.replace(/[(（][^)）]{0,8}节[)）]/g,'');
  t=t.replace(/(?:\d{1,2}(?:[-—~至]\d{1,2})?周[（(]?[单双]?[)）]?[,，、]?)+/g,'');
  t=t.replace(/[★☆◆■○◐●〇※△▲□]/g,'');
  t=t.replace(/[(（]\s*[)）]/g,'');
  t=t.replace(/^[\/\-—:：,，]+/,'').replace(/[\/\-—:：,，]+$/,'');
  return t.trim();
}
/* 「字段:值」形式的一段，如 场地:11J2102 / 教师:韩雪 */
function fieldOf(seg){
  var t=cdNorm(seg);
  var ci=t.search(/[:：]/);
  if(ci>0) t=t.slice(0,ci).replace(/\s+/g,'')+t.slice(ci);
  var m=t.match(/^(校区|场地|地点|教室|上课地点|上课教室|教师|老师|任课教师|主讲教师|主讲|职称|教学班组成|教学班|考核方式|学分|周学时|总学时)\s*[:：]\s*([\s\S]*)$/);
  return m?{k:m[1],v:(m[2]||'').replace(/\s+/g,' ').trim()}:null;
}
/* 标签必须落在行首，避免把「场地:/教师:」里的半段当成独立标签 */
function pickLblAt(t,keys){
  for(var i=0;i<keys.length;i++){
    var m=t.match(new RegExp('(?:^|[\\n])\\s*(?:'+keys[i]+')\\s*[:：]\\s*([^\\n\\/、,，;；]+)'));
    if(m&&m[1]&&m[1].trim()) return m[1].trim();
  }
  return '';
}
function normT(s){ return cdNorm(s).replace(/\s+/g,'').replace(/\d+$/,''); }
/* 一个格子 → 一门课 */
function parseGridCell(raw,ctx){
  var s=cdNorm(raw);
  if(isNoCls(s)) return null;
  var out={name:'',place:'',teacher:'',j1:ctx.j1,j2:ctx.j2,weeks:(ctx.weeks||[]).slice()};

  /* 0. 花括号写法：高等数学 {第1-16周 张老师 A101 */
  var bi=s.indexOf('{');
  if(bi>0){
    var nm0=cleanName(s.slice(0,bi));
    if(nm0){
      out.name=nm0;
      var tail0=s.slice(bi);
      var wb0=wkFrom(tail0); if(wb0&&wb0.length) out.weeks=wb0;
      var jb0=jcFrom(tail0); if(jb0){ out.j1=jb0[0]; out.j2=jb0[1]; }
      var rest0=tail0.replace(/[{}]/g,' ')
        .replace(/第?\d{1,2}(?:[-—~至]\d{1,2})?周[（(]?[单双]?[)）]?/g,' ')
        .split(/\s+/).filter(Boolean);
      for(var q=0;q<rest0.length;q++){
        if(!out.place&&looksPlace(rest0[q])){ out.place=rest0[q]; continue; }
        if(!out.teacher&&looksPerson(rest0[q])){ out.teacher=rest0[q]; continue; }
      }
      return out;
    }
  }

  /* A. 斜杠式（优先于键值对）：课名/(1-2节)7-18周/校区:主校区/场地:11J2102/教师:韩雪/... */
  if(s.indexOf('/')>=0){
    var segs=s.split(/\s*\/\s*/).map(function(x){return x.trim();}).filter(function(x){return x!=='';});
    if(segs.length>=3){
      out.name=cleanName(segs[0]);
      var jF=null,wF=null,oth=[],fv={};
      /* 节次和周次常常贴在课名那一段里：(1-2节)5-17周 */
      var jt0=jcFrom(segs[0]); if(jt0&&/节/.test(segs[0])) jF=jt0;
      var wt0=wkFrom(segs[0]); if(wt0&&wt0.length) wF=wt0;
      for(var k=1;k<segs.length;k++){
        var sg=segs[k];
        var fd=fieldOf(sg);
        if(fd){ if(!fv[fd.k]) fv[fd.k]=fd.v; continue; }
        var jj=jcFrom(sg), ww=wkFrom(sg);
        var isJ=!!(jj&&/节/.test(sg)), isW=!!(ww&&ww.length);
        if(isJ&&!jF) jF=jj;
        if(isW&&!wF) wF=ww;
        if(!isJ&&!isW) oth.push(sg);
      }
      if(jF){ out.j1=jF[0]; out.j2=jF[1]; }
      if(wF) out.weeks=wF;
      for(var m=0;m<oth.length;m++){
        var o=oth[m];
        if(!out.place&&looksPlace(o)){ out.place=o; continue; }
        if(!out.teacher&&looksPerson(o)){ out.teacher=normT(o); continue; }
      }
      if(!out.place) out.place=(fv['场地']||fv['地点']||fv['教室']||fv['上课地点']||fv['上课教室']||fv['校区']||'').replace(/\s+/g,'');
      if(!out.teacher) out.teacher=normT(fv['教师']||fv['老师']||fv['任课教师']||fv['主讲教师']||fv['主讲']||'');
      if(!out.place){
        for(var m2=0;m2<oth.length;m2++){
          var o2=oth[m2];
          if(/^\d+(\.\d+)?$/.test(o2)) continue;
          if(/[:：]/.test(o2)) continue;
          if(/^[\u4e00-\u9fa5A-Za-z]{2,}-\d+$/.test(o2)) continue;
          if(o2===out.teacher) continue;
          out.place=o2; break;
        }
      }
      if(out.name) return out;
      out.name=cleanName(s);
      return out.name?out:null;
    }
  }

  /* B. 键值对：地点：xxx / 教师：xxx / 周次：x-x */
  var pl=pickLblAt(s,['上课地点','上课教室','地点','场地','教室']);
  var tc=pickLblAt(s,['任课教师','主讲教师','授课教师','教师','老师']);
  var wk=pickLblAt(s,['上课周次','周次','周数']);
  if(pl||tc||wk){
    out.place=pl; out.teacher=tc;
    if(wk){ var w0=wkFrom(wk+'周')||wkFrom(wk); if(w0&&w0.length) out.weeks=w0; }
    var ls=s.split(/\n/).map(function(x){return x.trim();}).filter(Boolean), nm='';
    for(var i=0;i<ls.length;i++){
      if(/(?:上课地点|上课教室|地点|教室|任课教师|主讲教师|授课教师|教师|老师|周次|周数)\s*[:：]/.test(ls[i])) continue;
      nm=ls[i]; break;
    }
    out.name=cleanName(nm);
    var j0=jcFrom(s); if(j0){ out.j1=j0[0]; out.j2=j0[1]; }
    var w1=wkFrom(s); if(w1&&w1.length) out.weeks=w1;
    return out.name?out:null;
  }

  /* C. 单行 */
  var ls2=s.split(/\n/).map(function(x){return x.trim();}).filter(Boolean);
  if(ls2.length===1){
    var one=ls2[0];
    var j2=jcFrom(one);
    if(j2&&/节/.test(one)){ out.j1=j2[0]; out.j2=j2[1]; }
    var w2=wkFrom(one); if(w2&&w2.length) out.weeks=w2;
    out.name=cleanName(one.replace(/\/.*$/,''));
    return out.name?out:null;
  }

  /* D. 多行：课名 / 教学班代码 / 教师 职称 / 周次 教室 */
  out.name=cleanName(ls2[0]);
  var rest=ls2.slice(1);
  if(!out.name&&rest.length) out.name=cleanName(rest.shift());
  var placeP=[];
  var TEACHER_RE=/^(.{2,12}?)[\s\u3000]+(讲师|副教授|教授|助教|研究员|副研究员|高级工程师|工程师|高级实验师|实验师|外聘[\u4e00-\u9fa5]*|助理[\u4e00-\u9fa5]*)$/;
  for(var ri=0;ri<rest.length;ri++){
    var ln2=rest[ri];
    /* 整行就是一个括号包着的教学班代码，丢掉 */
    if(/^[（(].{1,26}[)）]$/.test(ln2)&&!/[楼室馆场周]/.test(ln2)) continue;
    var mt2=ln2.match(TEACHER_RE);
    if(mt2&&!out.teacher){ out.teacher=normT(mt2[1]); continue; }
    var w3=wkFrom(ln2);
    if(w3&&w3.length){
      if(!out.weeks.length) out.weeks=w3;
      var left=ln2.replace(/^[\s\d、,，\-—~至()（）单双]*周/,'').replace(/^[\s,，、；;]+/,'').trim();
      if(left&&!/^\d+$/.test(left)) placeP.push(left);
      continue;
    }
    placeP.push(ln2);
  }
  if(!out.teacher){
    for(var p=placeP.length-1;p>=0;p--){
      if(looksPerson(placeP[p])){ out.teacher=normT(placeP[p]); placeP.splice(p,1); break; }
    }
  }
  out.place=placeP.join(' ').replace(/\s+/g,' ').trim();
  return out.name?out:null;
}
/* 复制到剪贴板（WebView 里 clipboard 可能不可用，退回 execCommand） */
function copyText(txt,okMsg,failMsg){
  var done=function(){ toast(okMsg,true); };
  var fail=function(){ toast(failMsg); };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,fail);
      return;
    }
  }catch(e){}
  try{
    var ta=document.createElement('textarea');
    ta.value=txt;
    ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,txt.length);
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    ok?done():fail();
  }catch(e2){ fail(); }
}
/* 收尾：拆出「课名@教室」里的教室，以及结尾的 (201教室) */
function finishCell(co){
  if(!co||!co.name) return co;
  var at=co.name.indexOf('@');
  if(at>0){
    var p2=co.name.slice(at+1).replace(/^[@\s]+/,'');
    co.name=co.name.slice(0,at);
    if(!co.place&&p2) co.place=p2.replace(/\s+/g,' ').trim();
  }
  var mm=co.name.match(/^(.+?)[（(]([^)）]{2,})[)）]\s*$/);
  if(mm&&!co.place&&/(楼|室|馆|场|教\s*\d|\d{2,4})/.test(mm[2])){
    co.place=mm[2].trim(); co.name=mm[1].trim();
  }
  var mt=co.name.match(/^(.{3,})[（(]([\u4e00-\u9fa5]{2,4})[)）]\s*$/);
  if(mt&&!co.teacher&&!/^(板块|理论|实验|上机|实践|选修|必修|限选|任选|双语|全英|本部|校区)$/.test(mt[2])){
    co.teacher=mt[2]; co.name=mt[1].trim();
  }
  co.name=co.name.replace(/\s+$/,'');
  return co.name?co:null;
}

/* 二维表 → 课程列表。不是网格课表返回 null */
function parseGridSchedule(rows,sheetName){
  rows=(rows||[]).map(function(r){ return (r||[]).map(cdNorm); });
  if(!rows.length) return null;

  /* 1) 找表头行：星期格最多的一行 */
  var headRow=-1,headMap={},best=0,colMode=true,r,c;
  for(r=0;r<Math.min(rows.length,25);r++){
    var map={},n=0;
    for(c=0;c<rows[r].length;c++){
      var wd=wdLoose(rows[r][c]);
      if(wd>=0){ map[c]=wd; n++; }
    }
    if(n>best&&n>=2){ best=n; headRow=r; headMap=map; }
  }
  if(headRow<0){
    /* 2) 转置：第一列是星期 */
    var rmap={},n2=0;
    for(r=0;r<Math.min(rows.length,25);r++){
      var w2=wdLoose(rows[r][0]);
      if(w2>=0&&rows[r].length>2){ rmap[r]=w2; n2++; }
    }
    if(n2<2) return null;
    headRow=-2; headMap=rmap; colMode=false;
  }

  var list=[],errs=[],perSeen={};
  var badRow=function(num,col,msg){
    errs.push(isEN()?(col?('Row '+num+', col '+col+': '+msg):('Row '+num+': '+msg))
                    :(col?('第 '+num+' 行第 '+col+' 列：'+msg):('第 '+num+' 行：'+msg)));
  };
  var isFragment=function(nm){
    if(!nm||nm.length<2) return true;
    if(/^\d+(\.\d+)?$/.test(nm)) return true;
    if(/^[^:：]{0,3}[:：][\d.]+$/.test(nm)) return true;
    return false;
  };

  if(colMode){
    /* 先把每一「节次块」收集起来；同一格里放不下的文字会被挤到下面几行的空单元格，
       那些续行归属到「上面第一个在相同列上有内容的块」 */
    var blocks=[];
    for(r=headRow+1;r<rows.length;r++){
      var row=rows[r]||[], content={}, lbls=[];
      for(c=0;c<row.length;c++){
        if(headMap[c]!=null) content[c]=row[c];
        else if(row[c]) lbls.push(row[c]);
      }
      var lbl=lbls.join(' ');
      if(!lbl&&!Object.keys(content).length) continue;
      if(/^\s*(注|说明|备注)/.test(lbl)&&!jcFrom(lbl)) continue;
      if(/^[■◆★☆※]/.test(lbl)) continue;

      if(!lbls.length){
        var tgt=null, ck, bi;
        for(bi=blocks.length-1;bi>=0&&!tgt;bi--){
          for(ck in content){
            if(content[ck]&&blocks[bi].cells[ck]){ tgt=blocks[bi]; break; }
          }
        }
        if(tgt){ for(ck in content){ if(content[ck]) tgt.cells[ck]=(tgt.cells[ck]||'')+content[ck]; } }
        continue;
      }
      var cellCopy={};
      for(var c6 in content) if(content[c6]) cellCopy[c6]=content[c6];
      blocks.push({row:r+1,lbl:lbl,lbls:lbls.slice(),jt:jcFrom(lbl),tm:tmFrom(lbl),cells:cellCopy});
    }

    blocks.forEach(function(bk){
      var cells=bk.cells, jt=bk.jt, k;
      if(!jt){
        /* 「上午」「1-2」是两列拼起来的，整串认不出就逐列试 */
        var lb=bk.lbls||[];
        for(var li=0;li<lb.length;li++){ var jy=jcFrom(lb[li]); if(jy){ jt=jy; break; } }
      }
      if(!jt){
        for(k in cells){ var jx=jcFrom(cells[k]); if(jx&&/节/.test(cells[k])){ jt=jx; break; } }
      }
      if(jt&&bk.tm&&bk.tm[0]!=null&&bk.tm[1]!=null&&!perSeen[jt[0]])
        perSeen[jt[0]]={n:jt[0],s:bk.tm[0],e:bk.tm[1]};
      var has=false;
      for(k in cells){ if(cells[k]&&!isNoCls(cells[k])){ has=true; break; } }
      if(!has) return;
      if(!jt){ badRow(bk.row,0,isEN()?'period not found':'没认出节次'); return; }
      for(k in cells){
        var cell=cells[k];
        if(!cell||isNoCls(cell)) continue;
        /* 一格多课：空行分隔 */
        var parts=String(cell).split(/\n[ \t]*\n+/);
        for(var pi=0;pi<parts.length;pi++){
          var one=parts[pi];
          if(!one||isNoCls(one)) continue;
          var co=parseGridCell(one,{j1:jt[0],j2:jt[1],weeks:wkFrom(one)||[]});
          if(!co||isFragment(co.name)){ badRow(bk.row,(+k)+1,isEN()?'no class name':'没认出课程名'); continue; }
          co=finishCell(co); if(!co) continue;
          co.wd=headMap[k];
          list.push(co);
        }
      }
    });
  }else{
    for(r=0;r<rows.length;r++){
      var wRow=headMap[r];
      if(wRow==null) continue;
      var rw=rows[r]||[];
      for(c=1;c<rw.length;c++){
        var cell2=rw[c];
        if(!cell2||isNoCls(cell2)) continue;
        var jt2=jcFrom(cell2)||jcFrom(rows[0]&&rows[0][c]);
        if(!jt2) continue;
        var co2=parseGridCell(cell2,{j1:jt2[0],j2:jt2[1],weeks:wkFrom(cell2)||[]});
        if(!co2||isFragment(co2.name)) continue;
        co2=finishCell(co2); if(!co2) continue;
        co2.wd=wRow;
        list.push(co2);
      }
    }
  }

  /* 学期开始日：只在提到学期/开学的行里找 */
  var termStart=null;
  for(r=0;r<rows.length&&!termStart;r++){
    var tline=(rows[r]||[]).join(' ');
    if(!/(本学期|开学|正式上课|学期)/.test(tline)) continue;
    var tm2=tline.match(/(20\d{2})\s*[-年\/.]\s*(\d{1,2})\s*[-月\/.]\s*(\d{1,2})/);
    if(!tm2) continue;
    var mm=+tm2[2], dd=+tm2[3];
    if(mm<1||mm>12||dd<1||dd>31) continue;
    termStart=tm2[1]+'-'+('0'+mm).slice(-2)+'-'+('0'+dd).slice(-2);
  }
  /* 表头日期 + 第N周 → 反推第一周周一 */
  if(!termStart&&headRow>=0){
    var wkN=null, mw=(String(sheetName||'')+' '+(rows[0]||[]).join(' ')).match(/第\s*(\d{1,2})\s*周/);
    if(mw) wkN=+mw[1];
    var md=null;
    for(c=0;c<(rows[headRow]||[]).length;c++){
      var cm=(rows[headRow][c]||'').match(/(\d{1,2})[\/.\-月](\d{1,2})/);
      if(cm&&+cm[1]>=1&&+cm[1]<=12&&+cm[2]>=1&&+cm[2]<=31){ md=[+cm[1],+cm[2]]; break; }
    }
    if(wkN&&md){
      var y=new Date().getFullYear();
      var dt=new Date(y,md[0]-1,md[1]), now=new Date();
      if(dt-now>300*86400000) dt=new Date(y-1,md[0]-1,md[1]);
      else if(now-dt>300*86400000) dt=new Date(y+1,md[0]-1,md[1]);
      dt=new Date(dt.getTime()-7*(wkN-1)*86400000);
      termStart=dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2);
    }
  }

  var periods=[];
  for(var pn in perSeen){ if(typeof perSeen[pn]==='object') periods.push(perSeen[pn]); }
  periods.sort(function(a,b){ return a.n-b.n; });

  return {list:list,errs:errs,grid:true,periods:periods,termStart:termStart,src:sheetName||''};
}

/* ---------- 课表导入 / 作息设置 ---------- */
function weekdayOf(str){
  var t=String(str||'').trim();
  var m=t.match(/^(星期|周|礼拜)\s*([一二三四五六日天])$/);
  if(m){
    var map={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'日':6,'天':6};
    return map[m[2]]!=null?map[m[2]]:-1;
  }
  /* AI 有时按英文输出，一并认了 */
  var en=t.toLowerCase().replace(/\.$/,'');
  var em={mon:0,monday:0,tue:1,tues:1,tuesday:1,wed:2,weds:2,wednesday:2,
          thu:3,thur:3,thurs:3,thursday:3,fri:4,friday:4,sat:5,saturday:5,sun:6,sunday:6};
  if(em[en]!=null) return em[en];
  return -1;
}
/* 表头驱动：只要前几行里有「课程/星期/节次/周次/地点/教师」这类列名，
   就按列名定位，不再靠猜列的位置。
   这样 AI 把表转成什么样（加了序号列、列序变了、tab 还是竖线分隔）都能读对。 */
function parseHeaderTable(lines){
  for(var i=0;i<Math.min(lines.length,10);i++){
    var raw=String(lines[i]||'');
    if(!raw.trim()) continue;
    var sep=/	/.test(raw)?/\t+/:/\s*[|｜]\s*/;
    var cs=raw.split(sep).map(function(x){ return String(x||'').trim(); });
    if(cs.length<4) continue;
    var idx={name:-1,wd:-1,jt:-1,wk:-1,place:-1,teacher:-1}, hit=0, j;
    for(j=0;j<cs.length;j++){
      var c=cs[j].replace(/[\s*＊]/g,'');
      if(idx.name<0   && /^(课程名称|课程名|科目名称|课程|科目|名称|课名)$/.test(c)) { idx.name=j; hit++; continue; }
      if(idx.wd<0     && /^(星期|周几|上课星期|星期几|day|weekday)$/i.test(c))    { idx.wd=j; hit++; continue; }
      if(idx.jt<0     && /^(节次|节|上课节次|时段|节数|period)$/i.test(c))          { idx.jt=j; hit++; continue; }
      if(idx.wk<0     && /^(周次|上课周次|教学周|周数|weeks?)$/i.test(c))            { idx.wk=j; hit++; continue; }
      if(idx.place<0  && /^(地点|教室|场地|上课地点|上课教室|room|location)$/i.test(c)){ idx.place=j; continue; }
      if(idx.teacher<0&& /^(教师|老师|任课教师|授课教师|teacher)$/i.test(c))         { idx.teacher=j; continue; }
    }
    if(hit>=3) return {row:i, idx:idx, sep:sep};
  }
  return null;
}
function parseCourseText(txt){
  var lines=String(txt||'').split(/\r?\n/), out=[], errs=[];
  /* 先看是不是粘错了「周课表」（一行里堆着好几个星期几） */
  for(var li=0; li<Math.min(lines.length,6); li++){
    var cs=String(lines[li]).split(/\t+/);
    var nwd=cs.filter(function(c){ return weekdayOf(String(c).trim())>=0; }).length;
    if(nwd>=3){
      return {list:[], errs:[isEN()?'This looks like a grid timetable (periods × weekdays). Use the "Class detail" sheet instead — one row per class with weekday, period and weeks columns.':'这看起来是「周课表」（行列是节次×星期的那种）。请换另一张表：Excel 里叫「上课明细」，每行是一门课，有「星期」「节次」「周次」三列，复制它再粘贴。'], grid:true};
    }
  }
  /* 先看是不是「有表头的明细表」——这种直接按列名读，成功率最高 */
  var HT=parseHeaderTable(lines);
  if(HT){
    for(var hi=HT.row+1; hi<lines.length; hi++){
      var hraw=String(lines[hi]||'').replace(/\u00a0/g,' ').trim();
      if(!hraw) continue;
      if(/^(以下|上面|说明|注意|注[：:]|共\s*\d|整理后)/.test(hraw)) continue;
      var hc=hraw.split(HT.sep).map(function(x){ return String(x||'').trim(); });
      var hname=HT.idx.name>=0 ? (hc[HT.idx.name]||'') : '';
      var hwd   = HT.idx.wd>=0   ? weekdayOf(hc[HT.idx.wd]||'') : -1;
      var hjt   = HT.idx.jt>=0   ? jcFrom(hc[HT.idx.jt]||'') : null;
      var hwk   = HT.idx.wk>=0   ? wkAny(hc[HT.idx.wk]||'') : null;
      if(!hname || hwd<0 || !hjt || !hwk){
        if(hname || hwd>=0 || hjt){ errs.push((isEN()?'Line '+(hi+1)+': incomplete → ':'第 '+(hi+1)+' 行：信息不全 → ')+hraw.slice(0,26)); }
        continue;
      }
      var hco={name:cleanName(hname), place:(HT.idx.place>=0?(hc[HT.idx.place]||''):''),
               teacher:(HT.idx.teacher>=0?(hc[HT.idx.teacher]||''):''),
               j1:hjt[0], j2:hjt[1], weeks:hwk, wd:hwd};
      hco=finishCell(hco);
      if(hco) out.push(hco);
    }
    if(out.length) return {list:out, errs:errs};
    out=[]; errs=[];   /* 表头模式没读出东西，退回原来的宽松解析 */
  }
  lines.forEach(function(raw,idx){
    var ln=raw.replace(/\u00a0/g,' ').trim();
    if(!ln) return;
    if(/序号/.test(ln)&&/课程/.test(ln)) return;
    if(/课程名称/.test(ln)&&/(星期|节次|教师|地点|周次)/.test(ln)) return;
    if(/^(以下|上面|说明|注意|注[：:]|共\s*\d|整理后|好的|以下是)/.test(ln)) return;
    var cells=ln.split(/\t+/).map(function(x){return x.trim();});
    if(cells.length<3) cells=ln.split(/[,，;；|]+|\s{2,}/).map(function(x){return x.trim();}).filter(Boolean);
    var wd=-1, wdIdx=-1, i;
    for(i=0;i<cells.length;i++){ var k=weekdayOf(cells[i]); if(k>=0){ wd=k; wdIdx=i; break; } }
    if(wd<0){ if(!/周|节/.test(ln)) return; errs.push((isEN()?'Line '+(idx+1)+': weekday not recognised → ':'第 '+(idx+1)+' 行：没认出星期几 → ')+ln.slice(0,24)); return; }
    var jt=null, jIdx=-1;
    for(i=0;i<cells.length;i++){
      var m=cells[i].match(/^第?(\d+)\s*[-—~至]\s*(\d+)\s*节$/);
      if(m){ jt=[+m[1],+m[2]]; jIdx=i; break; }
      m=cells[i].match(/^第?(\d+)\s*节$/);
      if(m){ jt=[+m[1],+m[1]]; jIdx=i; break; }
    }
    if(!jt){ errs.push(isEN()?('Line '+(idx+1)+': period not recognised'):('第 '+(idx+1)+' 行：没认出节次')); return; }
    var wk=null, wkIdx=-1;
    for(i=0;i<cells.length;i++){
      if(i===jIdx||i===wdIdx) continue;
      if(/周/.test(cells[i])&&/\d/.test(cells[i])){ var w=parseWeeks(cells[i]); if(w.length){ wk=w; wkIdx=i; break; } }
    }
    if(!wk){
      for(i=0;i<cells.length;i++){
        if(i===jIdx||i===wdIdx) continue;
        if(/^(每周|每周都上|全周|全学期)$/.test(cells[i])){ wk=[]; wkIdx=i; break; }
      }
    }
    if(!wk){ errs.push(isEN()?('Line '+(idx+1)+': weeks not recognised'):('第 '+(idx+1)+' 行：没认出周次')); return; }
    var name=(wdIdx>0)?cells[wdIdx-1]:'';
    name=name.replace(/[○◐●〇★◆]/g,'').trim();
    if(!name||/^\d+$/.test(name)){ errs.push(isEN()?('Line '+(idx+1)+': class name not recognised'):('第 '+(idx+1)+' 行：没认出课程名')); return; }
    var place='', teacher='';
    if(wkIdx>0&&wkIdx+1<cells.length) place=cells[wkIdx+1];
    if(wkIdx>0&&wkIdx+2<cells.length) teacher=cells[wkIdx+2];
    if(/^\d+(\.\d+)?$/.test(place)) place='';
    out.push(normalizeCourse({name:name,teacher:teacher,place:place,wd:wd,j1:jt[0],j2:jt[1],weeks:wk}));
  });
  return {list:out,errs:errs};
}

      h+='<div class="hint" style="padding:0;margin-top:6px;line-height:1.7">'+
        T('上面这些行一般是实践课、军训或实习，表里只写了周次和老师，没有星期几和节次，排不进时间轴，跳过是对的。真要记的话，在日程里手动加一条待办就行。',
          'Those lines are usually practice / military training / internship — the sheet gives only weeks and teacher, no weekday or period, so they cannot sit on the timeline. Add a to-do manually if you need to.')+
        '</div>';
    }
    if(!r.list.length&&!r.errs.length) h+='<div class="hint" style="margin-top:12px">'+(isEN()?'No classes found — check that this file really is a timetable.':'没读到课程，确认一下这个文件是不是课表。')+'</div>';
    if(r.list.length){
      var pDiff=(r.periods&&r.periods.length)&&JSON.stringify(r.periods)!==JSON.stringify(S.settings.periods||[]);
      if(pDiff){
        var p0=r.periods[0], pN=r.periods[r.periods.length-1];
        var pSum=(p0.s!=null&&pN.e!=null)?(isEN()?(r.periods.length+' periods, '+hhmm(p0.s)+'–'+hhmm(pN.e)):('共 '+r.periods.length+' 节，'+hhmm(p0.s)+'–'+hhmm(pN.e))):(isEN()?(r.periods.length+' periods'):('共 '+r.periods.length+' 节'));
        h+='<div class="card" style="margin-top:12px;padding:11px 14px">'+
          '<label style="display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.5">'+
          '<input type="checkbox" id="ciPeriod" checked style="margin-top:3px;flex:none">'+
          '<span>'+UIx('ciPeriodT')+'<span style="color:var(--text-3);font-size:11.5px;display:block;margin-top:1px">'+pSum+'</span></span></label></div>';
      }
      if(r.termStart){
        var sameT=(S.settings.termStart||'')===r.termStart;
        if(!sameT){
          h+='<div class="card" style="margin-top:8px;padding:11px 14px">'+
            '<label style="display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.5">'+
            '<input type="checkbox" id="ciTerm" checked style="margin-top:3px;flex:none">'+
            '<span>'+UIx('ciTermT')+'<span style="color:var(--text-3);font-size:11.5px;display:block;margin-top:1px">'+
            r.termStart+(S.settings.termStart?('（'+(isEN()?'now ':'现在是 ')+S.settings.termStart+'）'):'')+
            '</span></span></label></div>';
        }
      }
      h+='<button class="subtle" id="ciGo" style="margin-top:14px;color:var(--accent);font-weight:600;font-size:14px">'+(isEN()?('Import '+r.list.length+' class'+(r.list.length>1?'es':'')):('确认导入这 '+r.list.length+' 条'))+'</button>';
      h+='<label class="hint" style="display:block;margin-top:10px;padding:0"><input type="checkbox" id="ciRep" style="vertical-align:-2px"> '+(isEN()?'Replace existing classes':'覆盖原有课程')+'</label>';
      h+='<label class="hint" style="display:block;margin-top:8px;padding:0"><input type="checkbox" id="ciClrTask" style="vertical-align:-2px"> '+(isEN()?'Also remove the to-dos that duplicate these classes':'同时删掉和这些课重名的待办')+'</label>';
    }
    $('#ciPrev',sh).innerHTML=h;
    $('#ciPrev',sh).scrollIntoView({block:'nearest',behavior:'smooth'});
    var go=$('#ciGo',sh);
    if(go) go.addEventListener('click',function(){
      var rep2=$('#ciRep',sh)&&$('#ciRep',sh).checked;
      var pOK=$('#ciPeriod',sh)&&$('#ciPeriod',sh).checked;
      var tOK=$('#ciTerm',sh)&&$('#ciTerm',sh).checked;
      snapshot();
      if(rep2){ S.courses=[]; S.moves=[]; }
      var clrT=$('#ciClrTask',sh)&&$('#ciClrTask',sh).checked;
      if(clrT){
        /* 之前手动把课抄成待办的人，导入后同一个时间段会同时出现「待办卡」和「课程卡」，
           看起来像重复。这里按全名和简称两种写法比对，把那些待办删掉。 */
        var nmSet={};
        __courseParsed.list.forEach(function(c){
          var f=String(c.name||'').replace(/\s/g,'');
          if(f) nmSet[f]=1;
          var sh2=shortName(c.name);
          if(sh2) nmSet[sh2]=1;
        });
        var before=(S.tasks||[]).length;
        S.tasks=(S.tasks||[]).filter(function(t){
          var s1=String(t.title||'').replace(/\s/g,'');
          var s2=shortName(t.title);
          return !(nmSet[s1]||nmSet[s2]);
        });
        var removed=before-(S.tasks||[]).length;
        if(removed>0) toast(T('已顺带删掉 '+removed+' 条重名待办', removed+' duplicate to-do(s) removed'), true);
      }
      if(pOK&&__courseParsed.periods&&__courseParsed.periods.length) S.settings.periods=__courseParsed.periods.slice();
      if(tOK&&__courseParsed.termStart) S.settings.termStart=__courseParsed.termStart;
      /* 作息节数不足以覆盖课程节次时（换了学校的课表），补到够用，不然那些课不显示 */
      var maxJ=0;
      __courseParsed.list.forEach(function(c){ var e=c.j2||c.j1||0; if(e>maxJ) maxJ=e; });
      if(maxJ>periodsOf().length){
        var nd=DEFAULT_PERIODS.map(function(x,i){ return {n:i+1,s:toMin(x[0]),e:toMin(x[1])}; });
        while(nd.length<maxJ){ var lz=nd[nd.length-1]; nd.push({n:nd.length+1,s:(lz.e||600)+10,e:(lz.e||600)+55}); }
        S.settings.periods=nd;
      }
      __courseParsed.list.forEach(function(c){ S.courses.push(c); });
      save(); render(); closeSheet();
      toast(UIx('importedN',{n:__courseParsed.list.length}),true);
      if(!S.settings.termStart) setTimeout(function(){ openTermStartHint(); },400);
    });
  }

  $('#ciPick',sh).addEventListener('click',function(){ $('#ciFile',sh).click(); });
  $('#ciFile',sh).addEventListener('change',function(){
    var f=this.files&&this.files[0]; if(!f) return;
    $('#ciFileN',sh).textContent=(isEN()?'Selected: ':'已选择：')+f.name;
    if(typeof XLSX==='undefined'){
      $('#ciPrev',sh).innerHTML='<div class="warn">'+UIx('ciNoGrid')+'</div>';
      return;
    }
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
        var names=wb.SheetNames||[], best=null;
        for(var si=0;si<names.length;si++){
          var srows=sheetToRows(wb.Sheets[names[si]]);
          if(!srows.length) continue;
          var rr=parseAnySheet(srows,names[si]);
          if(!best||rr.list.length>best.r.list.length
             ||(rr.list.length===best.r.list.length&&/明细/.test(names[si])&&!/明细/.test(best.name)))
            best={r:rr,name:names[si]};
        }
        renderPreview(best?best.r:{list:[],errs:[]});
      }catch(e){
        $('#ciPrev',sh).innerHTML='<div class="warn">'+(isEN()?'Could not read this file: ':'读不了这个文件：')+esc(e.message||(isEN()?'bad format':'格式不对'))+'</div>';
      }
    };
    rd.onerror=function(){ $('#ciPrev',sh).innerHTML='<div class="warn">'+(isEN()?'Could not read the file':'文件读取出错')+'</div>'; };
    rd.readAsArrayBuffer(f);
  });
  /* 三个入口的分段切换 */
  (function(){
    var tabs=sh.querySelectorAll('.citab button');
    for(var i=0;i<tabs.length;i++){
      tabs[i].addEventListener('click',function(){
        var t=this.getAttribute('data-t');
        for(var k=0;k<tabs.length;k++) tabs[k].classList.toggle('on', tabs[k]===this);
        ['file','paste','ai'].forEach(function(key){
          var p=$('#ciP-'+key,sh); if(p) p.hidden=(key!==t);
        });
      });
    }
  })();
  $('#ciAiExcel',sh).addEventListener('click',function(){
    copyText(aiPromptExcel(),UIx('ciAiDone'),isEN()?'Copy failed':'复制失败');
  });
  $('#ciAiCopy',sh).addEventListener('click',function(){
    copyText(aiPrompt(),UIx('ciAiDone'),isEN()?'Copy failed':'复制失败');
  });
  $('#ciAiParse',sh).addEventListener('click',function(){
    var v=($('#ciAiText',sh)&&$('#ciAiText',sh).value)||'';
    if(!v.trim()){ toast(isEN()?'Paste something first':'先把 AI 给你的内容粘进来'); return; }
    renderPreview(parseAnySheet(v.split(/\r?\n/).map(function(l){ return l.split(/\t|\s*\|\s*/); }),'pasted'));
  });
  $('#ciParse',sh).addEventListener('click',function(){
    var pv=$('#ciText',sh).value||'';
    renderPreview(parseAnySheet(pv.split(/\r?\n/).map(function(l){ return l.split(/\t/); }),'pasted'));
  });

    '<div class="sh-b">'+
      '<div class="hint">'+(isEN()?'Classes are in, but the first day of week 1 is missing — without it the week number cannot be worked out.':'课程导进来了，但还差「开学第一周」的日期，不然算不出每天是第几周。')+'</div>'+
      '<div class="hint" style="margin-top:8px">'+(isEN()?'Pick the <b>Monday</b> of week 1:':'填第 1 周<b>周一</b>的日期：')+'</div>'+

function openPeriods(){
  var draft = __pdDraft; __pdDraft = null;
  var cur = draft || periodsOf();
  var sh = openSheet('');

  function hdr(title, rightId, rightTxt){
    return '<div class="sh-h"><button class="tb" id="pdX">'+UIx('close')+'</button>'+
      '<div class="t">'+title+'</div>'+
      (rightId ? ('<button class="tb r strong" id="'+rightId+'">'+rightTxt+'</button>') : '<span style="width:44px"></span>')+
      '</div>';
  }
  function row(label, control){
    return '<div class="row"><span class="lbl">'+label+'</span>'+control+'</div>';
  }
  function num(id, val, min, max){
    return '<input type="number" id="'+id+'" value="'+val+'" min="'+min+'" max="'+max+'" style="width:74px;text-align:center">';
  }
  function tmin(id, val){ return '<input type="time" id="'+id+'" value="'+val+'" style="width:112px">'; }

  /* ---- 逐节表 ---- */
  function paintTable(){
    var rows = cur.map(function(p){
      return '<div class="row"><span class="lbl">'+jieci(p.n,p.n)+'</span>'+
        '<input type="time" data-p="'+p.n+'" data-k="s" value="'+(p.s!=null?hhmm(p.s):'')+'" style="width:106px">'+
        '<span class="lbl" style="opacity:.5">~</span>'+
        '<input type="time" data-p="'+p.n+'" data-k="e" value="'+(p.e!=null?hhmm(p.e):'')+'" style="width:106px"></div>';
    }).join('');
    sh.innerHTML = hdr(UIx('rowPeriods'), 'pdSave', UIx('save'))+
      '<div class="sh-b">'+
      '<div class="hint">'+(isEN()
        ? 'Fill in the class times your school uses. Class blocks land on these slots; leave a row empty if nothing happens then.'
        : '按你们学校的作息填，课程块会落在这些时间段上。留空表示这一节不排课。')+'</div>'+
      '<button class="subtle" id="pdSchool" style="margin-top:10px">'+(isEN()?'Fill by school':'按学校自动填')+'</button>'+
      '<div class="row" style="margin-top:8px;gap:8px">'+
        '<button class="subtle" id="pdGen" style="flex:1">'+(isEN()?'Quick fill':'一键生成')+'</button>'+
        '<button class="subtle" id="pdPaste" style="flex:1">'+(isEN()?'Paste times':'粘贴作息')+'</button>'+
      '</div>'+
      '<div class="card" style="margin-top:8px">'+rows+'</div>'+
      '<button class="subtle" id="pdReset" style="margin-top:10px">'+(isEN()
        ? 'Reset to default (Guangxi University)' : '恢复默认（广西大学）')+'</button>'+
      '</div>';
    $('#pdX').addEventListener('click', closeSheet);
    $('#pdSchool').addEventListener('click', paintSchool);
    $('#pdGen').addEventListener('click', paintGen);
    $('#pdPaste').addEventListener('click', paintPaste);
    $('#pdSave').addEventListener('click', function(){
      var arr = cur.map(function(p){
        var si = $('input[data-p="'+p.n+'"][data-k="s"]', sh);
        var ei = $('input[data-p="'+p.n+'"][data-k="e"]', sh);
        return {n:p.n, s:(si&&si.value)?toMin(si.value):null, e:(ei&&ei.value)?toMin(ei.value):null};
      });
      S.settings.periods = arr; save(); render(); closeSheet();
      toast(T('作息已保存','Period times saved'), true);
    });
    $('#pdReset').addEventListener('click', function(){
      S.settings.periods = null; save(); render(); closeSheet(); openPeriods();
    });
  }

  /* ---- 按学校自动填 ---- */
  function paintSchool(){
    sh.innerHTML = hdr(isEN()?'Fill by school':'按学校自动填', '', '')+
      '<div class="sh-b">'+
      '<div class="hint">'+(isEN()
        ? 'Type part of the school name. Data comes from the schools\u2019 own timetables; campuses differ a lot, so check the campus shown on the right.'
        : '输入学校名或简称，点一下就填进表格。数据按各校教务处/校历整理，同一学校不同校区作息差很多，留意右边标的校区。')+'</div>'+
      '<input id="scQ" type="text" placeholder="'+(isEN()?'e.g. Shandong / HDU / sdu':'例如：山东 / 杭电 / sdu')+'" '+
        'style="margin-top:10px;width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--field);background:var(--field);color:var(--c);font:inherit;font-size:15px">'+
      '<div id="scList" style="margin-top:8px"></div>'+

        try{ window.open(url,'_blank'); }catch(e2){}

    function paintList(){
      var q = $('#scQ').value;

          ? 'Not in the list yet. Search it online, then paste what you find into “Paste times”.'
          : '列表里还没有这所学校。去网上搜一下，把搜到的作息表复制下来，用「粘贴作息」粘进去就行，识别一次就能用。')+'</div>'+tail;
        bindWeb();
        return;

      box.innerHTML = hit.map(function(x,i){
        var first = x.p[0], last = x.p[x.p.length-1];
        var p5 = x.p.filter(function(a){ return a[0]===5; })[0];

            (x.campus?'<span style="font-weight:400;opacity:.6;font-size:13px"> · '+x.campus+'</span>':'')+
            (x.season?'<span style="margin-left:6px;font-size:11px;font-weight:500;padding:1px 6px;border-radius:6px;border:1px solid var(--accent);color:var(--accent);vertical-align:middle">'+(isEN()?(x.season==='夏季'?'Summer':'Winter'):x.season)+'</span>':'')+'</div>'+
          '<div style="font-size:12px;opacity:.62;margin-top:3px">'+
            (isEN()?'Start '+first[1]+(p5?' · P5 '+p5[1]:'')+' · up to '+last[0]
                   :'第 1 节 '+first[1]+(p5?' · 第 5 节 '+p5[1]:'')+' · 最晚第 '+last[0]+' 节')+
            (x.year?' · '+x.year:'')+
          '</div></button>';
      }).join('');
      box.innerHTML += tail;
      bindWeb();
      [].forEach.call(box.querySelectorAll('[data-si]'), function(btn){

                  _nm+' applied — check then save'), true);
        });
      });
    }
    $('#scQ').addEventListener('input', paintList);
    paintList();
  }

      '<div class="sh-b">'+

        ? 'Fill a few numbers and the whole timetable is worked out. You can still adjust each period afterwards — long breaks between morning classes are common, so check 3 or 4.'
        : '填几个数就推出一整套节次，生成后还能逐节改。上午二、三节之间常有大课间，生成后看一眼那几节对不上就手动改。')+'</div>'+

      '<div class="hint" style="margin-top:10px;opacity:.7">'+(isEN()

/* 常见疑问的英文版，和 HELP 一一对应（顺序、分组数完全一致） */
var HELP_EN=[
['Install & compatibility',[
['Will it run on my phone?',

['Layout looks broken / bottom bar in the middle / course cards transparent',

['How do I add the home-screen widget?',

['Reminders do not ring / no notifications',

['Does it phone home? What permissions?',
 'One network request only: reading a small version file when you check for updates. No personal data, nothing uploaded.\nThree permissions: notifications (reminders), exact alarms (fire on time), storage (import timetables / export backups).\nNo contacts, no photos, no location. Everything stays on your phone.'],
['How do I move my data to a new phone?',

['Will updating erase my data?',

['It will not open / it crashes',

]],
['How focus works',[
['How is focus calculated?',
 'Each day starts at 100. Finishing something subtracts its cost; what is left is your focus.\nOnly items ticked today count — planned or unfinished ones cost nothing.'],
['What does “Planned −84” mean?',
 'The total cost of everything scheduled today, drawn as a marker on the focus bar.\nIt is separate from your real focus: it shows even if nothing is done, just to tell you how packed the day is. Over 100 turns red.'],
['How is one task’s cost worked out?',
 'cost = 4 + (minutes ÷ 30) × 3 + priority bonus\nPriority: low 0, medium 1, high 3, urgent 5\nMinimum 3, capped at 40.\n\nExamples:\n30 min · medium = 4+3+1 = 8\n1 h · high = 4+6+3 = 13\n1 h 30 · high = 4+9+3 = 16\n3 h · urgent = 4+18+5 = 27'],
['How is the completion rate worked out?',
 'rate = done ÷ scheduled for that day.\nThe denominator is recount from what the day actually asked: one for each daily task, one for each weekly/monthly task due that day, one for each dated task, one for each deadline task of the day.\nRepeating tasks still stay in the denominator after you tick them — otherwise finishing one would shrink the denominator and the number would lie.\nThe 7-day bars are those rates; 100% is the tallest.'],
['How are the six mood labels decided?',
 'By remaining focus:\n100 → Idle\n85–99 → Easy\n70–84 → Okay\n50–69 → Tiring\n30–49 → Tired\n0–29 → Wiped'],
['Why does the cat sometimes sit, sometimes lie down?',
 'Two rules only:\nfocus is 100 → lying asleep (not started)\nfocus below 45 → lying down (tired)\nEverything else sits.\n\nSo at “Tired” the cat still sits at 45–49 and only lies down at 44 or below. Pose and mood label are separate rules.'],
['What are the dot colours on the calendar?',

]],
['Tasks & repeats',[
['What is the difference between the three kinds?',
 'One-off: happens once. With a time it sits on the timeline, without one it stays in the list.\nRepeating: every day / chosen weekdays / chosen dates, one record covers all of them.\nDeadline: only an end date — it lists from today until then, finish any time before.'],
['When do repeating tasks come back after I finish them?',
 'Daily: ticked today, back tomorrow\nWeekly: ticked this week, back next Monday\nMonthly: ticked this month, back on the 1st\nNothing to recreate — the task never leaves.'],
['What does a weekly task with no weekday mean?',
 'Do it any day that week. It shows up every day until ticked.\n“Run 3 km a week” with no fixed day will remind you daily.'],
['What happens if I pick weekdays or dates?',
 'It only appears on those days. “Dance practice Thu 18:40” shows only on Thursdays and takes no room on other days.\nIf it has a time, it is also placed at that spot on the timeline.'],
['What is the coloured bar on the left of a card?',

['Do repeating tasks with a time count toward planned focus?',
 'Yes. They really take your time, so they count.\nWeekly/monthly tasks without a time do not — that means “do it sometime this week” and should not weigh on the bar.'],
['What are subtasks?',
 'A checklist attached to a task. They take no timeline space, cost no focus and are not counted on the Tasks page — you tick them in the task detail.\nHandy for things like “write the paper”: find sources, draft, format.'],
['Does the task finish automatically when every subtask is ticked?',
 'No. Subtasks are your own progress bar; you decide when the task itself is done — “submit” may still be waiting on someone else.'],
]],
['Ticking & records',[
['Why can I only tick on the Today page?',

['How do I backfill something I did yesterday?',

['How long are archived records kept?',

['Can I undo a delete?',
 'Yes. “Undo” appears at the bottom for 4 seconds.'],
]],
['Reminders',[
['A reminder did not fire or came late — what now?',
 'Settings → Reminders → Notification check. Work down this list; one step tells you where it is:\n\n1. Tap “Send a test notification”. Nothing appears → permission problem: tap the “Notification state” row at the top and fix it.\n\n2. Tap “Wake me in 30 seconds”, then lock the screen and wait.\n　Nothing → the system is restricting background work: go to step 3.\n　It fires but minutes late → look at the word after “Scheduled reminders”:\n　　“alarm-clock” and still late → phone power saving, go to step 3.\n　　“inexact” → open App info and allow “Alarms & reminders”.\n\n3. Notification check → App info: battery → Unrestricted, allow autostart.\n　· Xiaomi / Redmi: also allow “background pop-ups”\n　· Huawei: App launch → manage manually, allow all\n　· OPPO / vivo: power management → allow background running\n\n4. Lock Schedule in the recent-apps screen so it is not cleared.\n\n“Last reminder: on time” means the alarm fired exactly; “+N s” means the system delayed it.'],
['How early can it remind me?',

['Will it still fire if I swipe the app away?',
 'Yes. Reminders are registered with the system alarm and do not depend on the app running.\nBut “Force stop” from the long-press menu clears all alarms; they are registered again next time you open the app.'],
]],
['Data',[
['Where is my data stored?',

['What is auto backup?',

['How do I back up or switch phones?',
 '1. Old phone: Settings → Backup → Export backup, send it to yourself in WeChat “File Transfer”.\n2. Install Schedule on the new phone and pick a language.\n3. Settings → Backup → Restore from file, pick that file.\nTasks, notes, classes and settings all come back. Notification permission has to be granted again on the new phone.'],
['Will uninstalling lose my data?',

]],
['Class schedule',[
['How do classes get onto the timeline?',
 'Classes are not tasks, they are background. After import they are drawn on the day timeline alongside tasks:\nclass block — dashed border, pale fill, thin colour bar, cannot be ticked\ntask block — solid fill, priority bar, can be ticked\n\nClasses cost no focus, do not appear in Tasks and do not affect the completion rate.'],
['How do I import my schedule?',
 'Settings → Class schedule → Import → choose the Excel file.\n.xlsx / .xls / .csv are supported; both grid timetables (weekdays across the top, periods down the side) and class-detail sheets (one row per class) work. When the file has several sheets, the one that yields classes is picked automatically.\n\nIf the file carries its own period times or term start date, you are asked whether to apply them.\nYou will see a preview before importing; rows it cannot read are listed, never silently dropped.'],
['The timetable will not import - what do I do?',
 'First check the file itself: the student timetable exported from most school systems is fine - both the grid layout (weekdays across the top, periods down the side) and the one-row-per-class layout. A cell that mixes name, weeks, room and teacher, a cell holding several classes, even text that got pushed onto the next row, all get stitched back together.\n\nIf not a single class is read, an extra block appears at the bottom of the import screen.\n(1) Tap "Copy this text".\n(2) Send it together with your timetable - file or screenshot - to any AI chat: Doubao, Yuanbao, DeepSeek.\n(3) Paste the result into the box and tap "Parse & preview".\n\nYou never have to edit the spreadsheet. "Paste it instead" still works too - one class per line: name|weekday|period|weeks|room|teacher.'],
['Is the home widget timetable the same as in the app?',

['Why are class names only two or three characters on the widget?',
 'Each cell is barely three characters wide — a full name would smear into a block. So names are cut to 2–3 characters: common courses have fixed short forms (Advanced Mathematics → 高数, Physical Chemistry → 物化), others first drop filler such as College / Advanced / Introduction / Principles, then keep the first three characters.\\nSimilar courses keep whatever tells them apart (Materials Science Fundamentals → 材基, Materials Physics → 材物). If you still cannot tell, tap the widget to open the app and read the full name.'],
['What is “First week start” for?',

['How do I change period times?',
 'Settings → Class schedule → Period times. Defaults follow Guangxi University (period 1 at 8:00, evening starts at period 11).\nReplace with your school’s; leave a field empty to skip that period.'],
['How do I handle a moved class?',

]],
['Timeline',[
['Why are some cards wide and some narrow?',
 'By how many things share the slot: one fills the row, two split it, three split into thirds. Anything that does not overlap always fills.'],
['What is the time at the top and bottom edge of a card?',
 'The start and end of that item, aligned with the hour marks on the left. Length follows real duration, not spread evenly.'],
['How do I view or edit an item?',
 'Tap a card → details (time, duration, priority, focus cost, note). To change it, tap Edit in the details.\nTapping a class block shows class details, where you can skip or move it.'],
['Can I drag them?',

]],
['Interface',[

['Can group headers collapse?',
 'Yes. Tap to fold, tap again to unfold; the state is remembered across the three pages.'],

]],

function openHelp(){
  var listHTML='';
  var SRC=(typeof HELP_EN!=='undefined'&&isEN())?HELP_EN:HELP;
  SRC.forEach(function(sec){
    listHTML+='<div class="faqsec"><div class="faqh">'+sec[0]+'</div>';
    sec[1].forEach(function(qa){
      listHTML+='<div class="faqitem"><div class="faqq">'+qa[0]+'</div><div class="faqa">'+qa[1]+'</div></div>';
    });
    listHTML+='</div>';
  });
  var sh=openSheet(
    '<div class="sh-h"><button class="tb" id="hClose">'+UIx('close')+'</button><div class="t">'+UIx('helpTitle')+'</div><span class="tb r"></span></div>'+
    '<div class="sh-b" id="hBody" style="padding-bottom:calc(84px + var(--sb));position:relative">'+
      '<div class="hsearch"><input id="hQ" type="search" placeholder="'+UIx('helpPh')+'" autocomplete="off"></div>'+
      '<div id="hList">'+listHTML+'</div>'+
      '<div class="hint" id="hNone" style="text-align:center;padding:26px 0" hidden>'+UIx('helpNone')+'</div>'+
    '</div>'+
    '<button class="hTop" id="hTop" hidden aria-label="回到顶部" data-i18n-aria="回到顶部">↑</button>');
  $('#hClose',sh).addEventListener('click',closeSheet);
  var body=$('#hBody',sh), q=$('#hQ',sh), topBtn=$('#hTop',sh), none=$('#hNone',sh);
  q.addEventListener('input',function(){
    var v=this.value.trim().toLowerCase(), any=false;
    $$('.faqitem',sh).forEach(function(it){
      var hit=!v||it.textContent.toLowerCase().indexOf(v)>=0;
      it.hidden=!hit; if(hit) any=true;
    });
    $$('.faqsec',sh).forEach(function(sec){
      var vis=false;
      $$('.faqitem',sec).forEach(function(x){ if(!x.hidden) vis=true; });
      sec.hidden=!vis;
    });
    none.hidden=any;
    if(v){
      requestAnimationFrame(function(){
        var first=null;
        $$('.faqitem',sh).forEach(function(it){ if(!first&&!it.hidden) first=it; });
        if(!first) return;
        var y=0, n=first;
        while(n&&n!==body){ y+=n.offsetTop; n=n.offsetParent; }
        var hsEl=sh.querySelector('.hsearch');
        var off=hsEl?hsEl.offsetHeight:0;
        if(n===body) body.scrollTop=Math.max(0,y-off-2);
      });
    } else {
      body.scrollTop=0;
    }
  });
  body.addEventListener('scroll',function(){ topBtn.hidden=body.scrollTop<40; });
  topBtn.addEventListener('click',function(){ body.scrollTo({top:0,behavior:'smooth'}); });
}

/* ---------- 精力超载提示 ---------- */
function overloadInfo(){
  var plan=planEnergy();
  if(plan<=100) return null;
  var arr=todayTasks().filter(function(t){ return !t.done && !isDueTask(t); })
    .map(function(t){ return {t:t,c:energyCost(t)}; })
    .filter(function(x){ return x.c>0; })
    .sort(function(a,b){                              // 先挑不重要的：优先级低的先挪，同样不重要时挑消耗大的
      return (a.t.pri-b.t.pri)||(b.c-a.c);
    });
  var need=plan-100, pick=[], sum=0;
  for(var i=0;i<arr.length && sum<need;i++){ pick.push(arr[i]); sum+=arr[i].c; }
  return {plan:plan, over:need, pick:pick.slice(0,3)};
}
function renderOverload(){
  var box=$('#tdOver'); if(!box) return;
  var info=overloadInfo();
  if(!info){ box.hidden=true; box.innerHTML=''; return; }
  var list=info.pick.map(function(x){
    return '<button class="ovname" data-id="'+x.t.id+'">'+esc(x.t.title||UIx('unnamed'))+'</button>'+UIx('overUnit',{c:x.c});
  }).join('、');
  box.innerHTML='<div>'+UIx('overTitle',{n:info.plan,x:info.over})+'</div>'+
    (list?'<div class="tip">'+UIx('overTip',{list:list})+'</div>':'');
  box.hidden=false;
  $$('.ovname',box).forEach(function(b){
    b.addEventListener('click',function(e){ e.stopPropagation(); openOverMove(byId(b.dataset.id)); });
  });
}
/* 超载提示里点任务名：直接给几个挪法 */
function openOverMove(t){
  if(!t) return;
  var today=todayISO();
  var sh=openSheet(
    '<div class="sh-h"><button class="tb" id="omClose">'+UIx('close')+'</button><div class="t">'+UIx('ovMoveTitle')+'</div><span class="tb r"></span></div>'+
    '<div class="sh-b">'+
      '<div class="card" style="padding:14px">'+
        '<div style="font-size:15px;font-weight:700;margin-bottom:4px">'+priTag(t)+esc(t.title||UIx('unnamed'))+'</div>'+
        '<div class="hint" style="padding:0">'+UIx('overUnit',{c:energyCost(t)})+'</div>'+
      '</div>'+
      '<div class="card" style="margin-top:12px">'+
        (t.period
          ? '<div class="row"><span class="lbl">'+UIx('ovSkipToday')+'</span><button class="tb r" id="omSkip">'+UIx('ovSkipToday')+'</button></div>'
          : '<div class="row"><span class="lbl">'+UIx('ovTomorrow')+'</span><button class="tb r" id="omT1">'+UIx('ovTomorrow')+'</button></div>'+
            '<div class="row"><span class="lbl">'+UIx('ovDayAfter')+'</span><button class="tb r" id="omT2">'+UIx('ovDayAfter')+'</button></div>'+
            '<div class="row"><span class="lbl">'+UIx('ovOut')+'</span><button class="tb r" id="omOut">'+UIx('ovOut')+'</button></div>')+
        '<div class="row"><span class="lbl">'+UIx('ovOpen')+'</span><button class="tb r" id="omOpen">'+UIx('tiEditBtn')+'</button></div>'+
      '</div>'+
    '</div>');
  $('#omClose',sh).addEventListener('click',closeSheet);
  function done(msg){ save(); render(); closeSheet(); toast(msg); }
  var t1=$('#omT1',sh); if(t1) t1.addEventListener('click',function(){
    snapshot(); t.date=addDays(today,1); done(UIx('ovMoved',{d:dateLabel(t.date)}));
  });
  var t2=$('#omT2',sh); if(t2) t2.addEventListener('click',function(){
    snapshot(); t.date=addDays(today,2); done(UIx('ovMoved',{d:dateLabel(t.date)}));
  });
  var t3=$('#omOut',sh); if(t3) t3.addEventListener('click',function(){
    snapshot(); t.date=null; t.start=null; t.done=false; t.doneAt=null; done(UIx('ovDone'));
  });
  var sk=$('#omSkip',sh); if(sk) sk.addEventListener('click',function(){
    snapshot(); if(!t.skip) t.skip={}; t.skip[today]=1; done(UIx('ovDone'));
  });
  var op=$('#omOpen',sh); if(op) op.addEventListener('click',function(){
    closeSheet(); openTaskInfo(t,function(){ setTimeout(function(){ if(typeof openStats==='function'){} },0); });
  });
}
/* 用一段备份文本覆盖当前数据 */
function applyBackupData(txt){
  try{
    var d=JSON.parse(txt);
    if(!d||!Array.isArray(d.tasks)) throw 0;

function autoFillPool(){
  return todayTasks().filter(function(t){
    if(t.start!=null||t.done) return false;
    if(t.afBatch) return false;                    // 已经排过的不重复排
    return true;
  });
}
function afBusy(iso){
  var arr=[];
  onDay(iso).forEach(function(x){ if(x.start!=null) arr.push([x.start,x.start+(x.dur||30)]); });
  try{ coursesOn(iso).forEach(function(c){ arr.push([c.start,c.end]); }); }catch(e){}
  arr.sort(function(a,b){ return a[0]-b[0]; });
  return arr;
}
var AF_GAP=10;                      // 两件事之间至少留 10 分钟，别让人喘不过气
function afFind(busy,dur,from,to){
  var s=from, guard=0;
  while(guard++<300){
    var clash=null;
    for(var i=0;i<busy.length;i++){
      if(s < busy[i][1]+AF_GAP && busy[i][0] < s+dur+AF_GAP){ clash=busy[i]; break; }
    }
    if(!clash) return (s+dur<=to)?s:-1;
    s=clash[1]+AF_GAP;
    if(s+dur>to) return -1;
  }
  return -1;
}
function afCanDay(t,iso){
  var today=todayISO();
  if(isDueTask(t)&&t.due&&iso>t.due) return false;
  if(t.period==='day') return iso===today;
  var wd=(fromISO(iso).getDay()+6)%7, dt=fromISO(iso).getDate();
  if(t.period==='week'){
    var pd=t.periodDays||[];
    if(pd.length&&pd.indexOf(wd)<0) return false;
    var mon=addDays(today,-((fromISO(today).getDay()+6)%7));
    return iso<=addDays(mon,6);
  }
  if(t.period==='month'){
    var pd2=t.periodDays||[];
    if(pd2.length&&pd2.indexOf(dt)<0) return false;
    return iso.slice(0,7)===today.slice(0,7);
  }
  return true;
}
function autoPlanRun(){
  var batch='af'+Date.now(), today=todayISO();
  var pool=autoFillPool();
  pool.sort(function(a,b){ return (b.pri-a.pri)||((b.dur||0)-(a.dur||0)); });
  var busyCache={}, placed=[], failed=[];
  for(var ti=0; ti<pool.length; ti++){
    var t=pool[ti], dur=Math.max(10,t.dur||30), ok=false;
    for(var off=0; off<=7 && !ok; off++){
      var iso=addDays(today,off);
      if(!afCanDay(t,iso)) continue;
      var from=(iso===today)?Math.max(dayMin(),nowMin()+5):dayMin();
      if(from+dur>dayMax()) continue;
      if(!busyCache[iso]) busyCache[iso]=afBusy(iso);
      var s=afFind(busyCache[iso],dur,from,dayMax());
      if(s<0) continue;
      if(t.period){
        if(!t.ovr) t.ovr={};
        t.ovr[iso]={start:s,dur:dur};
      }else{
        t.afOrig={date:t.date||null,start:(typeof t.start==='number')?t.start:null};
        t.date=iso; t.start=s;
      }
      t.afBatch=batch; t.afDate=iso;
      busyCache[iso].push([s,s+dur]); busyCache[iso].sort(function(a,b){ return a[0]-b[0]; });
      placed.push({t:t,iso:iso,start:s,dur:dur});
      ok=true;
    }
    if(!ok) failed.push(t);
  }
  return {placed:placed,failed:failed};
}
function afUndoOne(t){
  if(!t) return;
  if(t.period){
    if(t.ovr&&t.afDate) delete t.ovr[t.afDate];
  }else if(t.afOrig){
    t.date=t.afOrig.date; t.start=t.afOrig.start;
  }
  delete t.afBatch; delete t.afDate; delete t.afOrig;
}
function afUndoAll(){
  (S.tasks||[]).forEach(function(t){ if(t.afBatch) afUndoOne(t); });

function afPlacedList(){

    if(!t.afBatch) return;
    var iso=t.afDate, ov=t.ovr&&t.ovr[iso];
    var st=(ov&&typeof ov.start==='number')?ov.start:t.start;
    if(typeof st!=='number') return;
    out.push({t:t,iso:iso,start:st,dur:(ov&&ov.dur)||t.dur||30});
  });
  out.sort(function(a,b){ return a.iso===b.iso ? (a.start-b.start) : (a.iso<b.iso?-1:1); });
  return out;
}

  /* ---------- 导出 .ics 到系统日历（iPhone 上唯一能"到点响"的办法） ---------- */
  function _p2(n){ return String(n).padStart(2,'0'); }
  function _icsEsc(v){
    return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/;/g,'\\;')
      .replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  }
  function _icsDt(d){
    return d.getFullYear()+_p2(d.getMonth()+1)+_p2(d.getDate())+'T'+_p2(d.getHours())+_p2(d.getMinutes())+'00';
  }
  function _icsStampUtc(d){
    return d.getUTCFullYear()+_p2(d.getUTCMonth()+1)+_p2(d.getUTCDate())+'T'+
      _p2(d.getUTCHours())+_p2(d.getUTCMinutes())+_p2(d.getUTCSeconds())+'Z';
  }
  /* ICS 规范要求每行不超过 75 字节，超了要折行（续行以空格开头），按 UTF-8 字节算 */
  function _icsFold(line){
    var out='', cur='', bytes=0;
    for(var i=0;i<line.length;i++){
      var ch=line.charAt(i), b=2; // 保守按 2 字节估 ASCII 之外
      try{ b=new TextEncoder().encode(ch).length; }catch(e){ b=1; }
      if(bytes+b>73){ out+=cur+'\r\n '; cur=''; bytes=0; }
      cur+=ch; bytes+=b;
    }
    return out+cur;
  }
  function _icsEvent(o){
    var L=['BEGIN:VEVENT','UID:'+o.uid,'DTSTAMP:'+_icsStampUtc(new Date())];
    L.push('DTSTART:'+o.start);
    if(o.end) L.push('DTEND:'+o.end);
    L.push('SUMMARY:'+_icsEsc(o.summary));
    if(o.desc) L.push('DESCRIPTION:'+_icsEsc(o.desc));
    if(o.rrule) L.push('RRULE:'+o.rrule);
    (o.alarms||[]).forEach(function(m){
      L.push('BEGIN:VALARM');
      L.push('TRIGGER:'+(m>0?('-PT'+m+'M'):'PT0S'));
      L.push('ACTION:DISPLAY');
      L.push('DESCRIPTION:'+_icsEsc(o.summary));
      L.push('END:VALARM');
    });
    L.push('END:VEVENT');
    return L;
  }
  function _startAt(dateStr, minutes){
    var d=fromISO(dateStr);
    d.setMinutes(d.getMinutes()+(minutes||0));
    return d;
  }
  function _nextMatchDate(t, today){
    for(var i=0;i<14;i++){
      var iso=addDays(today,i);
      var wd=(fromISO(iso).getDay()+6)%7;
      if(t.period==='week'){
        if((t.periodDays||[]).indexOf(wd)>=0) return iso;
        continue;
      }
      return iso; // 每天 / 每月 / dailyDays 都从今天起
    }
    return today;
  }
  function buildICS(){
    var WDE=['MO','TU','WE','TH','FR','SA','SU'];
    var today=todayISO();
    var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Schedule//NONSGML v1//CN',
           'CALSCALE:GREGORIAN','METHOD:PUBLISH',
           'X-WR-CALNAME:'+_icsEsc(isEN()?'Schedule':'日程')];
    var n=0;

    function descOf(t){
      var p=[];
      if(t.note) p.push(t.note);
      (t.subs||[]).forEach(function(x){ if(x&&x.title) p.push((x.done?'[x] ':'[ ] ')+x.title); });
      return p.join('\n');
    }

    (S.tasks||[]).forEach(function(t){
      if(n>=400) return;
      if(!t||!t.title||t.done||t.start==null) return;

      var rr=null, base=null;

      if(t.period||t.dailyDays){
        // 周期任务
        if(t.period==='week' && (t.periodDays||[]).length){
          rr='FREQ=WEEKLY;BYDAY='+t.periodDays.slice().sort(function(a,b){return a-b;})
              .map(function(i){ return WDE[i]||'MO'; }).join(',');
        }else if(t.period==='month'){
          rr='FREQ=MONTHLY';
        }else{
          rr='FREQ=DAILY';
        }
        base=_nextMatchDate(t,today);
      }else{
        // 一次性任务：只要今天及以后的
        if(String(t.date||'')<today) return;
        base=t.date;
      }
      if(!base) return;

      var s0=_startAt(base,t.start), e0=new Date(s0.getTime()+(t.dur||60)*60000);
      L=L.concat(_icsEvent({
        uid:(t.id||('t'+n))+'@schedule', start:_icsDt(s0), end:_icsDt(e0),
        summary:t.title, desc:descOf(t), rrule:rr, alarms:remindsOf(t)
      }));
      n++;
    });

    // 老的 series 模型（如果有残留）
    (S.series||[]).forEach(function(sr){
      if(n>=400) return;
      if(!sr||!sr.title||sr.start==null) return;
      var rr = (sr.kind==='week' && (sr.days||[]).length)
        ? 'FREQ=WEEKLY;BYDAY='+sr.days.slice().sort(function(a,b){return a-b;})
            .map(function(i){ return WDE[i]||'MO'; }).join(',')
        : 'FREQ=DAILY';
      var base=sr.from&&sr.from>today?sr.from:today;
      var s0=_startAt(base,sr.start), e0=new Date(s0.getTime()+(sr.dur||60)*60000);
      L=L.concat(_icsEvent({
        uid:(sr.id||('s'+n))+'@schedule', start:_icsDt(s0), end:_icsDt(e0),
        summary:sr.title, desc:sr.note||'', rrule:rr, alarms:[]
      }));
      n++;
    });

    L.push('END:VCALENDAR');
    return L.map(_icsFold).join('\r\n')+'\r\n';
  }

  var icsBtn=$('#sExpICS',sh);
  if(icsBtn) icsBtn.addEventListener('click',function(){
    try{
      var txt=buildICS();
      if(txt.indexOf('BEGIN:VEVENT')<0){
        toast(T('当前没有可导出的任务','Nothing to export right now'));
        return;
      }
      var blob=new Blob([txt],{type:'text/calendar;charset=utf-8'});
      var url=URL.createObjectURL(blob), aEl=document.createElement('a');
