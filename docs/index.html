var SKEY='planly.sync', syncTimer=0;
var sync={code:null,version:0,last:0,busy:false,state:'off',err:''};

function loadSync(){
  try{
    var r=JSON.parse(localStorage.getItem(SKEY)||'null');
    if(r&&r.code){ sync.code=r.code; sync.version=r.version||0; sync.last=r.last||0; sync.state='idle'; }
  }catch(e){}
}
function saveSyncState(){
  try{ localStorage.setItem(SKEY,JSON.stringify({code:sync.code,version:sync.version,last:sync.last})); }catch(e){}
}
function genCode(){
  var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out='', i, a=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a);
  else for(i=0;i<16;i++) a[i]=Math.floor(Math.random()*256);
  for(i=0;i<16;i++){ out+=A.charAt(a[i]%A.length); if(i%4===3&&i<15) out+='-'; }
  return out;
}
function apiURL(){ return new URL('api/sync',location.href).toString(); }
function localDoc(){
  return {tasks:S.tasks,folders:S.folders,notes:S.notes,series:S.series,del:S.del,settings:S.settings,settingsUpd:S.settingsUpd};
}
function mergeDel(a,b){
  var o={},k,edge=Date.now()-30*864e5;
  [a||{},b||{}].forEach(function(m){ for(k in m) if(!o[k]||m[k]>o[k]) o[k]=m[k]; });
  for(k in o) if(o[k]<edge) delete o[k];
  return o;
}
function mergeArr(local,remote,del){
  var by={},out=[],i;
  (local||[]).forEach(function(x){ by[x.id]=x; });
  (remote||[]).forEach(function(r){
    if(!r||!r.id) return;
    var l=by[r.id];
    if(!l||(r.upd||0)>(l.upd||0)) by[r.id]=r;
  });
  Object.keys(by).forEach(function(id){
    var x=by[id];
    if((del[id]||0)>(x.upd||0)) return;   // удалено позже, чем правилось
    out.push(x);
  });
  return out;
}
function applyRemote(remote){
  if(!remote) return false;
  var beforeT=JSON.stringify(S.tasks), beforeF=JSON.stringify(S.folders), themed=false;
  applyingRemote=true;
  S.del=mergeDel(S.del,remote.del);
  S.tasks=mergeArr(S.tasks,(remote.tasks||[]).map(normalize),S.del);
  S.folders=mergeArr(S.folders,remote.folders||[],S.del); normFolders();
  var beforeN=JSON.stringify(S.notes);
  S.notes=mergeArr(S.notes,(remote.notes||[]).map(normalizeNote),S.del);
  var beforeR=JSON.stringify(S.series);
  S.series=mergeArr(S.series,(remote.series||[]).map(normalizeSeries),S.del);
  if((remote.settingsUpd||0)>(S.settingsUpd||0)){
    S.settings=Object.assign({},DEF,remote.settings||{});
    S.settingsUpd=remote.settingsUpd; themed=true;
  }
  save(); buildShadow(); applyingRemote=false;
  var changed=(JSON.stringify(S.tasks)!==beforeT)||(JSON.stringify(S.folders)!==beforeF)||(JSON.stringify(S.notes)!==beforeN)||(JSON.stringify(S.series)!==beforeR)||themed;
  if(ensureOccurrences()) changed=true;
  if(changed){ if(themed) applyTheme(); render(); }
  return changed;
}
/* устойчивая подпись документа: сравниваем содержимое, а не порядок ключей */
function stableStr(o){
  if(o===null||typeof o!=='object') return JSON.stringify(o);
  if(Array.isArray(o)) return '['+o.map(stableStr).join(',')+']';
  return '{'+Object.keys(o).sort().map(function(k){ return JSON.stringify(k)+':'+stableStr(o[k]); }).join(',')+'}';
}
function docSig(d){
  if(!d) return '';
  var byId=function(a,b){ return a.id<b.id?-1:(a.id>b.id?1:0); };
  return stableStr({
    tasks:(d.tasks||[]).slice().sort(byId),
    folders:(d.folders||[]).slice().sort(byId),
    notes:(d.notes||[]).slice().sort(byId),
    series:(d.series||[]).slice().sort(byId),
    del:d.del||{}, settings:d.settings||{}, settingsUpd:d.settingsUpd||0
  });
}
/* 联网总开关：2.0.01 起暂时关闭。同步和检查更新指向的都是 App 内部的假地址
   （https://app.local/...），本来就连不上，关掉是为了不再产生失败请求。
   等开源、仓库和 version.json 就位后，改成 true 并接上真实地址即可。 */
var NET_ON=false;
function pushDoc(base,isRetry){
  if(!NET_ON) return;
  return fetch(apiURL()+'?code='+encodeURIComponent(sync.code),{
    method:'PUT', cache:'no-store',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({base:base,doc:localDoc()})
  }).then(function(r){
    return r.json().catch(function(){return {};}).then(function(res){
      if(r.status===409){
        if(isRetry) throw new Error(tr('конфликт версий'));
        applyRemote(res.doc);
        return pushDoc(res.version||0,true);
      }
      if(r.status===403) throw new Error(tr('код не разрешён на сервере'));
      if(!r.ok) throw new Error('HTTP '+r.status);
      sync.version=res.version||0;
      return res;
    });
  });
}
function syncNow(manual){
  if(!NET_ON) return;
  if(!sync.code||sync.busy) return;
  sync.busy=true; sync.state='sync'; sync.err=''; refreshSyncUI();
  fetch(apiURL()+'?code='+encodeURIComponent(sync.code),{cache:'no-store'})
    .then(function(r){
      if(r.status===403) throw new Error(tr('код не разрешён на сервере'));
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(res){
      applyRemote(res.doc);
      // если после слияния наш документ совпал с серверным — записывать нечего
      if(res.doc && docSig(localDoc())===docSig(res.doc)){ sync.version=res.version||0; return null; }
      return pushDoc(res.version||0);
    })
    .then(function(){ sync.state='ok'; sync.last=Date.now(); saveSyncState(); })
    .catch(function(e){ sync.state='err'; sync.err=(e&&e.message)||tr('нет связи'); })
    .then(function(){
      sync.busy=false; refreshSyncUI();
      if(manual) toast(sync.state==='ok'?tr('Синхронизировано'):tr('Не удалось:')+' '+sync.err);
    });
}
function scheduleSync(){
  if(!sync.code) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){ syncNow(false); },4000);
}
function syncOn(code){
  sync.code=code; sync.version=0; sync.last=0; sync.state='idle';
  saveSyncState(); syncNow(true);
}
function syncOff(){
  sync.code=null; sync.version=0; sync.last=0; sync.state='off';
  try{ localStorage.removeItem(SKEY); }catch(e){}
  refreshSyncUI();
}
function ago(ms){
  if(!ms) return tr('ещё не было');
  var d=Math.round((Date.now()-ms)/1000);
  if(d<60) return tr('только что');
  var v;
  if(d<3600){ v=Math.round(d/60); return tr('{n} назад',{n:v+' '+plur(v,"минуту","минуты","минут")}); }
  if(d<86400){ v=Math.round(d/3600); return tr('{n} назад',{n:v+' '+plur(v,"час","часа","часов")}); }
  v=Math.round(d/86400); return tr('{n} назад',{n:v+' '+plur(v,"день","дня","дней")});
}
function syncStateText(){
  if(!sync.code) return tr('выключена');
  if(sync.state==='sync') return tr('обмен…');

}

/* ---------- 检查更新（走原生请求，不受 NET_ON 影响） ---------- */
var UPD_AT='planly.updAt', UPD_SHOWN='planly.updShown', UPD_FAIL='planly.updFail', UPD_APKVER='planly.apkVer';
var UPD_GAP=2*3600*1000;      /* 查到之后隔多久再查：2 小时（原来是 24 小时，太久容易错过发版） */
var UPD_FAIL_GAP=20*60*1000;  /* 没查通就 20 分钟后再试，别因为一次网络抖动停一整天 */
var updBusy=false, updLatest=null, updQuiet=false;

function updAt(){ try{ return +(localStorage.getItem(UPD_AT)||0); }catch(e){ return 0; } }
function updShownVer(){ try{ return localStorage.getItem(UPD_SHOWN)||''; }catch(e){ return ''; } }
function updMark(){ try{ localStorage.setItem(UPD_AT, String(Date.now())); localStorage.removeItem(UPD_FAIL); }catch(e){} }
function updFailMark(){ try{ localStorage.setItem(UPD_FAIL, String(Date.now())); }catch(e){} }
function updFailAt(){ try{ return +(localStorage.getItem(UPD_FAIL)||0); }catch(e){ return 0; } }
function updNeed(){
  var now=Date.now(), okAt=updAt(), fa=updFailAt();
  /* 成功查过且还在 2 小时窗口内：除非之后又查失败了，否则不重复请求。
     注意 fa 为 0 表示「没有失败记录」，不能直接拿 now-fa 去比——
     now-0 永远是巨大值，那样写会恒为真，节流等于没有。 */
  if(okAt>0 && now-okAt<UPD_GAP) return fa>0 && now-fa>=UPD_FAIL_GAP;
  if(fa>0 && now-fa<UPD_FAIL_GAP) return false;
  return true;
}
/* 自动检查：启动、回到前台、以及每 2 小时各看一眼，靠 updNeed() 控制真正的请求频率 */

/* 把版本清单里的下载地址排成"挨个试"的线路表。
   GitHub 直链在国内经常连不上，所以同一份文件再套一层加速镜像做备份。 */
function updUrls(info){
  var a=[], seen={};
  function push(u){
    if(!u) return;
    u=String(u).trim();
    if(u.indexOf('http')!==0) return;
    if(seen[u]) return;
    seen[u]=1; a.push(u);
  }
  var base=[];
  if(info&&info.url) base.push(info.url);
  if(info&&info.mirrors&&info.mirrors.length){ for(var i=0;i<info.mirrors.length;i++) base.push(info.mirrors[i]); }
  for(var j=0;j<base.length;j++){
    push(base[j]);
    var u=String(base[j]);
    if(u.indexOf('https://github.com/')===0){
      push('https://gh-proxy.com/'+u);
      push('https://ghproxy.net/'+u);
    }
  }
  return a;
}

function updCheck(silent){
  var b=nativeApp();
  if(!b||!b.checkUpdate){
    if(!silent) toast(T('浏览器里不支持检查更新','Update check works in the app only'));
    return;
  }
  if(updBusy) return;
  updBusy=true; updQuiet=!!silent;
  if(!silent) toast(T('正在检查…','Checking…'));
  /* 兜底：万一原生一直不回调（网络卡死/页面被回收），30 秒后把锁放开，
     不然 updBusy 一直为真，之后就再也检查不了更新 */
  var _t=setTimeout(function(){ updBusy=false; },30000);
  window.__updUnlock=function(){ clearTimeout(_t); };
  try{ b.checkUpdate(); }catch(e){ clearTimeout(_t); updBusy=false; }
}

/* 原生回调统一走这里（定义在全局，Java 先回调也不会丢） */
window.__onUpdate=function(raw){
  try{
    if(!updBusy&&!raw) return;
    updBusy=false;
    if(window.__updUnlock) window.__updUnlock();
    var info=null;
    try{ info=raw?JSON.parse(raw):null; }catch(e){ info=null; }
    if(!info||!info.code){
      updFailMark();
      if(!updQuiet) toast(T('检查失败，网络不通或版本文件读不到','Check failed — network or version file unavailable'));
      return;
    }
    updMark();
    if(+info.code>VCODE){
      updLatest=info;
      updPaint();
      if(!updQuiet) openUpdSheet(info);
      if(updQuiet&&updShownVer()!==String(info.version)){
        try{ localStorage.setItem(UPD_SHOWN,String(info.version)); }catch(e){}
        updBarShow(info);
      }
    } else {
      updLatest=null;
      updPaint();
      if(!updQuiet) toast(T('已是最新版本','You are on the latest version'));
    }
  }catch(e){}
};

function tlTopGet(){ var m=S.settings.tlTop; return (m&&typeof m[S.date]==='number')?Math.max(0,m[S.date]):0; }
function tlTopSet(v){ if(!S.settings.tlTop) S.settings.tlTop={}; S.settings.tlTop[S.date]=Math.max(0,Math.round(v)); }

/* 切回日程页时，如果整屏看不到任何任务块，自动滚到第一个任务
   —— 之前切 tab 后 scrollTop 会被重置到 7:00，任务在下面，看着像"没了" */
function ensureVisibleTasks(tries){
  tries=tries||0;
  var wrap=$('#tlwrap');
  if(!wrap||wrap.hidden) return;
  if((S.settings.mode||'scale')!=='scale') return;
  var blocks=wrap.querySelectorAll('.block');
  if(!blocks.length) return;
  var top=wrap.scrollTop, h=wrap.clientHeight||wrap.offsetHeight;
  if(!h){                                            // 刚切回来还没布局完，等一会儿再看
    if(tries<8) setTimeout(function(){ ensureVisibleTasks(tries+1); },60);
    return;
  }
  for(var i=0;i<blocks.length;i++){
    var y=blocks[i].offsetTop, bh=blocks[i].offsetHeight;
    if(y+bh>=top+6 && y<=top+h-6) return;              // 已经有块露出来了
  }
  focusDay();
}

      : '界面显示有点怪？你的手机内核偏旧，去应用商店更新「Android System WebView」就能解决')+
      '</span><button id="cbOk">'+(isEN()?'Got it':'知道了')+'</button>';
    var view=app.querySelector('.view');
    app.insertBefore(d, view||app.firstChild);
    var ok=d.querySelector('#cbOk');
    if(ok) ok.addEventListener('click', function(){
      try{ localStorage.setItem('planly.compatOk', String(Date.now())); }catch(e){}
      d.remove();
    });
  }catch(e){}
})();
checkReminders();
setInterval(checkReminders,30000);
setMode(S.settings.mode);
if(sync.code) syncNow(false);
setInterval(function(){ if(sync.code&&!document.hidden) syncNow(false); },120000);
document.addEventListener('visibilitychange',function(){
  if(document.hidden) return;
  if(sync.code) syncNow(false);
  checkReminders();
  onAppFocus();
});
setTimeout(checkUpdate,3000);
setInterval(checkUpdate,1800000);
window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener&&
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
})();
</script>

<script>
/* ---------- PWA：注册离线缓存 ---------- */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* ---------- iOS：引导「添加到主屏幕」 ----------
 * 目的不只是图标好看：iPhone 上 Safari 标签页的数据，
 * 连续 7 天没打开会被系统当成"没用过的网站"清掉。
 * 只有添加到主屏幕，数据才长期保留。
 */
(function(){
  var ua=navigator.userAgent||'';
  var isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!isIOS) return;
  var standalone=window.navigator.standalone===true||
    (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  if(standalone) return;

  var isWeChat=/MicroMessenger/i.test(ua);
  var isOtherApp=/QQ\/|Weibo|AlipayClient|DingTalk/i.test(ua);
  var KEY='schedule.iosTipAt';
  try{
    var last=+(localStorage.getItem(KEY)||0);
    if(last && Date.now()-last < 5*864e5) return;   // 点过「稍后」就 5 天内不再烦
  }catch(e){}

  function build(){
    if(document.getElementById('iosTip')) return;
    var wrap=document.createElement('div');
    wrap.id='iosTip';
    wrap.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9998;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));'+
      'font:15px/1.55 -apple-system,BlinkMacSystemFont,system-ui,"PingFang SC",sans-serif;'+
      'animation:iostip-in .32s cubic-bezier(.2,.8,.3,1)';

    var card=document.createElement('div');
    card.style.cssText='background:#FDFBF6;color:#2B2620;border-radius:18px;padding:16px 18px 14px;'+
      'box-shadow:0 18px 44px -20px rgba(60,50,35,.55),0 0 0 1px rgba(120,106,80,.14)';

    var title = isWeChat ? '先在浏览器里打开'
              : isOtherApp ? '先在 Safari 里打开'
              : '装到主屏幕上用';
    var body, step;

    if(isWeChat||isOtherApp){
      body='这里是应用内的浏览器，不能添加到主屏幕。点右上角「···」，选「在浏览器打开」，就能正常用。';
      step='右上角 ··· → 在浏览器打开';
    }else{
      body='这样图标会出现在主屏幕，打开就是全屏，不用每次找网址。更重要的是：<b>数据会一直留着</b>——只在 Safari 标签页里用的话，7 天不开会被系统清空。';
      step='点底部分享 → 添加到主屏幕';
    }

    card.innerHTML='<div style="font-weight:600;font-size:16px;margin-bottom:6px">'+title+'</div>'+
      '<div style="font-size:13.5px;line-height:1.6;color:#6C6357">'+body+'</div>'+
      '<div style="margin-top:12px;display:flex;align-items:center;gap:8px;'+
        'background:rgba(78,106,86,.09);border-radius:11px;padding:10px 12px;font-size:13px;color:#4E6A56;font-weight:600">'+
        '<span style="font-size:15px">'+(isWeChat||isOtherApp?'↗':'⎙')+'</span><span>'+step+'</span></div>'+
      '<div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">'+
        '<button id="iosTipLater" style="border:0;background:transparent;color:#8B8172;font:600 14px system-ui;padding:9px 12px;border-radius:10px">稍后</button>'+
        '<button id="iosTipOk" style="border:0;background:#4E6A56;color:#fff;font:600 14px system-ui;padding:9px 18px;border-radius:10px">知道了</button>'+
      '</div>';

    wrap.appendChild(card);
    document.body.appendChild(wrap);

    function close(){ try{ localStorage.setItem(KEY,String(Date.now())); }catch(e){} wrap.remove(); }
    card.querySelector('#iosTipOk').addEventListener('click',function(){
      close();
    });
    card.querySelector('#iosTipLater').addEventListener('click',close);
  }

  // 等语言选择层等首启流程走完再弹，避免叠在一起
  var st=document.createElement('style');
  st.textContent='@keyframes iostip-in{from{transform:translateY(120%);opacity:0}to{transform:translateY(0);opacity:1}}';
  document.head.appendChild(st);
  setTimeout(build, 2600);
})();
</script>
