/* режим приложения на iOS: без лупы и выделения при долгом нажатии, без двойного тапа-зума */
.app,.sheet{-webkit-touch-callout:none}
.block,.item,.drow,.dgap,.dcell,.fchip,.tab,.ib,.fab,.chips button,.seg button,.viewseg button,.sec-h,.blank,.today-pill{
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.block,.item{touch-action:pan-y}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  overscroll-behavior:none;touch-action:manipulation;
}
body.nosel{user-select:none;-webkit-user-select:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}

.app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto;position:relative;background:var(--bg)}
@media(min-width:800px){.app{border-left:1px solid var(--sep);border-right:1px solid var(--sep)}}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}

/* ---- header ---- */
.hd{padding:calc(var(--st) + 12px) 16px 6px;display:flex;align-items:flex-end;gap:8px}
.hd>div:first-child{flex:1;min-width:0}
.hd h1{margin:0;font:600 25px/1.15 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dTitleText{min-width:0;overflow:hidden;text-overflow:ellipsis}
#dWeek{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 7px;margin-left:7px;flex:none;letter-spacing:.2px}
#dSub2{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
#dSub2:empty{display:none}
#dWeek:empty{display:none}
.td-hd .gear .ticon{position:relative;width:17px;height:17px;display:block}
.td-hd .gear .ticon svg{position:absolute;left:0;top:0;width:17px;height:17px;
  stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .28s ease}
.td-hd .gear .ic-moon{opacity:0;transform:rotate(-100deg) scale(.4)}
html[data-mode="dark"] .td-hd .gear .ic-sun{opacity:0;transform:rotate(100deg) scale(.4)}
html[data-mode="dark"] .td-hd .gear .ic-moon{opacity:1;transform:none}
html,body{transition:background-color .28s ease,color .28s ease}
#v-today,#v-day,#v-list{transition:background-color .28s ease}
.hd .sub{margin:3px 0 0;color:var(--text-2);font-size:13px}
/* 日程页头部：标题占满整行，进度和按钮另起一行 */
.hd.dhd{display:block;padding-bottom:4px;overflow:hidden}
.hd.dhd h1{width:100%}
.hd.dhd .hdrow{display:flex;align-items:center;gap:5px;margin-top:8px}
#bAutoFill{width:30px;height:30px;flex:none}
.hd.dhd .hdrow .grow{display:none}
.hd.dhd .hdrow .prog{margin-top:0;flex:1 1 auto;min-width:0;overflow:hidden}
.hd.dhd .hdrow .prog .bar{flex:1 1 auto;min-width:40px}
.hd .grow{flex:0 0 0}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--chip);transition:transform .12s,background .15s}
.ib:active{transform:scale(.9)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.loadbar{width:128px;height:3px;border-radius:2px;background:var(--chip);margin-top:9px;overflow:hidden}
.loadbar i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .35s ease}
.today-pill{font-size:11.5px;font-weight:600;color:var(--accent);padding:4px 9px;border-radius:20px;background:var(--accent-soft);flex:none;white-space:nowrap}

.hd h1.tap{display:flex;align-items:center;gap:6px;cursor:pointer}
.hd h1.tap svg{flex:none;width:14px;height:14px;stroke:var(--text-3);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;margin-top:3px}

/* ---- календарь месяца ---- */
.cal-h{display:flex;align-items:center;gap:6px;padding:2px 2px 8px}
.cal-h .m{flex:1;text-align:center;font-weight:600;font-size:16px;text-transform:capitalize}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--text-3);text-align:center;padding-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.cd{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;color:var(--text)}
.cd.out{color:var(--text-3)}
.cd .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500}
.cd[data-mc] .n{background:var(--mc);color:var(--tx,#fff);font-weight:600}
.cd.today:not([data-mc]) .n{color:var(--accent);font-weight:700}
.cd.sel .n{background:var(--accent);color:#fff}
.cd .u{width:16px;height:2px;border-radius:1px;background:transparent}
.cd.has .u{background:var(--text-2)}
.cd.dl .u{background:var(--orange);height:3px}
.cd.dl.sel .u{background:#fff}
.cd.has.sel .u{background:var(--accent)}
.moodleg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 12px;padding:8px 6px 2px}
.moodleg span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-3)}
.moodleg i{width:9px;height:9px;border-radius:50%;background:var(--mc)}
.cd.out.has .u{background:var(--text-3)}

/* ---- заметки ---- */
.ncard{display:block;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:12px 14px;transition:transform .12s}
.ncard:active{transform:scale(.988)}
.ncard .nt{font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard .np{font-size:13.5px;color:var(--text-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard .nd{font-size:12px;color:var(--text-3);margin-top:5px;font-variant-numeric:tabular-nums}
.nlist{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.nbar{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 8px) 12px 6px}
.nbar .back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:16px}
.nbar .back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nbar .grow{flex:1}
.ntitle{width:100%;border:0;background:transparent;outline:none;padding:6px 16px 2px;
  font:700 26px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.4px}
.ntitle::placeholder{color:var(--text-3)}
/* панель форматирования снизу, над клавиатурой — как в Заметках iPhone */
.ntoolbar{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:30;display:flex;align-items:center;gap:6px;
  padding:8px 12px calc(8px + var(--sb));border-top:.5px solid var(--sep);
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(20px)}
body.kb .ntoolbar{padding-bottom:8px}
.ntoolbar button{flex:none;min-width:42px;height:36px;padding:0 12px;border-radius:9px;background:var(--chip);
  font-size:15px;color:var(--text);display:grid;place-items:center;transition:background .12s}
.ntoolbar button:active{background:var(--chip-2)}
.ntoolbar button.on{background:var(--accent);color:#fff}
.ntoolbar button.h{font-weight:700}
.ntoolbar button.i{font-style:italic}
.ntoolbar .aa{font-weight:600;letter-spacing:-.3px}
.ntoolbar .grow{flex:1}
.ntoolbar .done{display:none;background:transparent;color:var(--accent);font-weight:600;padding:0 4px}
body.kb .ntoolbar .done{display:grid}
.fmtpop{position:fixed;left:12px;right:12px;bottom:calc(var(--kb,0px) + 60px + var(--sb));z-index:31;
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:fade .15s}
body.kb .fmtpop{bottom:calc(var(--kb,0px) + 60px)}
.fmtpop button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 16px;text-align:left;color:var(--text)}
.fmtpop button+button{border-top:.5px solid var(--sep)}
.fmtpop .s2{font:700 20px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.3px}
.fmtpop .s3{font:600 17px/1.2 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.fmtpop .sp{font:400 16px/1.2 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.fmtpop .tick{color:var(--accent);font-weight:700;opacity:0}
.fmtpop button.on .tick{opacity:1}
.nbody{flex:1;min-height:0;overflow-y:auto;padding:6px 16px calc(96px + var(--sb));outline:none;font-size:16.5px;line-height:1.5;
  -webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.nbody:empty::before{content:attr(data-ph);color:var(--text-3)}
.nbody h2{font-size:22px;font-weight:700;margin:14px 0 4px;letter-spacing:-.3px}
.nbody h3{font-size:18px;font-weight:600;margin:12px 0 2px}
.nbody p,.nbody div{margin:0 0 2px}
.nbody ul,.nbody ol{margin:4px 0 6px;padding-left:24px}
.nbody li{margin:1px 0}
.nbody b,.nbody strong{font-weight:650}

/* ---- выбор цвета ---- */
.swatches{display:flex;gap:10px;padding:4px 4px 2px;flex-wrap:wrap}
.sw-c{width:30px;height:30px;border-radius:50%;background:rgb(var(--c));position:relative;transition:transform .12s}
.sw-c:active{transform:scale(.9)}
.sw-c.on::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgb(var(--c))}

/* ---- переключатель режима дня ---- */
.viewseg{display:flex;background:var(--chip);border-radius:10px;padding:2px;gap:2px;flex:none}
.viewseg button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);transition:background .15s}
.viewseg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.viewseg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---- day strip ---- */
.striprow{display:flex;align-items:center;gap:2px;padding:8px 8px 10px}
.striprow .ib{width:28px;height:28px;background:transparent;flex:none}
.strip{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dcell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 5px;border-radius:12px;color:var(--text-2)}
.dcell .wd{font-size:11px;letter-spacing:.2px}
.dcell .dn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500;color:var(--text)}
.dcell.today .dn{color:var(--accent);font-weight:700}
.dcell.sel .dn{background:var(--accent);color:#fff}
.dcell.today .dn{color:var(--accent)}
.dcell.sel.today .dn{color:#fff}
.dcell .dot{width:4px;height:4px;border-radius:50%;background:var(--text-3)}
.dcell .dot.none{background:transparent}
.dcell.sel .dot{background:var(--accent)}
.dcell .dot.none,.dcell.sel .dot.none{background:transparent}

/* ---- timeline ---- */
.tl>.hline:first-child>span{top:0}
.tlwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 14px calc(96px + var(--sb))}
.tl{position:relative}
.btime{position:absolute;left:0;width:calc(var(--gutter) - 12px);text-align:right;
  font-size:11.5px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.2px;
  line-height:1;padding:2px 0;pointer-events:none;z-index:4;transform:translateY(-50%);
  background:var(--bg)}
/* 英文界面：12 小时制更宽，时间列跟着放宽 */
html[lang="en"] .block .btm,html[lang="en"] .cblock .btm{width:41px;font-size:8.5px;letter-spacing:-.45px}
html[lang="en"] .block{padding-left:56px}
html[lang="en"] .cblock{padding-left:56px}
html[lang="en"] .block.short{padding-left:10px}
html[lang="en"] .block.narrow,html[lang="en"] .cblock.narrow{padding-left:45px}
html[lang="en"] .block.narrow .btm,html[lang="en"] .cblock.narrow .btm{width:33px;font-size:8px}
/* 块内最左的起止时间 */
.block .btm,.cblock .btm{position:absolute;left:9px;top:7px;bottom:7px;width:29px;z-index:2;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
  font-size:10px;font-weight:800;line-height:1;letter-spacing:-.35px;font-variant-numeric:tabular-nums;
  color:var(--text);opacity:.95}
.block .btm b,.cblock .btm b{font-weight:800;display:block}
.block .btm b.e,.cblock .btm b.e{opacity:.5;font-weight:700}
.block .btm::after,.cblock .btm::after{content:'';position:absolute;right:-5px;top:1px;bottom:1px;width:1px;
  background:currentColor;opacity:.2}
.block.short .btm::after{display:none}
.block.narrow .btm::after,.cblock.narrow .btm::after{display:none}
.block.short{padding-left:10px}
.block.short .btm{position:static;width:auto;top:auto;bottom:auto;margin:0 7px 0 5px;
  flex-direction:row;align-items:center;font-size:10px;opacity:.9}
.block.short .btm b.e{display:none}
.block.narrow,.cblock.narrow{padding-right:6px;padding-left:33px}
.block.narrow .btm,.cblock.narrow .btm{left:5px;width:24px;font-size:8.5px;letter-spacing:-.5px}
.hline{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--grid)}
.hline>span{position:absolute;left:0;top:-7px;width:calc(var(--gutter) - 12px);text-align:right;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.now{position:absolute;left:calc(var(--gutter) - 6px);right:0;height:0;border-top:1.5px solid var(--red);z-index:5;pointer-events:none}
.now::before{content:'';position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.block{position:absolute;background:var(--block);border-radius:12px;padding:5px 16px 5px 42px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-start;touch-action:pan-y;
  transition:box-shadow .15s,transform .15s,opacity .15s}
.block::before{content:'';position:absolute;left:4px;top:5px;bottom:5px;width:3px;border-radius:2px;background:var(--bar,var(--gray))}
/* 课程块：虚线描边 + 浅底，和任务块区分 */
.cblock{position:absolute;border-radius:12px;padding:5px 8px 5px 42px;overflow:hidden;
  background:color-mix(in srgb,var(--cc) 15%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 45%,transparent);
  border-left:3px solid var(--cc);touch-action:pan-y}
.cblock .cbt{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cblock .cbm{font-size:10.5px;color:var(--text-3);margin-top:2px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cblock.moved .cbm{color:var(--orange)}
.block.narrow .bt,.cblock.narrow .cbt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;line-height:1.25}
.block.narrow,.cblock.narrow{padding-right:6px}
@supports (background:color-mix(in srgb,red 10%,white)){
  .block{background:color-mix(in srgb,var(--bar) 13%,var(--surface));
    box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--bar) 20%,transparent)}
  .drow .bar,.sec-h .pd{opacity:.95}
}
.block .bt{font-size:13px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block:not(.short) .bt{display:block;white-space:normal;word-break:break-word;
  max-height:2.5em;overflow:hidden;font-size:12px;line-height:1.22}
.block:not(.short) .bm{font-size:10.5px}
.block .bm{font-size:11.5px;color:var(--text-2);margin-top:2px;font-variant-numeric:tabular-nums}
.block.short{padding-top:2px;padding-bottom:2px;flex-direction:row;align-items:center;gap:6px}
.block.short .bm{margin-top:0}
.block.urgent{box-shadow:inset 0 0 0 2px var(--red), 0 2px 10px rgba(255,59,48,.22)}
@supports (background:color-mix(in srgb,red 10%,white)){
  .block.urgent{background:color-mix(in srgb,var(--red) 18%,var(--surface));
    box-shadow:inset 0 0 0 2px var(--red), 0 2px 10px color-mix(in srgb,var(--red) 28%,transparent)}
}
.block.urgent::before{width:4px;background:var(--red)}
.block.urgent .bt{color:var(--red)}
.anybox{padding:0 0 10px}
.anybox .ah{font-size:11.5px;color:var(--text-3);margin:2px 0 8px;display:flex;align-items:center;gap:6px}
.anybox .ah i{font-style:normal;background:var(--field);border-radius:999px;padding:1px 7px;font-size:10.5px}
.acard{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--sep);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.acard .at{flex:1;min-width:0}
.acard .an{font-size:14.5px;font-weight:600;line-height:1.35;word-break:break-word}
.acard .am{font-size:11.5px;color:var(--text-3);margin-top:4px}
.acard .arem{font-size:12.5px;color:var(--text-2);margin-top:5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.acard.done{opacity:.62}
.acard.done .an{text-decoration:line-through;color:var(--text-3)}
.acard .ack{width:23px;height:23px;border-radius:50%;border:1.7px solid var(--text-3);background:transparent;flex:none;margin-top:1px;display:grid;place-items:center;padding:0}
.acard .ack svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.acard .ack.on{background:var(--green);border-color:var(--green)}
.acard .adel{width:28px;height:28px;border:0;background:transparent;color:var(--text-3);flex:none;display:grid;place-items:center;border-radius:9px;padding:0;margin-top:-1px}
.acard .adel svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acard .adel:active{background:var(--field);color:var(--red)}
.acard .aedit{width:28px;height:28px;border:0;background:transparent;color:var(--text-3);flex:none;display:grid;place-items:center;border-radius:9px;padding:0;margin-top:-1px}
.acard .aedit svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acard .aedit:active{background:var(--field);color:var(--accent)}
.acard.marked{border-left:3px solid var(--mk,#5B87B8)}
.dayback{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:0 0 10px;padding:10px;border:1px dashed var(--sep);border-radius:12px;background:transparent;color:var(--text-2);font-size:12.5px}
.dayback svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.dayback:active{background:var(--chip);color:var(--accent)}
.faqsec{margin-bottom:20px}
.faqh{font-size:13.5px;font-weight:700;color:var(--text);margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--sep)}
.faqq{font-size:13px;color:var(--text);margin:12px 0 4px;font-weight:600;line-height:1.55}
.faqa{font-size:12.5px;color:var(--text-2);line-height:1.8;white-space:pre-wrap}
.faqitem[hidden]{display:none}
.faqsec[hidden]{display:none}
.hsearch{position:sticky;top:-14px;z-index:6;background:var(--surface);padding:14px 0 12px;margin:-14px 0 0}
.hsearch::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:8px;
  background:linear-gradient(var(--surface),transparent);pointer-events:none}
.hsearch input{width:100%;box-sizing:border-box;border:0;background:var(--field);border-radius:11px;
  padding:11px 13px;font-size:14px;color:var(--text);outline:none}
.hsearch input::placeholder{color:var(--text-3)}
.hTop{position:absolute;right:15px;bottom:22px;width:44px;height:44px;border-radius:50%;
  background:var(--surface);border:1px solid var(--sep);box-shadow:0 8px 22px -10px rgba(0,0,0,.45);
  display:grid;place-items:center;font-size:17px;color:var(--text-2);z-index:30;cursor:pointer}
.hTop:active{background:var(--field)}
.tcard .tdel{width:30px;height:30px;border:0;background:transparent;color:var(--text-3);flex:none;display:grid;place-items:center;border-radius:9px;padding:0}
.tcard .tdel svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tcard .tdel:active{background:var(--field);color:var(--red)}
.tcard .tedit{width:30px;height:30px;border:0;background:transparent;color:var(--text-3);flex:none;display:grid;place-items:center;border-radius:9px;padding:0}
.tcard .tedit svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tcard .tedit:active{background:var(--field);color:var(--accent)}
.tcard.marked:before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--mk,#5B87B8)}
.tcard .tnote{font-size:12.5px;color:var(--text-2);margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.drow .dnote{display:block;font-size:12.5px;color:var(--text-2);margin-top:5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.pric{font-style:normal;font-size:10px;font-weight:700;line-height:1;color:#fff;background:var(--pc);
  border-radius:5px;padding:3px 5px;margin-right:6px;vertical-align:2px;display:inline-block}
.pric.sm{font-size:9px;padding:2px 4px;margin-right:4px;border-radius:4px}
.block .bt{display:flex;align-items:center;gap:0}
.item .inote{font-size:12px;color:var(--text-3);margin-top:3px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.drow .rdel{width:26px;height:26px;border:0;background:transparent;color:var(--text-3);flex:none;align-self:center;display:grid;place-items:center;border-radius:8px;padding:0;margin-right:2px}
.drow .rdel svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.drow .rdel:active{background:var(--field);color:var(--red)}
.drow.urgent{box-shadow:inset 0 0 0 2px var(--red)}
.drow.urgent .dt{color:var(--red)}
.item .urg{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:5px;background:var(--red);
  color:#fff;font-size:12px;font-weight:800;margin-right:6px;vertical-align:-2px}
.seg.p4 button{padding:7px 2px;font-size:12.5px;letter-spacing:-.2px}
.seg.p4 button[data-p="3"].on{color:var(--red)}
.block.done{opacity:.45}
.block.done .bt{text-decoration:line-through}
.block.dragging{z-index:20;box-shadow:var(--shadow);transform:scale(1.02);opacity:.95;background:var(--surface);transition:none}
.bchk{position:absolute;top:5px;right:6px;width:20px;height:20px;border-radius:50%;border:1.6px solid var(--text-3);
  display:grid;place-items:center;z-index:3;background:transparent}
.bchk svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.block.short .bchk{top:50%;margin-top:-9px;width:18px;height:18px}
.block .rz{position:absolute;left:0;right:0;bottom:0;height:14px;cursor:ns-resize}
.block .rz::after{content:'';position:absolute;left:50%;bottom:3px;width:22px;height:2.5px;margin-left:-11px;border-radius:2px;background:var(--text-3);opacity:0;transition:opacity .15s}
.block:hover .rz::after{opacity:.5}
.empty{position:absolute;left:var(--gutter);right:0;top:40%;text-align:center;color:var(--text-3);font-size:13px}

/* ---- day list ---- */
.dlist{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;gap:11px;align-items:stretch;width:100%;text-align:left;background:var(--surface);border-radius:12px;padding:11px 13px}
.drow .tm{width:46px;flex:none;font-variant-numeric:tabular-nums}
.drow .tm b{display:block;font-size:14.5px;font-weight:600}
.drow .tm span{display:block;font-size:12.5px;color:var(--text-3);margin-top:1px}
.drow .bar{width:3px;border-radius:2px;background:var(--bar,var(--gray));flex:none}
.drow .dc{flex:1;min-width:0;padding-top:1px;display:block}
.drow .dt{display:block;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dm{display:block;font-size:12.5px;color:var(--text-2);margin-top:3px}
.drow .rchk{width:22px;height:22px;border-radius:50%;border:1.7px solid var(--text-3);flex:none;align-self:center;
  display:grid;place-items:center;background:transparent}
.drow .rchk svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.drow{cursor:pointer}
.drow .dm em{font-style:normal;color:var(--orange)}
.drow.done{opacity:.5}
.drow.done .dt{text-decoration:line-through}
.dgap{display:flex;align-items:center;gap:10px;width:100%;padding:5px 13px;color:var(--text-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.dgap .ln{flex:1;height:1px;background:var(--sep)}

/* ---- папки ---- */
.foldersrow{display:flex;align-items:center;gap:6px;padding:2px 14px 8px}
.foldersrow .folders{flex:1;min-width:0;padding:0}
.fmore{flex:none;width:32px;height:32px;border-radius:50%;background:var(--chip);color:var(--text-2);
  display:grid;place-items:center;transition:transform .12s}
.fmore:active{transform:scale(.92)}
.fmore svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fchip.floating{position:fixed;z-index:60;box-shadow:var(--shadow);transform:scale(1.04);pointer-events:none}
.fph{flex:none;border-radius:20px;background:var(--chip-2);height:32px}
.folders{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.fchip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;background:var(--chip);
  font-size:13.5px;color:var(--text-2);white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.fchip:active{transform:scale(.96)}
.fchip{touch-action:pan-x}
.fchip.on{background:var(--accent);color:#fff}
.fchip .cnt{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.fchip.on .cnt{opacity:.8}
.fchip .dots{margin-left:1px;opacity:.85;letter-spacing:.5px}
.fchip.add{color:var(--accent);font-weight:600;padding:7px 14px}
.finput{flex:none;background:var(--surface);border:0;border-radius:20px;padding:7px 13px;font-size:13.5px;
  outline:1.5px solid var(--accent);min-width:160px}

/* ---- список папок ---- */
.frow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:12px;touch-action:pan-y}
.frow+.frow{margin-top:6px}
.frow.floating{position:fixed;z-index:60;box-shadow:var(--shadow);transform:scale(1.02);pointer-events:none;margin:0}
.frow .fn{flex:1;min-width:0;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fc{font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.frow .fdrag{color:var(--text-3);display:grid;place-items:center;width:22px}
.frow .fdrag svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.frow .fedit{color:var(--accent);font-size:14px;padding:4px 2px}
.frow.on .fn{font-weight:600;color:var(--accent)}

/* ---- backlog ---- */
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 14px calc(96px + var(--sb))}
.sec{margin-top:14px}
.sec.empty-sec{display:none}
body.reorder .sec.empty-sec{display:block}
.sec-h{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);padding:0 4px 6px;display:flex;align-items:center;gap:6px}
.sec-h .pd{width:7px;height:7px;border-radius:50%}
.sec-h.foldable{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sec-h i{font-style:normal;font-size:10.5px;color:var(--text-3);background:var(--chip);border-radius:999px;padding:1px 7px}
.sec-h .chev{margin-left:auto}
.list{display:flex;flex-direction:column;gap:6px;min-height:8px;border-radius:12px}
body.reorder .list{min-height:44px;outline:1px dashed var(--sep);outline-offset:3px}
.item{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:12px;padding:11px 12px;touch-action:pan-y}
.item.floating{position:fixed;z-index:60;box-shadow:var(--shadow);transform:scale(1.02);pointer-events:none;margin:0}
.ph{border-radius:12px;background:var(--chip);}
.chk{width:22px;height:22px;border-radius:50%;border:1.7px solid var(--text-3);flex:none;display:grid;place-items:center}
.chk svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item.done .chk{background:var(--green);border-color:var(--green)}
.item.done .chk svg{opacity:1}
.item.done .it{text-decoration:line-through;color:var(--text-2)}
.item .ic{flex:1;min-width:0}
.item .it{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pdok{font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent);margin-left:7px;
  padding:1.5px 7px;border-radius:7px;background:color-mix(in srgb,var(--accent) 13%,transparent);
  vertical-align:2px;letter-spacing:0}
.item.cycdone .it{color:var(--text)}
.item .im{font-size:12px;color:var(--text-2);margin-top:2px}
.item .go{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--text-2)}
.item .go svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item .edit{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--text-2);border:0}
.item .edit svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item.marked{border-left:3px solid var(--mk,#5B87B8)}
.item .del{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--text-3);border:0}
.item .del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item .del:active{color:var(--red)}
.blank{text-align:center;color:var(--text-3);font-size:13.5px;padding:56px 24px;line-height:1.5}
.blank .gl{width:54px;height:54px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin:0 auto 14px}
.blank .gl svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item:active,.drow:active{transform:scale(.988)}
.item,.drow{transition:transform .12s}

/* ---- tabbar + fab ---- */
body.note-open .tabbar{display:none}
.tabbar{display:flex;margin:0 12px calc(10px + var(--sb));background:color-mix(in srgb,var(--surface) 92%,transparent);
  border:1px solid var(--sep);border-radius:23px;padding:7px 2px 6px;backdrop-filter:blur(18px);
  box-shadow:0 14px 34px -24px rgba(96,84,64,.9),0 1px 0 rgba(255,255,255,.6) inset}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0 2px;color:var(--text-3);font-size:10px;min-width:0;letter-spacing:.2px}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;
  border-radius:9px;transition:background .22s,box-shadow .22s,transform .22s}
.tab.on{color:var(--accent);font-weight:600}
.tab.on svg{background:var(--accent-soft);box-shadow:0 0 0 5px var(--accent-soft);stroke-width:2.05}
.fab{position:absolute;right:18px;bottom:calc(76px + var(--sb) + 14px);width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(78,106,86,.55);transition:transform .12s;z-index:15}
.fab:active{transform:scale(.92)}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* ---- sheet ---- */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:20px 20px 0 0;
  max-height:92dvh;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(102%)}}
@keyframes fade{from{opacity:0}}
@media(min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:440px;border-radius:18px;max-height:86dvh;animation:pop .2s}
  @keyframes pop{from{transform:translate(-50%,-48%) scale(.96);opacity:0}}
}
.grab{width:36px;height:5px;border-radius:3px;background:var(--chip-2);margin:8px auto -2px}
@media(min-width:700px){.grab{display:none}}
.sh-h{display:flex;align-items:center;padding:14px 16px 10px;border-bottom:.5px solid var(--sep)}
.sh-h .t{flex:1;text-align:center;font-weight:600;font-size:16px}
.tb{font-size:16px;color:var(--accent);min-width:74px}
.tb.r{text-align:right}
.tb.strong{font-weight:600}
.sh-b{overflow-y:auto;padding:14px 16px calc(20px + var(--sb));display:flex;flex-direction:column;gap:10px}
.sh-b>*{flex:0 0 auto}
.f-title{width:100%;background:var(--field);border:0;border-radius:12px;padding:13px 14px;font-size:17px;font-weight:500;outline:none}
.f-title::placeholder{color:var(--text-3)}
textarea.f-note{width:100%;background:var(--field);border:0;border-radius:12px;padding:12px 14px;font-size:15px;outline:none;resize:none;min-height:66px}
.card{background:var(--field);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;min-height:46px}
.row+.row,#eSched .row,#eSched+.row{border-top:.5px solid var(--sep)}
#eSched .row:first-child{border-top:0}
.row .lbl{flex:1;font-size:15px}
.row .lbl.lk{flex:0 0 auto;white-space:nowrap}
.row .lbl.vv{flex:1;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.row input[type=date],.row input[type=time]{background:var(--chip);border:0;border-radius:8px;padding:6px 9px;font-size:15px;outline:none;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--text-2);transition:background .15s}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stp{display:flex;align-items:center;gap:2px;background:var(--chip);border-radius:9px;padding:2px}
.stp button{width:32px;height:28px;border-radius:7px;font-size:18px;line-height:1;color:var(--text)}
.stp button:active{background:var(--chip-2)}
.stp .v{min-width:80px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.durinput{width:80px;text-align:center;border:0;background:var(--field);border-radius:8px;font:500 14px/1.2 inherit;padding:5px 2px;color:var(--text);-moz-appearance:textfield}
.durinput::-webkit-outer-spin-button,.durinput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 11px;border-radius:9px;background:var(--chip);font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.chips button.on{background:var(--accent);color:#fff}
.chips button.add{color:var(--accent);font-weight:600}
.hint{font-size:12px;color:var(--text-3);padding:0 4px}
.warn{font-size:13px;color:var(--orange);padding:2px 4px;display:flex;gap:6px;align-items:flex-start}
.prim{width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;text-align:center}
.prim:active{opacity:.85}
.subtle{width:100%;padding:13px;border-radius:12px;background:var(--field);color:var(--accent);font-size:15px;font-weight:500;text-align:center}
.who{font-size:13px;color:var(--text-2);padding:0 4px 2px}
.arch-note{font-size:12px;color:var(--text-3);text-align:center;padding:14px 20px 4px;line-height:1.45}
.item .when{font-variant-numeric:tabular-nums}
.danger{width:100%;padding:13px;border-radius:12px;background:var(--field);color:var(--red);font-size:15px;font-weight:500;text-align:center}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;z-index:2}
.sw i{position:absolute;inset:0;border-radius:30px;background:var(--chip-2);transition:background .2s}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(20px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sb));z-index:70;background:var(--text);color:var(--bg);
  padding:11px 16px;border-radius:22px;font-size:13.5px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);animation:fade .2s;max-width:90vw}
.toast button{color:var(--accent);font-weight:600;font-size:13.5px}
/* ====== 本地增强：进度 / DDL / 统计 ====== */
.prog{display:flex;align-items:center;gap:8px;margin-top:9px;height:16px}
.prog .bar{flex:0 1 150px;height:5px;border-radius:3px;background:var(--chip-2);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--accent);transition:width .45s ease}
.prog .txt{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog .fire{font-size:12px;color:var(--orange);font-weight:600;white-space:nowrap}
.ddlbar{display:flex;align-items:center;gap:8px;margin:2px 16px 8px;padding:11px 12px;border-radius:13px;min-height:44px;
  background:var(--accent-soft);border:.5px solid var(--accent-line);color:var(--text);font-size:13px;text-align:left;width:calc(100% - 32px)}
.ddlbar .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.ddlbar .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddlbar .d{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;flex:none;font-size:12.5px}
.ddlbar.soon{background:rgba(255,149,0,.12);border-color:rgba(255,149,0,.28)}
.ddlbar.soon .dot{background:var(--orange)}
.ddlbar.soon .d{color:var(--orange)}
.ddlbar.over{background:rgba(255,59,48,.12);border-color:rgba(255,59,48,.28)}
.ddlbar.over .dot{background:var(--red)}
.ddlbar.over .d{color:var(--red)}
.ddlwrap{position:relative;margin:0 16px 4px;flex:0 1 auto;max-height:min(38vh,340px)}
.ddlbox{max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* 底部渐隐：提示下面还有内容 */
.ddlwrap::after{content:'';position:absolute;left:0;right:0;bottom:0;height:20px;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,0),var(--bg));opacity:0;transition:opacity .15s}
.ddlwrap.more::after{opacity:1}
.ddlbox:empty{display:none}
.ddlhead{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin:2px 2px 8px}
.ddlhead b{color:var(--text-2);font-weight:600;font-size:13px;letter-spacing:.2px}
.ddlrow{display:flex;align-items:center;gap:10px;padding:7px 0;min-height:44px}
.ddlmore{margin:2px 0 2px;padding:9px 10px;border-radius:9px;text-align:center;font-size:12.5px;font-weight:500;
  color:var(--text-2);background:var(--field);cursor:pointer}
.ddlmore:active{background:var(--chip-2)}
.ddlrow .nm{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddlrow .meta{display:flex;align-items:center;gap:6px;margin-top:4px}
.ddlrow .dd{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ddlrow .left{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--chip-2);color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 把旧的「按星期排」系列（每周生成一堆实例）统一成周期任务：一条记录管到底 */
function migrateSeries(){
  if(!S.settings) S.settings=Object.assign({},DEF);
  if(S.settings.seriesMigrated) return 0;
  S.settings.seriesMigrated=true;
  if(!S.series||!S.series.length){ save(); return 0; }
  var n=0;
  S.series.slice().forEach(function(sr){
    if(!sr) return;
    var insts=S.tasks.filter(function(t){return t.seriesId===sr.id;});
    var base=insts.length?insts[0]:null;
    var startV=(base&&base.start!=null)?base.start:(sr.start!=null?sr.start:null);
    var nt=normalize({
      id:uid(),
      title:(base&&base.title)||sr.title||'',
      note:(base&&base.note)||sr.note||'',
      dur:(base&&base.dur)||sr.dur||S.settings.dur,
      pri:(base&&typeof base.pri==='number')?base.pri:((typeof sr.pri==='number')?sr.pri:1),
      folder:(base&&base.folder)||sr.folder||null,
      remind:(base&&typeof base.remind==='number')?base.remind:-1,
      ord:(base&&base.ord)||0,
      start:startV,
      period:(sr.kind==='week')?'week':'day',
      periodDays:(sr.kind==='week'&&Array.isArray(sr.days))?sr.days.slice():[]
    });
    insts.forEach(function(ins){
      if(!ins.date||!S.log[ins.date]||!S.log[ins.date][ins.id]) return;
      if(!S.log[ins.date]) S.log[ins.date]={};
      S.log[ins.date][nt.id]=1;                 // 把旧的完成记录挪到新任务名下
    });
    S.tasks.push(nt);
    n++;
  });
  S.tasks=S.tasks.filter(function(t){return !t.seriesId;});
  S.series=[];
  save();
  return n;
}

var lastSnapAt=0;
function backupKeys(){
  var out=[],i;
  for(i=1;i<=3;i++) out.push(KEY+'.bak'+i);
  return out;
}
function forceSnap(){ lastSnapAt=0; dataSnap(); }
function pruneDaily(){
  var days=[],i,k;
  for(i=0;i<localStorage.length;i++){
    k=localStorage.key(i);
    if(k && k.indexOf(KEY+'.day.')===0) days.push(k);
  }
  days.sort();
  while(days.length>7){ try{ localStorage.removeItem(days.shift()); }catch(e){} }
}
function dataSnap(){
  var now=Date.now();
  if(now-lastSnapAt<20000) return;
  lastSnapAt=now;
  try{
    var cur=localStorage.getItem(KEY);
    if(!cur || cur.length<10) return;
    localStorage.setItem(KEY+'.bak3', localStorage.getItem(KEY+'.bak2')||'');
    localStorage.setItem(KEY+'.bak2', localStorage.getItem(KEY+'.bak1')||'');
    localStorage.setItem(KEY+'.bak1', cur);
    var dk=KEY+'.day.'+todayISO();
    if(!localStorage.getItem(dk)) localStorage.setItem(dk, cur);
    pruneDaily();
  }catch(e){}
}
function hasContent(v){
  if(!v) return false;
  return !!((v.tasks&&v.tasks.length)||(v.series&&v.series.length)||
            (v.notes&&v.notes.length)||(v.folders&&v.folders.length));
}
function readBackup(){
  var i,v,keys=backupKeys();
  for(i=0;i<7;i++) keys.push(KEY+'.day.'+addDays(todayISO(),-i));
  for(i=0;i<keys.length;i++){
    try{ v=JSON.parse(localStorage.getItem(keys[i])||'null'); }catch(e){ v=null; }
    if(hasContent(v)) return v;
  }
  return null;
}

function shortName(n){
  var t=String(n||'').replace(/[（(][^）)]*[）)]/g,'').replace(/\s+/g,'').trim();
  if(!t) return '';
  for(var i=0;i<SUB_MAP.length;i++){
    if(t.indexOf(SUB_MAP[i][0])>=0) return SUB_MAP[i][1];
  }
  // 去掉「大学/高等/…」这类谁都有、认不出课的字，再去掉「概论/原理/…」
  var u=t.replace(CUT_HEAD,'');
  if(u.length>=2) t=u;
  var v=t.replace(CUT_TAIL,'');
  if(v.length>=2) t=v;
  if(t.length<=3) return t;
  return t.slice(0,3);
}

function buildShadow(){
  shadow={t:{},f:{},n:{},r:{},s:JSON.stringify(S.settings)};
  S.series.forEach(function(x){shadow.r[x.id]=bareJSON(x);});
  S.tasks.forEach(function(t){shadow.t[t.id]=bareJSON(t);});

function stampChanges(){
  if(!shadow){ buildShadow(); return; }
  var now=Date.now(), seenT={}, seenF={};
  S.tasks.forEach(function(t){
    seenT[t.id]=1;
    if(shadow.t[t.id]!==bareJSON(t)){ t.upd=now; delete S.del[t.id]; }
  });
  Object.keys(shadow.t).forEach(function(id){ if(!seenT[id]) S.del[id]=now; });
  S.folders.forEach(function(f){
    seenF[f.id]=1;
    if(shadow.f[f.id]!==bareJSON(f)){ f.upd=now; delete S.del[f.id]; }
  });
  Object.keys(shadow.f).forEach(function(id){ if(!seenF[id]) S.del[id]=now; });
  var seenN={};
  S.notes.forEach(function(x){
    seenN[x.id]=1;
    if(shadow.n[x.id]!==bareJSON(x)){ x.upd=now; delete S.del[x.id]; }
  });
  Object.keys(shadow.n).forEach(function(id){ if(!seenN[id]) S.del[id]=now; });
  var seenR={};
  S.series.forEach(function(x){
    seenR[x.id]=1;
    if(shadow.r[x.id]!==bareJSON(x)){ x.upd=now; delete S.del[x.id]; }
  });
  Object.keys(shadow.r).forEach(function(id){ if(!seenR[id]) S.del[id]=now; });
  if(JSON.stringify(S.settings)!==shadow.s) S.settingsUpd=now;
  buildShadow();
}

/* ---------- utils ---------- */
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fromISO(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){var d=fromISO(s);d.setDate(d.getDate()+n);return isoOf(d);}
function todayISO(){return isoOf(new Date());}
function mondayOf(s){var d=fromISO(s),wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return isoOf(d);}
function hhmm(m){
  m=Math.max(0,Math.round(m));
  var h=Math.floor(m/60)%24, mi=Math.round(m)%60;
  if(isEN()){ var ap=h<12?'AM':'PM', h12=h%12; if(h12===0) h12=12; return h12+':'+String(mi).padStart(2,'0')+' '+ap; }
  return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
}
function durStr(m){var h=Math.floor(m/60),mm=Math.round(m%60);
  if(isEN()){ if(h&&mm)return h+'h '+mm+'m'; if(h)return h+'h'; return mm+'m'; }
  if(h&&mm)return h+' '+tr('ч')+' '+mm+' '+tr('м'); if(h)return h+' '+tr('ч'); return mm+' '+tr('мин');}
function plur(n,a,b,c){
  if(LANG==='ru'){ var x=n%10,y=n%100; if(x===1&&y!==11)return a; if(x>=2&&x<=4&&(y<10||y>=20))return b; return c; }
  var e=L[LANG]&&L[LANG][a];
  if(e&&typeof e==='object'){ var cat=PR?PR.select(n):(n===1?'one':'other'); return e[cat]||e.other||a; }
  return tr(a);
}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function snapM(m){var s=S.settings.snap||5;return Math.round(m/s)*s;}
function fmtDay(s){
  var d=fromISO(s), t=todayISO();
  if(isEN()){
    if(s===t) return 'Today';
    if(s===addDays(t,1)) return 'Tomorrow';
    if(s===addDays(t,-1)) return 'Yesterday';
    return enMD(s);
  }
  if(s===t)return tr('Сегодня');
  if(s===addDays(t,1))return tr('Завтра');
  if(s===addDays(t,-1))return tr('Вчера');
  var r=d.toLocaleDateString(LOCALE,{weekday:'short',day:'numeric',month:'long'}).replace(/\.,/,',');
  return r.charAt(0).toUpperCase()+r.slice(1);
}

function fmtDayIn(s){ var r=fmtDay(s); return LANG==='ru'?r.toLowerCase():r; }
function fmtDayShort(s){

  return '<div class="hint">'+label+'</div><div class="chips" id="'+id+'">'+w.slice(0,6).map(function(x){
    var whole=(x.b-x.a)>=span-1;
    return '<button data-m="'+x.start+'">'+(whole?tr('весь день'):hhmm(x.a)+'–'+hhmm(x.b))+'</button>';
  }).join('')+'</div>';
}
function slotStarts(date,dur,skip,limit){
  limit=limit||6;
  var base=(date===todayISO())?Math.ceil(nowMin()/15)*15:0;
  var gaps=freeSlots(date,dur,skip,base),out=[],i,j,a,b2,span,k,m;
  for(i=0;i<gaps.length&&out.length<limit;i++){
    a=Math.ceil(gaps[i][0]/15)*15; b2=gaps[i][1]-dur;
    if(b2<a) continue;
    span=b2-a;
    k=(span<60)?1:((span<240)?2:3);
    for(j=0;j<k&&out.length<limit;j++){
      m=Math.round((a+span*j/k)/15)*15;
      if(m>=a&&m<=b2&&out.indexOf(m)<0) out.push(m);
    }
  }
  return out;
}

var WINDOW_AHEAD=35;
function seriesMatches(sr,iso){
  if(iso<sr.from) return false;
  if(sr.kind==='daily') return true;
  var wd=(fromISO(iso).getDay()+6)%7;
  return (sr.days||[]).indexOf(wd)>=0;
}
function repLabel(sr){
  if(!sr) return '';
  if(sr.kind==='daily') return tr('каждый день');
  var d=(sr.days||[]).slice().sort(function(a,b){return a-b;});
  if(d.length===7) return tr('каждый день');
  if(d.join()==='0,1,2,3,4') return tr('по будням');
  if(d.join()==='5,6') return tr('по выходным');
  return d.map(function(i){return WD[i];}).join(', ');
}
function instanceFor(sr,iso){
  return normalize({id:sr.id+'@'+iso,title:sr.title,note:sr.note,date:iso,start:sr.start,dur:sr.dur,
    pri:sr.pri,folder:sr.folder,seriesId:sr.id});
}
/* создаёт недостающие экземпляры серий в окне [вчера … +35 дней] (или до указанной даты) */
function ensureOccurrences(untilIso){
  if(!S.series.length) return false;
  var t0=todayISO(), from=addDays(t0,-1), to=addDays(t0,WINDOW_AHEAD);
  if(untilIso&&untilIso>to) to=untilIso;
  var have={}, created=false;
  S.tasks.forEach(function(t){ if(t.seriesId) have[t.seriesId+'@'+t.date]=1; });
  S.series.forEach(function(sr){
    var d=(from<sr.from)?sr.from:from, key;
    while(d<=to){
      key=sr.id+'@'+d;
      if(!have[key] && seriesMatches(sr,d) && !(sr.skip&&sr.skip[d])){
        // экземпляр, удалённый уже после последней смены правила, не воскрешаем
        if(!(S.del[key] && S.del[key]>(sr.ruleUpd||0))){
          S.tasks.push(instanceFor(sr,d)); have[key]=1; created=true;
        }
      }
      d=addDays(d,1);
    }
  });
  if(created&&!applyingRemote) save();
  return created;
}
/* правило или содержимое серии изменилось: будущие невыполненные экземпляры приводим в соответствие */
function regenSeries(sr,fromIso){
  sr.ruleUpd=Date.now();
  S.tasks=S.tasks.filter(function(t){
    if(t.seriesId!==sr.id||t.done||t.date<fromIso) return true;
    if(!seriesMatches(sr,t.date)||(sr.skip&&sr.skip[t.date])) return false;   // больше не по правилу — убрать
    t.title=sr.title; t.note=sr.note; t.start=sr.start; t.dur=sr.dur; t.pri=sr.pri; t.folder=sr.folder;
    return true;
  });
  save(); ensureOccurrences();
}
function removeSeries(sr,keepId){
  S.series=S.series.filter(function(x){return x.id!==sr.id;});
  S.tasks=S.tasks.filter(function(t){
    if(t.seriesId!==sr.id) return true;
    if(t.done||t.id===keepId){ t.seriesId=null; return true; }
    return false;
  });
}
function detachInstance(t){
  var sr=t.seriesId&&seriesById(t.seriesId);
  if(sr){ sr.skip=sr.skip||{}; sr.skip[t.date]=true; }
  t.seriesId=null;
}

/* 这条周期任务是在本周期哪一天做完的（没做返回 null） */
function periodDoneAt(t,iso){
  var key=periodKeyOf(t,iso);
  for(var k in S.log){
    if(S.log[k]&&S.log[k][t.id]&&periodKeyOf(t,k)===key) return k;
  }
  return null;
}
/* 那一天「应该有哪些事」——不受完成状态影响，已完成的那天也算进分母 */
function dayTaskList(iso){
  var out=[];
  S.tasks.forEach(function(t){
    var done=(t.period?periodDone(t,iso):doneOn(t,iso));
    if(isDueTask(t)) return;                          // 截止任务没有固定日子，不算
    if(t.period){
      if(t.period==='day'){ out.push({t:t,done:done}); return; }        // 每天任务
      var pd=t.periodDays||[];
      if(!pd.length) return;                                            // 没指定星期几/几号的周期任务不算
      var hit=(t.period==='week')
        ? pd.indexOf((fromISO(iso).getDay()+6)%7)>=0
        : pd.indexOf(fromISO(iso).getDate())>=0;
      if(hit) out.push({t:t,done:done});
      return;
    }
    if(t.dailyDays){ if(isDailyOn(t,iso)) out.push({t:t,done:done}); return; }
    if(t.date===iso) out.push({t:t,done:done});                        // 那天排的普通任务
  });
  return out;
}
/* 某天的完成情况：那天安排的条数、做完的条数、完成率 */
function dayStat(iso){
  var list=dayTaskList(iso), total=list.length, done=0;
  for(var i=0;i<list.length;i++){ if(list[i].done) done++; }
  return {t:total,d:done,r:total?Math.round(done/total*100):null};
}

}

var __alarmAt=0, __alarmTimer=0;
/** 未来 3 天的提醒全部登记到系统闹钟，App 不在后台也能响 */
function syncNativeReminders(force){
  var b=nativeApp();
  if(!b||!b.scheduleReminders) return;
  if(force){ doSyncAlarms(); return; }
  // 连续保存时合并成一次，但不会像节流那样丢掉最后一次
  clearTimeout(__alarmTimer);
  __alarmTimer=setTimeout(doSyncAlarms,900);
}
function doSyncAlarms(){
  var b=nativeApp();
  if(!b||!b.scheduleReminders) return;
  var now=Date.now();
  __alarmAt=now;
  var out=[], horizon=now+7*86400000, i, t, base, at;
  for(i=0;i<S.tasks.length;i++){
    t=S.tasks[i];
    if(t.done) continue;
    var remindsAll=remindsOf(t);
    if(isSched(t)&&remindsAll.length){
      base=new Date((t.date||todayISO())+'T00:00:00').getTime();
      for(var ri=0;ri<remindsAll.length;ri++){
        at=base+t.start*60000-remindsAll[ri]*60000;
        if(at>now+5000&&at<horizon)
          out.push({id:'r'+t.id+'@'+remindsAll[ri],at:at,title:rTitle(t),body:rBody(t)});
      }
    }
    if(t.period&&t.start!=null&&remindsAll.length){
      for(var kk=0;kk<7;kk++){
        var piso=addDays(todayISO(),kk);
        if(!periodOnDay(t,piso)) continue;
        if(periodDone(t,piso)) continue;
        for(var rj=0;rj<remindsAll.length;rj++){
          at=new Date(piso+'T00:00:00').getTime()+t.start*60000-remindsAll[rj]*60000;
          if(at>now+5000&&at<horizon)
            out.push({id:'r'+t.id+'-'+piso+'@'+remindsAll[rj],at:at,title:rTitle(t),body:rBody(t)});
        }
      }
    }
    if(isDueTask(t)&&t.due){
      at=new Date(addDays(t.due,-1)+'T20:00:00').getTime();
      if(at>now+5000&&at<horizon)
        out.push({id:'d'+t.id,at:at,title:isEN()?('Due tomorrow: '+(t.title||'Task')):('明天截止：'+(t.title||'任务')),
          body:isEN()?('Due '+dateLabel(t.due)+' · finish it today'):(dateLabel(t.due)+' 截止 · 记得今天做完')});
    }
  }

var PXPAL={k:'#2E2A26',w:'#FFFFFF',l:'#E9E8E5',m:'#C9C6C1',p:'#F6B5BF',q:'#E58C9C',b:'#7EA6D9',n:'#4E7CB0'};
var PXSVG={};
function pxBuild(rows){
  var h=rows.length,w=rows[0].length,out='',y,x,x0,ch;
  for(y=0;y<h;y++){
    x0=0;
    for(x=1;x<=w;x++){
      if(x===w||rows[y].charAt(x)!==rows[y].charAt(x0)){
        ch=rows[y].charAt(x0);
        if(PXPAL[ch]) out+='<rect x="'+x0+'" y="'+y+'" width="'+(x-x0)+'" height="1" fill="'+PXPAL[ch]+'"/>';
        x0=x;
      }
    }
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+(w*2)+'" height="'+(h*2)+'" shape-rendering="crispEdges">'+out+'</svg>';
}
function pxInit(){ var k; for(k in PXCAT) PXSVG[k]=pxBuild(PXCAT[k]); }

var cfRAF=0, justDone='';
function confetti(x,y){
  var cv=$('#cf');
  if(!cv){ cv=document.createElement('canvas'); cv.id='cf'; document.body.appendChild(cv); }
  var dpr=Math.min(2,window.devicePixelRatio||1), W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  var cols=['#6E8F76','#D08C6A','#8C86B8','#E0B872','#C27F92','#7FA0B8','#8FAE8B','#EFC7A0'];
  var P=[],i;
  for(i=0;i<70;i++){
    var a=Math.random()*Math.PI*2, sp=3+Math.random()*6;
    P.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3.4,w:4+Math.random()*5,h:6+Math.random()*8,
      c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1});
  }
  var t0=performance.now();
  if(cfRAF) cancelAnimationFrame(cfRAF);
  function frame(now){
    var dt=Math.min(34,now-t0)/16.67; t0=now;
    ctx.clearRect(0,0,W,H);
    var alive=0;
    for(var i=0;i<P.length;i++){
      var p=P[i];
      p.vy+=0.44*dt; p.vx*=0.994; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; p.life-=0.0115*dt;
      if(p.life<=0||p.y>H+50) continue;
      alive++;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*(0.55+0.45*Math.abs(Math.cos(p.rot))));
      ctx.restore();
    }
    if(alive) cfRAF=requestAnimationFrame(frame);
    else { ctx.clearRect(0,0,W,H); cfRAF=0; }
  }
  cfRAF=requestAnimationFrame(frame);
}

function laneMap(list){
  var res={},cluster=[],end=-1,i;
  function flush(){
    if(!cluster.length)return;
    var lanes=[],j;
    for(j=0;j<cluster.length;j++){
      var t=cluster[j],li=-1,k;
      for(k=0;k<lanes.length;k++) if(lanes[k]<=t.start){li=k;break;}
      if(li<0){lanes.push(0);li=lanes.length-1;}
      lanes[li]=t.start+t.dur; res[t.id]={i:li};
    }
    for(j=0;j<cluster.length;j++) res[cluster[j].id].n=lanes.length;
    cluster=[];end=-1;
  }
  for(i=0;i<list.length;i++){
    var t=list[i];
    if(cluster.length && t.start>=end) flush();
    cluster.push(t); end=Math.max(end,t.start+t.dur);
  }
  flush();
  return res;
}

  var fx=[], ot=[], du=[], i, t;
  for(i=0;i<list.length;i++){
    t=list[i];
    if(isDueTask(t)) du.push(t);
    else if(isWeeklyTask(t)) ot.push(t);          // 按周任务算普通任务，不算每天固定
    else if(t.dailyDays||t.seriesId||t.period) fx.push(t);
    else ot.push(t);
  }
  var h='', foldF=!!S.settings.foldTlFixed, foldD=!!S.settings.foldDue;
  if(fx.length){var secs=periodSections(fx);var dist=secs.map(function(x){return x.n+' '+x.items.length;}).join(' · ');
    h+='<div class="ah ahf" data-g="fixed">'+UIx('grpFixed')+' <i>'+dist+'</i><b class="chev'+(foldF?'':' open')+'"></b></div>'+
    (foldF?'':periodListHTML(fx,anyCardHTML,S.settings.foldPeriod));}
  if(ot.length){var foldP=!!S.settings.foldTlPlain;
    h+='<div class="ah ahf" data-g="plain">'+UIx('grpExtra')+' <i>'+ot.length+'</i><b class="chev'+(foldP?'':' open')+'"></b></div>'+
    (foldP?'':ot.map(anyCardHTML).join(''));}
  if(du.length) h+='<div class="ah ahf" data-g="due">'+UIx('grpDue')+' <i>'+du.length+'</i><b class="chev'+(foldD?'':' open')+'"></b></div>'+
    (foldD?'':du.map(anyCardHTML).join(''));
  return h;
}
function wireAny(box){
  $$('.gsub2.foldable',box).forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      if(!S.settings.foldPeriod) S.settings.foldPeriod={};
      var k=el.dataset.fk; S.settings.foldPeriod[k]=!S.settings.foldPeriod[k];
      save(); render();
    });
  });
  $$('.ahf',box).forEach(function(el){
    el.addEventListener('click',function(){
      if(el.dataset.g==='due') S.settings.foldDue=!S.settings.foldDue;
      else if(el.dataset.g==='plain') S.settings.foldTlPlain=!S.settings.foldTlPlain;
      else S.settings.foldTlFixed=!S.settings.foldTlFixed;
      save(); render();
    });
  });
  $$('.acard',box).forEach(function(el){
    var t=byId(el.dataset.id); if(!t) return;
    el.addEventListener('click',function(ev){
      if(ev.target.closest('[data-act="done"]')){
        if(!canTick()) return;
        var was=t.done; snapshot(); setDone(t,!was); save();
        if(!was){ toast(UIx('toastDone',{n:energyCost(t)})); }
        render(); return;
      }
      if(ev.target.closest('[data-act="edit"]')){ ev.stopPropagation(); openEditor(t); return; }
      if(ev.target.closest('[data-act="del"]')){ delTask(t); return; }
    });
  });
}

function timeTagHTML(a,b){

/* 相邻安排的边界时间挨太近会叠字：按簇把一组标签上下推开，必要时再缩一号字。
   右对齐不动，只是纵向让开一点，仍然贴着各自块的边。 */
function layoutBTimes(){
  var tl=$('#tl'); if(!tl) return;
  var els=[].slice.call(tl.querySelectorAll('.btime'));
  if(els.length<2) return;
  var MINH=17, MAX=9;
  var items=els.map(function(el){
    el.classList.remove('bt-sm');
    return {el:el, y0:parseFloat(el.style.top)||0, dy:0};
  }).sort(function(a,b){ return a.y0-b.y0; });
  var clusters=[], cur=[items[0]];
  for(var i=1;i<items.length;i++){
    if(items[i].y0-cur[cur.length-1].y0<MINH) cur.push(items[i]);
    else { clusters.push(cur); cur=[items[i]]; }
  }
  clusters.push(cur);
  clusters.forEach(function(g){
    if(g.length<2) return;
    var mid=(g[0].y0+g[g.length-1].y0)/2, span=MINH*(g.length-1), start=mid-span/2;
    g.forEach(function(it,k){
      it.el.classList.add('bt-sm');                          // 挤在一起就缩一号字，省地方
      var ty=start+k*MINH, dy=ty-it.y0;
      it.dy=Math.max(-MAX,Math.min(MAX,dy));
    });
  });
  items.forEach(function(it){
    it.el.style.transform='translateY(-50%) translateY('+it.dy.toFixed(1)+'px)';
  });
  /* 整点刻度数字跟安排的时间撞上就让位：块边的时间更具体，刻度还有线在 */
  var ys=items.map(function(it){ return it.y0+it.dy; });
  [].slice.call(tl.querySelectorAll('.hline')).forEach(function(hl){
    var y=parseFloat(hl.getAttribute('data-y'))||0;
    var sp=hl.firstElementChild; if(!sp) return;
    var clash=ys.some(function(v){ return Math.abs(v-y)<13; });
    sp.classList.toggle('hx',clash);
  });
}

/* долгое нажатие на чипс — и папку можно двигать по строке */
function wireFolderChip(el){
  var ph=null, ox=0;
  pressDrag(el,{
    start:function(e){
      var r=el.getBoundingClientRect(); ox=e.clientX-r.left;
      ph=document.createElement('div'); ph.className='fph'; ph.style.width=r.width+'px';
      el.parentNode.insertBefore(ph,el);
      el.style.width=r.width+'px'; el.style.left=r.left+'px'; el.style.top=r.top+'px';
      el.classList.add('floating');
    },
    move:function(e){
      el.style.left=(e.clientX-ox)+'px';
      var row=ph.parentNode, before=null,
          chips=$$('.fchip',row).filter(function(x){
            return x!==el&&x.dataset.f!=='all'&&x.dataset.f!=='none'&&x.dataset.f!=='+';
          });
      for(var i=0;i<chips.length;i++){
        var r=chips[i].getBoundingClientRect();
        if(e.clientX<r.left+r.width/2){ before=chips[i]; break; }
      }
      row.insertBefore(ph, before || $('.fchip[data-f="none"]',row) || $('.fchip.add',row));
    },
    end:function(){
      var row=ph.parentNode;
      el.classList.remove('floating'); el.removeAttribute('style');
      row.insertBefore(el,ph); ph.remove(); ph=null;
      reorderFolders($$('.fchip',row).map(function(x){return x.dataset.f;})
        .filter(function(id){ return id!=='all'&&id!=='none'&&id!=='+'; }));
      renderFolders();
    }
  });
}

function newFolder(host,cb){
  var el=document.createElement('input');
  el.className='finput'; el.placeholder=tr('Название папки'); el.maxLength=24;
  host.appendChild(el); el.focus(); host.scrollLeft=host.scrollWidth;
  var done=false;
  function fin(ok){
    if(done)return; done=true;
    var v=el.value.trim(), f=null;
    if(ok&&v){
      f=S.folders.filter(function(x){return x.name.toLowerCase()===v.toLowerCase();})[0]||null;
      if(!f){ f={id:uid(),name:v,ord:S.folders.length}; S.folders.push(f); save(); }
    }
    cb(f);
  }
  el.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();fin(true);} else if(e.key==='Escape'){fin(false);}
  });
  el.addEventListener('blur',function(){fin(true);});
}

var NOTE_TAGS={H2:1,H3:1,P:1,DIV:1,BR:1,UL:1,OL:1,LI:1,B:1,STRONG:1,I:1,EM:1,U:1,S:1};
function cleanHTML(html){
  var tpl=document.createElement('template'); tpl.innerHTML=html||'';
  (function walk(node){
    var kids=Array.prototype.slice.call(node.childNodes), i, c, tag, r;
    for(i=0;i<kids.length;i++){
      c=kids[i];
      if(c.nodeType===3) continue;
      if(c.nodeType!==1){ node.removeChild(c); continue; }
      walk(c);
      tag=c.tagName; if(tag==='H1'||tag==='H4') tag='H2';
      if(!NOTE_TAGS[tag]){ while(c.firstChild) node.insertBefore(c.firstChild,c); node.removeChild(c); continue; }
      if(c.tagName!==tag){ r=document.createElement(tag); while(c.firstChild) r.appendChild(c.firstChild); node.replaceChild(r,c); c=r; }
      while(c.attributes.length) c.removeAttribute(c.attributes[0].name);
    }
  })(tpl.content);
  // пустые абзацы, которые остаются после execCommand, дают лишние отступы
  Array.prototype.slice.call(tpl.content.querySelectorAll('p,div')).forEach(function(el){
    if(!el.textContent.trim() && !el.querySelector('br,ul,ol,li,h2,h3')) el.parentNode.removeChild(el);
  });
  return tpl.innerHTML;
}
function textOf(html){
  var t=document.createElement('template');
  t.innerHTML=(html||'').replace(/<\/?(p|div|li|h2|h3|ul|ol|br)[^>]*>/gi,' ');
  return (t.content.textContent||'').replace(/\s+/g,' ').trim();
}
function fmtStamp(ms){
  if(!ms) return '';
  var d=new Date(ms), day=isoOf(d), t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(day===todayISO()) return tr('Сегодня,')+' '+t;
  if(day===addDays(todayISO(),-1)) return tr('Вчера,')+' '+t;
  return d.toLocaleDateString(LOCALE,{day:'numeric',month:'short'})+', '+t;
}

function keepCaret(){
  if(S.view!=='note') return;
  var sel=window.getSelection(); if(!sel||!sel.rangeCount) return;
  var body=$('#nBody'); if(!body.contains(sel.anchorNode)) return;
  var rects=sel.getRangeAt(0).getClientRects(), r=rects.length?rects[rects.length-1]:null;
  if(!r||!r.height){ var el=sel.anchorNode; if(el&&el.nodeType===3) el=el.parentNode; r=el&&el.getBoundingClientRect&&el.getBoundingClientRect(); }
  if(!r||!r.height) return;
  var bar=$('#nToolbar').getBoundingClientRect(), box=body.getBoundingClientRect();
  if(r.bottom>bar.top-10) body.scrollTop+=(r.bottom-(bar.top-10))+20;
  else if(r.top<box.top+10) body.scrollTop-=((box.top+10)-r.top)+20;
}

/* ---------- обмен «дела ⇄ заметка» ----------
   Формат строки:  - 09:00 1h30m Название #{Папка} !high ^id
   Заголовок дня:  ## 2026-10-05   (или ## backlog для дел без времени)
   Время можно не писать — при импорте дело само встанет в свободное окно дня.
   ^id — служебная метка: если она сохранилась, дело обновится, а не продублируется. */

function durToText(m){
  var h=Math.floor(m/60), mm=m%60;
  return (h?h+'h':'')+(mm?mm+'m':(h?'':'0m'));
}
function textToDur(str){
  var m=/^(\d+)\s*(?:h|ч)\s*(?:(\d+)\s*(?:m|м|мин)?)?$/i.exec(str);
  if(m) return (+m[1])*60+(+(m[2]||0));
  m=/^(\d+)\s*(?:m|м|мин|min)$/i.exec(str);
  if(m) return +m[1];
  return 0;
}
var PRI_TOKEN=['low','med','high','urgent'];
function taskToLine(t){
  var parts=[];
  if(t.start!=null) parts.push(hhmm(t.start));
  parts.push(durToText(t.dur));
  parts.push(t.title||tr('Без названия'));
  if(t.folder&&folderById(t.folder)) parts.push('#{'+folderName(t.folder)+'}');
  if(t.pri!==1) parts.push('!'+PRI_TOKEN[t.pri]);
  parts.push('^'+t.id);
  return '- '+parts.join(' ');
}
/* заметка ← дела */
function tasksToNoteBody(tasks,intro){
  var byDay={}, days=[], back=[];
  tasks.forEach(function(t){
    if(isSched(t)){ if(!byDay[t.date]){byDay[t.date]=[];days.push(t.date);} byDay[t.date].push(t); }
    else back.push(t);
  });
  days.sort();
  var html='<p>'+esc(intro)+'</p>';
  days.forEach(function(d){
    html+='<h3>## '+d+'</h3><ul>'+byDay[d].sort(function(a,b){return a.start-b.start;})
      .map(function(t){ return '<li>'+esc(taskToLine(t).slice(2))+'</li>'; }).join('')+'</ul>';
  });
  if(back.length){
    html+='<h3>## backlog</h3><ul>'+back.map(function(t){ return '<li>'+esc(taskToLine(t).slice(2))+'</li>'; }).join('')+'</ul>';
  }
  return html;
}
function exportTasksToNote(tasks,title){
  if(!tasks.length){ toast(tr('Нечего выгружать')); return null; }
  snapshot();
  var note=normalizeNote({id:uid(),title:title,upd:Date.now(),
    body:tasksToNoteBody(tasks,tr('Формат: «## 2026-10-05» — день, строки «- 09:00 1h Название #{Папка} !high ^id». Время можно не указывать — приложение само найдёт свободное окно. Метку ^id не меняйте.'))});
  S.notes.push(note); save(); render(); openNote(note.id);
  toast(tr('Заметка создана'),true);
  return note;
}

/* дела ← заметка */
function noteToLines(html){
  var src=(html||'').replace(/<li[^>]*>/gi,'\n- ').replace(/<(h2|h3|p|div)[^>]*>/gi,'\n').replace(/<br\s*\/?>/gi,'\n');
  var tpl=document.createElement('template'); tpl.innerHTML=src;
  return (tpl.content.textContent||'').split('\n').map(function(x){return x.trim();}).filter(Boolean);
}
function parseNote(html){
  var out=[], day=null, lines=noteToLines(html), i;
  for(i=0;i<lines.length;i++){
    var ln=lines[i], head=ln.replace(/^#+\s*/,'').trim();
    var isBullet=/^[-*•]\s+/.test(ln)||/^\d+[.)]\s+/.test(ln);
    if(!isBullet){
      var d=/^(\d{4}-\d{2}-\d{2})\b/.exec(head);
      if(d){ day=d[1]; continue; }
      if(/^(backlog|без времени|no time|без даты)$/i.test(head)){ day=null; continue; }
      continue;                                   // прочий текст (справка, заголовки) пропускаем
    }
    var rest=ln.replace(/^([-*•]|\d+[.)])\s+/,'').trim(), item={date:day,start:null,dur:0,pri:1,folder:null,id:null};
    var m=/^(\d{1,2}):(\d{2})\s*(?:[-–—]\s*\d{1,2}:\d{2})?\s*/.exec(rest);
    if(m){ item.start=(+m[1])*60+(+m[2]); rest=rest.slice(m[0].length); }
    m=/^(\d+\s*(?:h|ч)\s*(?:\d+\s*(?:m|м|мин)?)?|\d+\s*(?:m|м|мин|min))\s+/i.exec(rest);
    if(m){ item.dur=textToDur(m[1].trim()); rest=rest.slice(m[0].length); }
    m=/\^([A-Za-z0-9]{4,32})\s*$/.exec(rest);
    if(m){ item.id=m[1]; rest=rest.slice(0,m.index); }
    m=/!(urgent|high|med|medium|low|[0-3])\b/i.exec(rest);
    if(m){
      var p=m[1].toLowerCase();
      item.pri=(p==='urgent'||p==='3')?URGENT:((p==='high'||p==='2')?2:((p==='low'||p==='0')?0:1));
      rest=rest.replace(m[0],' ');
    }
    m=/#\{([^}]+)\}/.exec(rest) || /#(\S+)/.exec(rest);
    if(m){ item.folderName=m[1].trim(); rest=rest.replace(m[0],' '); }
    item.title=rest.replace(/\s*[·•]\s*/g,' ').replace(/\s+/g,' ').trim();
    if(!item.dur) item.dur=S.settings.dur;
    if(item.title) out.push(item);
  }
  return out;
}
function applyParsed(items){
  var folders={}, placed=0, created=0, updated=0;
  function folderIdFor(name){
    if(!name) return null;
    if(folders[name]) return folders[name];
    var f=S.folders.filter(function(x){return x.name.toLowerCase()===name.toLowerCase();})[0];
    if(!f){ f={id:uid(),name:name,ord:S.folders.length}; S.folders.push(f); }
    folders[name]=f.id; return f.id;
  }
  snapshot();
  items.forEach(function(it){
    var t=it.id&&byId(it.id);
    if(t){ updated++; } else { t=normalize({id:uid()}); S.tasks.push(t); created++; }
    t.title=it.title; t.dur=it.dur; t.pri=it.pri;
    t.folder=it.folderName!==undefined ? folderIdFor(it.folderName) : t.folder;
    if(it.date){
      if(t.seriesId) detachInstance(t);
      t.date=it.date;
      if(it.start!=null) t.start=it.start;
      else {                                      // без времени — ищем свободное окно этого дня
        var st=slotStarts(it.date,t.dur,t.id,1);
        t.start=st.length?st[0]:Math.max(dayMin(),Math.min(dayMax()-t.dur,t.start||dayMin()));
        placed++;
      }
      t.start=Math.max(dayMin(),Math.min(dayMax()-t.dur,t.start));
    }else{
      if(t.seriesId) detachInstance(t);
      t.date=null; t.start=null;
    }
  });
  save(); render();
  return {created:created,updated:updated,placed:placed};
}

/* окно импорта из открытой заметки */
function openImport(){
  var note=noteById(noteId); if(!note) return;
  var items=parseNote(note.body), days={}, back=0;
  items.forEach(function(it){ if(it.date) days[it.date]=1; else back++; });
  var nDays=Object.keys(days).length,
      upd=items.filter(function(i){return i.id&&byId(i.id);}).length,
      auto=items.filter(function(i){return i.date&&i.start==null;}).length;
  var sh=openSheet(
    '<div class="sh-h"><button class="tb" id="iCancel">'+tr('Отмена')+'</button>'+
    '<div class="t">'+tr('Из заметки в дела')+'</div><span class="tb r"></span></div>'+
    '<div class="sh-b">'+
      (items.length
        ? '<div class="card">'+
            '<div class="row"><span class="lbl">'+tr('Строк разобрано')+'</span><span style="color:var(--text-2)">'+items.length+'</span></div>'+
            '<div class="row"><span class="lbl">'+tr('Обновится')+'</span><span style="color:var(--text-2)">'+upd+'</span></div>'+
            '<div class="row"><span class="lbl">'+tr('Появится новых')+'</span><span style="color:var(--text-2)">'+(items.length-upd)+'</span></div>'+
            '<div class="row"><span class="lbl">'+tr('Дней')+'</span><span style="color:var(--text-2)">'+nDays+'</span></div>'+
            '<div class="row"><span class="lbl">'+tr('В список без времени')+'</span><span style="color:var(--text-2)">'+back+'</span></div>'+
          '</div>'+
          (auto?'<div class="hint">'+tr('Без указанного времени: {n} — встанут в свободные окна',{n:auto})+'</div>':'')+
          '<button class="prim" id="iGo">'+tr('Применить')+'</button>'
        : '<div class="hint">'+tr('В заметке не нашлось строк вида «- 09:00 1h Название». Проверьте формат.')+'</div>')+
      '<div class="hint" style="text-align:center">'+tr('Формат: «## 2026-10-05» — день, строки «- 09:00 1h Название #{Папка} !high ^id». Время можно не указывать — приложение само найдёт свободное окно. Метку ^id не меняйте.')+'</div>'+
    '</div>');
  $('#iCancel',sh).addEventListener('click',closeSheet);
  if($('#iGo',sh)) $('#iGo',sh).addEventListener('click',function(){
    var r=applyParsed(items);
    closeSheet();
    if(r.created+r.updated){
      setView('day');
      var first=Object.keys(days).sort()[0]; if(first){ goDay(first); if(S.settings.mode==='scale') applyTlTop(); }
      render();
    }
    toast(tr('Готово: {n}',{n:tr('новых')+' '+r.created+', '+tr('обновлено')+' '+r.updated}),true);
  });
}

/* ---------- разгрузка дней: дела за период → в список или в заметку ---------- */
function fmtShort(iso){ return isEN()? enMD(iso) : fromISO(iso).toLocaleDateString(LOCALE,{day:'numeric',month:'short'}).replace(/\.$/,''); }
function rangeTasks(from,to){
  return S.tasks.filter(function(t){
    return !t.done && isSched(t) && t.date>=from && t.date<=to;
  }).sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:a.start-b.start); });
}
function openUnload(){
  var U={from:mondayOf(S.date), to:addDays(mondayOf(S.date),6), dest:'list', clear:false};
  var sh=openSheet(
    '<div class="sh-h"><button class="tb" id="uCancel">'+tr('Отмена')+'</button>'+
    '<div class="t">'+tr('Разгрузить дела')+'</div><span class="tb r"></span></div>'+
    '<div class="sh-b">'+
      '<div class="card">'+
        '<div class="row"><span class="lbl">'+tr('С даты')+'</span><input type="date" id="uFrom"></div>'+
        '<div class="row"><span class="lbl">'+tr('По дату')+'</span><input type="date" id="uTo"></div>'+
      '</div>'+
      '<div class="hint" id="uCount"></div>'+
      '<div class="hint">'+tr('Куда')+'</div>'+
      '<div class="seg" id="uDest">'+
        '<button data-d="list">'+tr('В список задач')+'</button>'+
        '<button data-d="note">'+tr('В заметку')+'</button></div>'+
      '<div id="uOpts"></div>'+
      '<button class="prim" id="uGo">'+tr('Разгрузить')+'</button>'+
      '<div class="hint" style="text-align:center" id="uNote"></div>'+
    '</div>');

  function list(){ return rangeTasks(U.from,U.to); }
  function defName(){ return fmtShort(U.from)+' – '+fmtShort(U.to); }
  function draw(){
    $('#uFrom',sh).value=U.from; $('#uTo',sh).value=U.to;
    var l=list();
    $('#uCount',sh).textContent=l.length
      ? tr('Найдено: {n}',{n:l.length+' '+plur(l.length,"дело","дела","дел")})
      : tr('В этом диапазоне дел нет');
    $$('#uDest button',sh).forEach(function(b){ b.classList.toggle('on',b.dataset.d===U.dest); });
    $('#uOpts',sh).innerHTML = (U.dest==='list')
      ? '<div class="card"><div class="row"><span class="lbl">'+tr('Папка')+'</span>'+
        '<input id="uName" maxlength="24" style="flex:1;min-width:0;background:var(--chip);border:0;border-radius:8px;padding:7px 9px;font-size:15px;outline:none"></div></div>'
      : '<div class="card"><div class="row"><span class="lbl">'+tr('Убрать из расписания')+'</span>'+
        '<label class="sw"><input type="checkbox" id="uClear"'+(U.clear?' checked':'')+'><i></i></label></div></div>';
    if($('#uName',sh)) $('#uName',sh).value=U.name||defName();
    if($('#uClear',sh)) $('#uClear',sh).addEventListener('change',function(){ U.clear=this.checked; });
    $('#uNote',sh).textContent = (U.dest==='list')
      ? tr('Дела потеряют время и лягут в список задач — оттуда их удобно расставить заново.')
      : tr('Заметка со списком по дням; сами дела останутся на местах, если не включить переключатель.');
    $('#uGo',sh).disabled=!l.length;
    $('#uGo',sh).style.opacity=l.length?'1':'.5';
  }
  $('#uFrom',sh).addEventListener('change',function(){ if(this.value){ U.from=this.value; if(U.to<U.from) U.to=U.from; draw(); } });
  $('#uTo',sh).addEventListener('change',function(){ if(this.value){ U.to=this.value; if(U.to<U.from) U.from=U.to; draw(); } });
  $$('#uDest button',sh).forEach(function(b){ b.addEventListener('click',function(){
    if($('#uName',sh)) U.name=$('#uName',sh).value;
    U.dest=b.dataset.d; draw();
  });});
  $('#uCancel',sh).addEventListener('click',closeSheet);

  $('#uGo',sh).addEventListener('click',function(){
    var l=list(); if(!l.length) return;
    snapshot();
    if(U.dest==='list'){
      var name=(($('#uName',sh)&&$('#uName',sh).value)||defName()).trim()||defName();
      var f=S.folders.filter(function(x){return x.name.toLowerCase()===name.toLowerCase();})[0];
      if(!f){ f={id:uid(),name:name,ord:S.folders.length}; S.folders.push(f); }
      var ord=0;
      l.forEach(function(t){
        if(t.seriesId) detachInstance(t);
        t.date=null; t.start=null; t.folder=f.id; t.ord=ord++;
      });
      save(); closeSheet();
      S.folderSel=f.id; setView('list'); render();
      toast(tr('Перенесено в «{f}»',{f:name}),true);
    }else{
      var body=tasksToNoteBody(l,tr('Формат: «## 2026-10-05» — день, строки «- 09:00 1h Название #{Папка} !high ^id». Время можно не указывать — приложение само найдёт свободное окно. Метку ^id не меняйте.'));
      var note=normalizeNote({id:uid(),title:tr('Дела')+' '+defName(),body:body,upd:Date.now()});
      S.notes.push(note);
      if(U.clear) l.forEach(function(t){
        if(t.seriesId) detachInstance(t);
        S.tasks=S.tasks.filter(function(x){return x.id!==t.id;});
      });
      save(); closeSheet(); render();
      openNote(note.id);
      toast(tr('Заметка создана'),true);
    }
  });
  draw();
}

/* ---------- календарь месяца ---------- */
function openCalendar(){
  var d0=fromISO(S.date), y=d0.getFullYear(), m=d0.getMonth();
  var sh=openSheet(
    '<div class="sh-h"><button class="tb" id="cClose">'+tr('Закрыть')+'</button><div class="t">'+tr('Календарь')+'</div><button class="tb r strong" id="cToday">'+tr('Сегодня')+'</button></div>'+
    '<div class="sh-b">'+
      '<div class="cal-h"><button class="ib" id="cPrev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>'+
      '<div class="m" id="cM"></div>'+
      '<button class="ib" id="cNext"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>'+
      '<div class="cal-wd">'+WD.map(function(w){return '<span>'+w+'</span>';}).join('')+'</div>'+
      '<div class="cal" id="cGrid"></div>'+
      '<div class="hint" style="text-align:center;padding-top:8px">'+tr('Подчёркнуты дни, на которые есть дела')+'</div>'+
      '<div class="moodleg">'+MOODS.map(function(x,i){return '<span style="--mc:'+x[2]+'"><i></i>'+UIlist('mood',i)+'</span>';}).join('')+'</div>'+
      '<button class="subtle" id="cUnload">'+tr('Разгрузить дела')+'…</button>'+
    '</div>');
  function draw(){
    var first=new Date(y,m,1), wd=(first.getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
    var rows=Math.ceil((wd+dim)/7), start=new Date(y,m,1-wd), html='', i, t=todayISO();
    for(i=0;i<rows*7;i++){
      var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), iso=isoOf(d);
      var dueN=S.tasks.filter(function(x){return !x.done&&x.due===iso;}).length;
      var dueAny=S.tasks.filter(function(x){return x.due===iso&&!isDueTask(x);}).length;
      var plainN=S.tasks.filter(function(x){
        return x.date===iso && !x.dailyDays && !x.seriesId;
      }).length;
      var dueSpan=S.tasks.some(function(x){
        return isDueTask(x)&&!x.done&&iso>=t&&iso<=x.due;   // 截止任务：今天到截止日之间每天都标
      });
      var hasTask=!!(plainN||dueN||dueAny||dueSpan);
      var mc=(iso<=t)?' data-mc="1" style="'+moodColors(iso)+'"':'';
      html+='<button class="cd'+(d.getMonth()!==m?' out':'')+(iso===t?' today':'')+(iso===S.date?' sel':'')+(hasTask?' has':'')+(dueN?' dl':'')+
        '" data-d="'+iso+'"'+mc+'><span class="n">'+d.getDate()+'</span><span class="u"></span></button>';
    }
    $('#cGrid',sh).innerHTML=html;
    var lbl=first.toLocaleDateString(LOCALE,{month:'long',year:'numeric'}).replace(/\s*г\.$/,'');
    lbl=lbl.charAt(0).toUpperCase()+lbl.slice(1);
    $('#cM',sh).textContent=lbl;
  }
  $('#cPrev',sh).addEventListener('click',function(){ m--; if(m<0){m=11;y--;} draw(); });
  $('#cNext',sh).addEventListener('click',function(){ m++; if(m>11){m=0;y++;} draw(); });
  $('#cToday',sh).addEventListener('click',function(){ closeSheet(); goDay(todayISO()); applyTlTop(); });
  $('#cClose',sh).addEventListener('click',closeSheet);
  $('#cUnload',sh).addEventListener('click',function(){ closeSheet(); openUnload(); });
  $('#cGrid',sh).addEventListener('click',function(e){
    var c=e.target.closest('.cd'); if(!c) return;
    closeSheet(); setView('day'); goDay(c.dataset.d); if(S.settings.mode==='scale') applyTlTop();
  });
  draw();
}
